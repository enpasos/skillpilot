<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description">
  <title id="title">Punkte, Strecke und Gerade im Koordinatensystem</title>
  <desc id="description">Die Punkte P minus drei zwei und Q vier minus eins sind korrekt eingetragen. Eine Strecke verbindet beide Punkte mit Endpunkten. Eine Gerade durch beide Punkte setzt sich an beiden Enden geradlinig mit Pfeilen fort.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6b7280" flood-opacity="0.16"/>
    </filter>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#173b8f"/>
    </marker>
    <marker id="lineArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#173b8f"/>
    </marker>
  </defs>

  <rect width="1536" height="1024" fill="#fbfdff"/>

  <!-- Left inset: a finite segment. P and Q differ by the direction vector (7|-3). -->
  <rect x="24" y="228" width="342" height="516" rx="16" fill="#ffffff" stroke="#f27d0c" stroke-width="3"/>
  <line x1="70" y1="375" x2="280" y2="465" stroke="#173b8f" stroke-width="4"/>
  <circle cx="70" cy="375" r="9" fill="#173b8f"/>
  <circle cx="280" cy="465" r="9" fill="#173b8f"/>
  <g fill="#173b8f" font-family="DejaVu Sans, sans-serif" font-size="26">
    <text x="45" y="350">P(−3|2)</text>
    <text x="236" y="505">Q(4|−1)</text>
  </g>
  <text x="195" y="710" text-anchor="middle" fill="#f27d0c" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700">Strecke PQ – begrenzt</text>

  <!-- Central coordinate system: square unit grid, so the plotted direction is geometrically faithful. -->
  <g stroke="#9bb9ea" stroke-width="1.5">
    <line x1="400" y1="120" x2="400" y2="820"/><line x1="470" y1="120" x2="470" y2="820"/>
    <line x1="540" y1="120" x2="540" y2="820"/><line x1="610" y1="120" x2="610" y2="820"/>
    <line x1="680" y1="120" x2="680" y2="820"/><line x1="750" y1="120" x2="750" y2="820"/>
    <line x1="820" y1="120" x2="820" y2="820"/><line x1="890" y1="120" x2="890" y2="820"/>
    <line x1="960" y1="120" x2="960" y2="820"/><line x1="1030" y1="120" x2="1030" y2="820"/>
    <line x1="1100" y1="120" x2="1100" y2="820"/>
    <line x1="400" y1="120" x2="1100" y2="120"/><line x1="400" y1="190" x2="1100" y2="190"/>
    <line x1="400" y1="260" x2="1100" y2="260"/><line x1="400" y1="330" x2="1100" y2="330"/>
    <line x1="400" y1="400" x2="1100" y2="400"/><line x1="400" y1="470" x2="1100" y2="470"/>
    <line x1="400" y1="540" x2="1100" y2="540"/><line x1="400" y1="610" x2="1100" y2="610"/>
    <line x1="400" y1="680" x2="1100" y2="680"/><line x1="400" y1="750" x2="1100" y2="750"/>
    <line x1="400" y1="820" x2="1100" y2="820"/>
  </g>
  <g stroke="#173b8f" stroke-width="4" fill="none">
    <line x1="382" y1="470" x2="1128" y2="470" marker-end="url(#axisArrow)"/>
    <line x1="750" y1="842" x2="750" y2="90" marker-end="url(#axisArrow)"/>
  </g>
  <g stroke="#173b8f" stroke-width="3">
    <path d="M400 461 V479 M470 461 V479 M540 461 V479 M610 461 V479 M680 461 V479 M820 461 V479 M890 461 V479 M960 461 V479 M1030 461 V479 M1100 461 V479"/>
    <path d="M741 120 H759 M741 190 H759 M741 260 H759 M741 330 H759 M741 400 H759 M741 540 H759 M741 610 H759 M741 680 H759 M741 750 H759 M741 820 H759"/>
  </g>
  <g fill="#173b8f" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle">
    <text x="400" y="505">−5</text><text x="470" y="505">−4</text><text x="540" y="505">−3</text>
    <text x="610" y="505">−2</text><text x="680" y="505">−1</text><text x="730" y="505">0</text>
    <text x="820" y="505">1</text><text x="890" y="505">2</text><text x="960" y="505">3</text>
    <text x="1030" y="505">4</text><text x="1100" y="505">5</text>
  </g>
  <g fill="#173b8f" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="end">
    <text x="728" y="128">5</text><text x="728" y="198">4</text><text x="728" y="268">3</text>
    <text x="728" y="338">2</text><text x="728" y="408">1</text><text x="728" y="548">−1</text>
    <text x="728" y="618">−2</text><text x="728" y="688">−3</text><text x="728" y="758">−4</text>
    <text x="728" y="828">−5</text>
  </g>
  <g fill="#173b8f" font-family="DejaVu Sans, sans-serif" font-size="34" font-style="italic">
    <text x="1106" y="451">x</text><text x="728" y="65">y</text>
  </g>
  <circle cx="540" cy="330" r="10" fill="#173b8f"/>
  <circle cx="1030" cy="540" r="10" fill="#173b8f"/>
  <g fill="#173b8f" font-family="DejaVu Sans, sans-serif" font-size="27">
    <text x="553" y="320">P(−3|2)</text>
    <text x="965" y="585">Q(4|−1)</text>
  </g>

  <!-- Right inset: one single straight SVG line through both points, with collinear arrows at both ends. -->
  <rect x="1138" y="228" width="374" height="516" rx="16" fill="#ffffff" stroke="#f27d0c" stroke-width="3"/>
  <line x1="1160" y1="350" x2="1496" y2="494" stroke="#173b8f" stroke-width="4" marker-start="url(#lineArrow)" marker-end="url(#lineArrow)"/>
  <circle cx="1230" cy="380" r="9" fill="#173b8f"/>
  <circle cx="1440" cy="470" r="9" fill="#173b8f"/>
  <g fill="#173b8f" font-family="DejaVu Sans, sans-serif" font-size="26">
    <text x="1244" y="365">P(−3|2)</text>
    <text x="1378" y="515">Q(4|−1)</text>
  </g>
  <text x="1325" y="710" text-anchor="middle" fill="#f27d0c" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700">Gerade <tspan font-style="italic">g</tspan> – unbegrenzt</text>
</svg>
