<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1024" viewBox="0 0 1792 1024" role="img" aria-labelledby="title description">
  <title id="title">Sonnenfinsternis und Mondfinsternis mit geometrisch konstruierten Schattenstrahlen</title>
  <desc id="description">Oben sind vier gerade gemeinsame Tangenten an Sonne und Mond gezeichnet. Unten sind vier gerade gemeinsame Tangenten an Sonne und Erde gezeichnet. Der Mond liegt unten innerhalb des Erdschattens und ist kein Tangentialkoerper.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06182c"/>
      <stop offset="0.52" stop-color="#071426"/>
      <stop offset="1" stop-color="#020916"/>
    </linearGradient>
    <radialGradient id="sun" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#fff7a8"/>
      <stop offset="0.34" stop-color="#ffd84f"/>
      <stop offset="0.76" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#dc6b08"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.48" stop-color="#1677bd"/>
      <stop offset="1" stop-color="#073763"/>
    </radialGradient>
    <radialGradient id="moon" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="0.58" stop-color="#8b94a3"/>
      <stop offset="1" stop-color="#3f4754"/>
    </radialGradient>
    <radialGradient id="eclipsedMoon" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#f6ad71"/>
      <stop offset="0.6" stop-color="#a74426"/>
      <stop offset="1" stop-color="#4b1d1b"/>
    </radialGradient>
    <filter id="sunGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="topEarthClip"><circle cx="1240" cy="275" r="105"/></clipPath>
    <clipPath id="bottomEarthClip"><circle cx="900" cy="780" r="65"/></clipPath>
  </defs>

  <rect width="1792" height="1024" fill="url(#space)"/>
  <g fill="#c9e4ff" opacity="0.5">
    <circle cx="480" cy="95" r="2"/><circle cx="690" cy="61" r="1.5"/><circle cx="1040" cy="105" r="1.7"/>
    <circle cx="1500" cy="82" r="1.8"/><circle cx="1640" cy="180" r="1.3"/><circle cx="575" cy="450" r="1.5"/>
    <circle cx="1080" cy="445" r="1.4"/><circle cx="1530" cy="430" r="1.8"/><circle cx="480" cy="610" r="1.5"/>
    <circle cx="650" cy="945" r="1.7"/><circle cx="1070" cy="610" r="1.4"/><circle cx="1510" cy="920" r="1.6"/>
  </g>
  <line x1="40" y1="512" x2="1752" y2="512" stroke="#8ba7c2" stroke-width="2" opacity="0.55"/>

  <!-- TOP PANEL: every yellow segment is one straight common tangent of the Sun and Moon circles. -->
  <text x="48" y="65" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700">Sonnenfinsternis</text>

  <!-- Penumbra and umbra are bounded by the exact tangent lines listed below. -->
  <path d="M 860.785 234.023 L 1580 72.285 L 1580 299.871 L 873.949 233.186 Z" fill="#b8c6d9" opacity="0.18"/>
  <path d="M 873.949 316.814 L 1580 250.129 L 1580 477.715 L 860.785 315.977 Z" fill="#b8c6d9" opacity="0.18"/>
  <path d="M 873.949 233.186 L 1316.670 275 L 873.949 316.814 Z" fill="#111827" opacity="0.88"/>

  <g fill="none" stroke="#ffd34e" stroke-width="3.2" stroke-linecap="round">
    <!-- external common tangents: umbra boundaries -->
    <line x1="209.873" y1="170.465" x2="1580" y2="299.871"/>
    <line x1="209.873" y1="379.535" x2="1580" y2="250.129"/>
    <!-- internal common tangents: penumbra boundaries -->
    <line x1="223.037" y1="172.558" x2="1580" y2="477.715"/>
    <line x1="223.037" y1="377.442" x2="1580" y2="72.285"/>
  </g>

  <circle cx="200" cy="275" r="119" fill="#f59e0b" opacity="0.22" filter="url(#sunGlow)"/>
  <circle cx="200" cy="275" r="105" fill="url(#sun)" stroke="#ffe68b" stroke-width="3"/>
  <circle cx="870" cy="275" r="42" fill="url(#moon)" stroke="#d6dae1" stroke-width="2"/>
  <circle cx="1240" cy="275" r="105" fill="url(#earth)" stroke="#76c7f5" stroke-width="3"/>
  <g clip-path="url(#topEarthClip)" fill="#73a96b" opacity="0.9">
    <path d="M1168 224 C1190 205 1222 206 1235 224 C1222 239 1191 240 1175 255 C1158 248 1156 235 1168 224Z"/>
    <path d="M1240 270 C1274 242 1318 252 1334 281 C1307 292 1298 320 1268 326 C1240 313 1228 292 1240 270Z"/>
  </g>
  <ellipse cx="1210" cy="240" rx="28" ry="16" fill="#e8f5ff" opacity="0.4" clip-path="url(#topEarthClip)"/>

  <g fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle">
    <text x="200" y="430">Sonne</text><text x="870" y="350">Mond</text><text x="1240" y="430">Erde</text>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600">
    <rect x="1360" y="178" width="204" height="42" rx="12" fill="#273244" opacity="0.94"/>
    <text x="1378" y="207" fill="#f8fafc">Halbschatten</text>
    <rect x="930" y="254" width="190" height="42" rx="12" fill="#111827" opacity="0.94"/>
    <text x="948" y="283" fill="#f8fafc">Kernschatten</text>
  </g>

  <!-- BOTTOM PANEL: every yellow segment is one straight common tangent of the Sun and Earth circles. -->
  <text x="48" y="578" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700">Mondfinsternis</text>

  <path d="M 884.214 716.946 L 1580 542.755 L 1580 753.814 L 903.714 715.106 Z" fill="#b8c6d9" opacity="0.18"/>
  <path d="M 903.714 844.894 L 1580 806.186 L 1580 1017.245 L 884.214 843.054 Z" fill="#b8c6d9" opacity="0.18"/>
  <path d="M 903.714 715.106 L 1580 753.814 L 1580 806.186 L 903.714 844.894 Z" fill="#111827" opacity="0.9"/>

  <g fill="none" stroke="#ffd34e" stroke-width="3.2" stroke-linecap="round">
    <!-- external common tangents: umbra boundaries -->
    <line x1="206.000" y1="675.172" x2="1580" y2="753.814"/>
    <line x1="206.000" y1="884.828" x2="1580" y2="806.186"/>
    <!-- internal common tangents: penumbra boundaries -->
    <line x1="225.500" y1="678.143" x2="1580" y2="1017.245"/>
    <line x1="225.500" y1="881.857" x2="1580" y2="542.755"/>
  </g>

  <circle cx="200" cy="780" r="119" fill="#f59e0b" opacity="0.22" filter="url(#sunGlow)"/>
  <circle cx="200" cy="780" r="105" fill="url(#sun)" stroke="#ffe68b" stroke-width="3"/>
  <circle cx="900" cy="780" r="65" fill="url(#earth)" stroke="#76c7f5" stroke-width="3"/>
  <g clip-path="url(#bottomEarthClip)" fill="#73a96b" opacity="0.9">
    <path d="M850 748 C869 734 892 736 904 751 C893 764 874 768 858 781 C844 774 841 760 850 748Z"/>
    <path d="M908 786 C928 765 957 775 965 796 C948 805 942 823 919 830 C901 819 897 800 908 786Z"/>
  </g>
  <circle cx="1250" cy="780" r="28" fill="url(#eclipsedMoon)" stroke="#dd8a62" stroke-width="2"/>

  <g fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle">
    <text x="200" y="936">Sonne</text><text x="900" y="880">Erde</text><text x="1250" y="840">Mond</text>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600">
    <rect x="1370" y="618" width="204" height="42" rx="12" fill="#273244" opacity="0.94"/>
    <text x="1388" y="647" fill="#f8fafc">Halbschatten</text>
    <rect x="1328" y="763" width="190" height="42" rx="12" fill="#111827" opacity="0.94"/>
    <text x="1346" y="792" fill="#f8fafc">Kernschatten</text>
  </g>
</svg>
