<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1420" viewBox="0 0 900 1420"><title>Diodenpolung und qualitative Kennlinie</title><desc>Ein Stromkreis definiert Anode A, Kathode K und technische Stromrichtung A nach K. Die qualitative Kennlinie zeigt zunehmenden Durchlassstrom und kleinen Sperrstrom ohne universelle Schwellspannungsmarke.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#183249"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#183249}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="900" height="1420" fill="#f3f8fb"/><text x="35" y="60" font-size="40" font-weight="bold">Diode: Polung und Kennlinie</text><rect x="30" y="100" width="840" height="600" rx="18" fill="white" stroke="#bfd2df" stroke-width="2"/><text x="60" y="155" font-size="34" font-weight="bold">Schaltung und Bezugsrichtungen</text><svg x="50" y="170" width="800" height="500" viewBox="40 225 650 420"><path d="M150 335H325M395 335H565V535H150V395" fill="none" stroke="#183249" stroke-width="4"/><circle cx="150" cy="365" r="30" fill="white" stroke="#183249" stroke-width="3"/><text x="145" y="357" font-size="24">+</text><text x="143" y="386" font-size="24">−</text><path d="M325 305L375 335L325 365Z" fill="white" stroke="#183249" stroke-width="4"/><line x1="385" y1="300" x2="385" y2="370" stroke="#183249" stroke-width="4"/><line x1="375" y1="335" x2="395" y2="335" stroke="#183249" stroke-width="4"/><rect x="540" y="410" width="50" height="75" fill="white" stroke="#183249" stroke-width="3"/><text x="595" y="455" font-size="25">R</text><text x="290" y="395" font-size="25">A</text><text x="390" y="395" font-size="25">K</text><line x1="280" y1="265" x2="430" y2="265" stroke="#183249" stroke-width="3" marker-end="url(#arrow)"/><text x="345" y="250" font-size="24">I_D</text><text x="70" y="590" font-size="23">U_D: Spannung von A gegen K</text><text x="70" y="630" font-size="23">I_D positiv: technische Richtung A → K</text></svg><rect x="30" y="730" width="840" height="530" rx="18" fill="white" stroke="#bfd2df" stroke-width="2"/><text x="60" y="785" font-size="34" font-weight="bold">Kennlinie (schematisch)</text><svg x="50" y="810" width="800" height="420" viewBox="720 245 680 410"><line x1="770" y1="540" x2="1350" y2="540" stroke="#183249" stroke-width="3" marker-end="url(#arrow)"/><line x1="945" y1="595" x2="945" y2="260" stroke="#183249" stroke-width="3" marker-end="url(#arrow)"/><path d="M785 554C850 553 900 547 945 540C1080 523 1200 455 1300 280" fill="none" stroke="#176b94" stroke-width="5"/><text x="1320" y="580" font-size="25">U_D</text><text x="880" y="270" font-size="25">I_D</text><text x="1020" y="330" font-size="22">Durchlassstrom:</text><text x="1020" y="365" font-size="22">stark zunehmend</text><text x="765" y="630" font-size="23">Sperrstrom: klein, nicht exakt null</text></svg><text x="40" y="1310" font-size="30">Durchlasspolung: A positiver als K.</text><text x="40" y="1355" font-size="30">Sperrpolung: K positiver als A.</text><text x="40" y="1397" font-size="26">Strombegrenzte Kleinspannung · kein Messdatensatz</text></svg>
