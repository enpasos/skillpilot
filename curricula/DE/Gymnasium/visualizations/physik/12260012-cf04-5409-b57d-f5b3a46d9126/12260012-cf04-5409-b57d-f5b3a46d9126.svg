<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Fallen mit Luftwiderstand: Wie entsteht Grenzgeschwindigkeit?</title>
<desc>Drei maßstäbliche Kräftebilder desselben Körpers: überall gleich lange Gewichtskraft, zuerst kein Luftwiderstand, dann halbe Gegenkraft, schließlich gleich große entgegengesetzte Kräfte. Die positive Fallgeschwindigkeit nähert sich einem Grenzwert.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M0 0L10 5L0 10Z" fill="#183249"/>
</marker>
<linearGradient id="spectrum">
<stop stop-color="#8374b6"/>
<stop offset=".3" stop-color="#60b9cd"/>
<stop offset=".52" stop-color="#a8c970"/>
<stop offset=".73" stop-color="#e9c758"/>
<stop offset="1" stop-color="#d96756"/>
</linearGradient>
</defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#183249}line,path{stroke-linecap:round;stroke-linejoin:round}.title{font-weight:700}.muted{fill:#45647a}</style>
<rect width="1600" height="900" fill="#f3f8fb"/>
<text x="42" y="66" font-size="36" class="title">Fallen mit Luftwiderstand: Wie entsteht Grenzgeschwindigkeit?</text>
<text x="43" y="100" font-size="22">Blau: Gewichtskraft F_G · Orange: Luftwiderstand F_L</text>
<rect x="40" y="118" width="490" height="447" rx="18" fill="#fff" stroke="#bfd2df" stroke-width="2"/>
<text x="285" y="166" font-size="28" text-anchor="middle" class="title">Beim Loslassen</text>
<circle cx="285" cy="335" r="30" fill="#98bfd6" stroke="#183249" stroke-width="3"/>
<path data-force="FG-0" data-origin-x="285" data-origin-y="335" data-length="130" data-direction="down" d="M279 335L291 335L291 443L303 443L285 465L267 443L279 443Z" fill="#17658a" stroke="#183249" stroke-width="2"/>
<text x="315" y="420" font-size="25" style="fill:#17658a">F_G</text>
<text x="285" y="516" font-size="25" text-anchor="middle">v = 0; F_L = 0; a = g</text>
<rect x="555" y="118" width="490" height="447" rx="18" fill="#fff" stroke="#bfd2df" stroke-width="2"/>
<text x="800" y="166" font-size="28" text-anchor="middle" class="title">Beschleunigter Fall</text>
<circle cx="800" cy="335" r="30" fill="#98bfd6" stroke="#183249" stroke-width="3"/>
<path data-force="FG-1" data-origin-x="800" data-origin-y="335" data-length="130" data-direction="down" d="M794 335L806 335L806 443L818 443L800 465L782 443L794 443Z" fill="#17658a" stroke="#183249" stroke-width="2"/>
<text x="830" y="420" font-size="25" style="fill:#17658a">F_G</text>
<path data-force="FL-1" data-origin-x="800" data-origin-y="335" data-length="65" data-direction="up" d="M794 335L806 335L806 292L818 292L800 270L782 292L794 292Z" fill="#aa541d" stroke="#183249" stroke-width="2"/>
<text x="831" y="283" font-size="25" style="fill:#aa541d">F_L</text>
<text x="800" y="507" font-size="25" text-anchor="middle">0 &lt; F_L &lt; F_G</text>
<text x="800" y="544" font-size="24" text-anchor="middle">v nimmt zu; 0 &lt; a &lt; g</text>
<rect x="1070" y="118" width="490" height="447" rx="18" fill="#fff" stroke="#bfd2df" stroke-width="2"/>
<text x="1315" y="166" font-size="28" text-anchor="middle" class="title">Grenzzustand</text>
<circle cx="1315" cy="335" r="30" fill="#98bfd6" stroke="#183249" stroke-width="3"/>
<path data-force="FG-2" data-origin-x="1315" data-origin-y="335" data-length="130" data-direction="down" d="M1309 335L1321 335L1321 443L1333 443L1315 465L1297 443L1309 443Z" fill="#17658a" stroke="#183249" stroke-width="2"/>
<text x="1345" y="420" font-size="25" style="fill:#17658a">F_G</text>
<path data-force="FL-2" data-origin-x="1315" data-origin-y="335" data-length="130" data-direction="up" d="M1309 335L1321 335L1321 227L1333 227L1315 205L1297 227L1309 227Z" fill="#aa541d" stroke="#183249" stroke-width="2"/>
<text x="1346" y="237" font-size="25" style="fill:#aa541d">F_L</text>
<text x="1315" y="507" font-size="25" text-anchor="middle">F_L = F_G  ⇒  a = 0</text>
<text x="1315" y="544" font-size="24" text-anchor="middle">v = v_G (konstant)</text>
<text x="61" y="606" font-size="25" >Gleicher Kraftmaßstab: F_G bleibt gleich, F_L wächst mit der Fallgeschwindigkeit.</text>
<rect x="40" y="635" width="895" height="215" rx="18" fill="#e8f2f8" stroke="#bfd2df" stroke-width="2"/>
<text x="66" y="674" font-size="27" class="title">Kräftebilanz erklärt die Bewegung</text>
<text x="66" y="717" font-size="23" >m · a = F_G − F_L     (positive Richtung: nach unten)</text>
<text x="66" y="758" font-size="22" >Mit wachsendem Luftwiderstand wird die Beschleunigung kleiner.</text>
<text x="66" y="797" font-size="22" >Im Grenzzustand: Kräftegleichgewicht, aber kein Stillstand.</text>
<text x="66" y="832" font-size="20" >Modell: konstante Masse und Gewichtskraft; Auftrieb vernachlässigt.</text>
<text x="997" y="642" font-size="22" >Fallgeschwindigkeit v (schematisch)</text>
<line x1="1045" y1="827" x2="1534" y2="827" stroke="#183249" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1045" y1="827" x2="1045" y2="661" stroke="#183249" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1045" y1="678" x2="1515" y2="678" stroke="#183249" stroke-width="2" stroke-dasharray="7 7"/>
<text x="995" y="687" font-size="22" >v_G</text>
<text x="1015" y="847" font-size="21" >0</text>
<text x="1506" y="863" font-size="21" text-anchor="end">Zeit t</text>
