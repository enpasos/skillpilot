<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="650" viewBox="0 0 1260 650"><rect width="1260" height="650" fill="#fff"/><g font-family="DejaVu Sans, sans-serif" fill="#15374b"><text x="45" y="55" font-size="31">Zwei verschiedene Zeitspannen richtig verwenden</text><line x1="120" y1="230" x2="1100" y2="230" stroke="#15374b" stroke-width="3"/><line x1="120.0" y1="215" x2="120.0" y2="245" stroke="#15374b" stroke-width="2"/><text x="102.0" y="280" font-size="21">0,10</text><line x1="217.99999999999997" y1="215" x2="217.99999999999997" y2="245" stroke="#15374b" stroke-width="2"/><text x="199.99999999999997" y="280" font-size="21">0,15</text><line x1="316.0" y1="215" x2="316.0" y2="245" stroke="#15374b" stroke-width="2"/><text x="298.0" y="280" font-size="21">0,20</text><line x1="904.0" y1="215" x2="904.0" y2="245" stroke="#15374b" stroke-width="2"/><text x="886.0" y="280" font-size="21">0,50</text><line x1="1002.0000000000001" y1="215" x2="1002.0000000000001" y2="245" stroke="#15374b" stroke-width="2"/><text x="984.0000000000001" y="280" font-size="21">0,55</text><line x1="1100.0" y1="215" x2="1100.0" y2="245" stroke="#15374b" stroke-width="2"/><text x="1082.0" y="280" font-size="21">0,60</text><text x="65" y="145" font-size="25">Fenster 1: 0,10 bis 0,20 s</text><text x="760" y="145" font-size="25">Fenster 2: 0,50 bis 0,60 s</text><text x="65" y="355" font-size="25">v̄₁ = 0,04 m / 0,10 s = 0,40 m/s</text><text x="680" y="355" font-size="25">v̄₂ = 0,12 m / 0,10 s = 1,20 m/s</text><text x="155" y="440" font-size="27">Abstand der Mittelpunkte: 0,55 s − 0,15 s = 0,40 s</text><text x="155" y="505" font-size="27">ā = (1,20 − 0,40) m/s / 0,40 s = 2,0 m/s²</text><text x="65" y="595" font-size="21">Messung mit Sensor ODER Video. Das Ergebnis allein belegt keinen global konstanten Verlauf.</text></g></svg>
