<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="650" viewBox="0 0 1260 650"><rect width="1260" height="650" fill="#fff"/><g font-family="DejaVu Sans, sans-serif" fill="#15374b"><text x="45" y="55" font-size="30">Geschwindigkeit: Betrag und Richtung gemeinsam vergleichen</text><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#177d91"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45b00"/></marker></defs><line x1="180" y1="460" x2="480" y2="460" stroke="#177d91" stroke-width="6" marker-end="url(#head)"/><line x1="180" y1="460" x2="180" y2="160" stroke="#177d91" stroke-width="6" marker-end="url(#head)"/><line x1="480" y1="460" x2="180" y2="160" stroke="#b45b00" stroke-width="5" marker-end="url(#orange)"/><text x="350" y="505" font-size="24">v₁ = 2 m/s nach rechts</text><text x="195" y="135" font-size="24">v₂ = 2 m/s nach oben</text><text x="690" y="190" font-size="23">Beide Pfeile: gleicher Anfangspunkt.</text><text x="690" y="255" font-size="23">Δv: von der ersten zur zweiten Spitze.</text><text x="690" y="330" font-size="23">Gleicher Betrag, andere Richtung:</text><text x="690" y="380" font-size="24">Die Geschwindigkeit ändert sich.</text><text x="90" y="595" font-size="22">Die Pfeile stehen für kurze Messintervalle; die Mittelpunktzuordnung ist eine Näherung.</text></g></svg>
