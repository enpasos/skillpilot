<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Diskrete Energien im unendlichen Potenzialtopf</title>
<desc id="desc">Ein Elektron in einem eindimensionalen unendlichen Potenzialtopf. Die drei Energien liegen exakt im Verhältnis eins zu vier zu neun über V gleich null. Die Energie ist proportional zu n zum Quadrat und umgekehrt proportional zu L zum Quadrat.</desc>
<rect width="1600" height="900" fill="#f6f9fc"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#183249"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#183249">
<text x="65" y="70" font-size="43" font-weight="700">Diskrete Energien im unendlichen Potenzialtopf</text>
<path d="M120,735 V110 M115,730 H900" fill="none" stroke="#183249" stroke-width="4" marker-end="url(#arrow)"/>
<text x="75" y="140" font-size="32">E</text><text x="95" y="770" font-size="28">0</text>
<path d="M190,730 V110 M850,730 V110" fill="none" stroke="#183249" stroke-width="8"/>
<path d="M190,165 V110 M850,165 V110" stroke="#183249" stroke-width="5" marker-end="url(#arrow)"/>
<text x="220" y="140" font-size="26">V → ∞</text><text x="700" y="140" font-size="26">V → ∞</text>
<g stroke="#2b799e" stroke-width="5">
<line data-n="1" x1="190" x2="850" y1="670" y2="670"/>
<line data-n="2" x1="190" x2="850" y1="490" y2="490"/>
<line data-n="3" x1="190" x2="850" y1="190" y2="190"/>
</g>
<text x="405" y="650" font-size="32">E₁   (n = 1)</text>
<text x="355" y="470" font-size="32">E₂ = 4E₁   (n = 2)</text>
<text x="355" y="235" font-size="32">E₃ = 9E₁   (n = 3)</text>
<text x="435" y="718" font-size="25">V = 0 im Inneren</text>
<text x="155" y="780" font-size="29">x = 0</text><text x="810" y="780" font-size="29">x = L</text>
<line x1="265" x2="765" y1="765" y2="765" stroke="#183249" stroke-width="2"/>
<text x="445" y="802" font-size="26">Topfbreite L</text>
<rect x="960" y="185" width="565" height="500" rx="20" fill="#e5f0f8" stroke="#6c98b5" stroke-width="2"/>
<text x="998" y="270" font-size="35">Eₙ = n²h² / (8mₑL²)</text>
<text x="1000" y="332" font-size="28">n = 1, 2, 3, …</text>
<text x="1000" y="408" font-size="26">h: Planck-Konstante</text>
<text x="1000" y="454" font-size="26">mₑ: Elektronenmasse</text>
<text x="1000" y="532" font-size="28">Modell: ein Elektron,</text>
<text x="1000" y="577" font-size="28">unendlich hohe Wände</text>
<text x="1000" y="642" font-size="25">Keine erlaubte Energie bei n = 0.</text>
<text x="190" y="865" font-size="32" font-weight="700">Bei gleichem n: doppelte Breite L → ein Viertel der Energie</text>
</g></svg>
