<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Exoplaneten: zwei indirekte Nachweise</title>
<desc>Links Transitgeometrie und schematische Helligkeitskurve. Rechts getrennte konzentrische Kreisbahnen mit einheitlichem Drehsinn sowie Blau- und Rotverschiebung einer Stern-Spektrallinie.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M0 0L10 5L0 10Z" fill="#183249"/>
</marker>
