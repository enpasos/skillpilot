<text x="189" y="772" font-size="22" >Kurzzeitige Abschwächung bei passender Sichtlinie.</text>
<text x="69" y="815" font-size="20" class="muted">Schematisch; nicht jeder Planet erzeugt für uns einen Transit.</text>
<text x="822" y="165" font-size="29" class="title">Radialgeschwindigkeitsmethode</text>
<text x="822" y="205" font-size="20" >Kreisbahn-Modell · Ansicht von oben · nicht maßstäblich</text>
