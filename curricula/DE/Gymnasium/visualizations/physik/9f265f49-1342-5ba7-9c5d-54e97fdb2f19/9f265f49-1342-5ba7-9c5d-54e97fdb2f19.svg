<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 900 1110"><title>Dotierung: bewegliche Träger, insgesamt neutrales Material</title><desc>Ein einfaches Siliziummodell zeigt nach der Ionisation beim n-Donator ein ortsfestes positives Ion und ein bewegliches Elektron, beim p-Akzeptor ein ortsfestes negatives Ion und ein bewegliches Loch. Jede Paarbilanz ist neutral. Löcher sind fehlende Bindungselektronen.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#183249}.title{font-weight:700}</style><rect width="900" height="1110" fill="#f3f8fb"/><text x="35" y="60" font-size="38" class="title">Dotierung: bewegliche Träger</text><text x="35" y="108" font-size="29">Einfaches Siliziummodell · nach Ionisation</text><rect x="30" y="145" width="840" height="340" rx="18" fill="white" stroke="#bfd2df" stroke-width="2"/><text x="60" y="193" font-size="36" class="title">n-Dotierung</text><text x="60" y="237" font-size="30">Donator: 5 Außenelektronen</text><rect x="110" y="265" width="130" height="105" rx="6" fill="#e1eff6" stroke="#183249" stroke-width="2"/><text x="175" y="338" text-anchor="middle" font-size="64">+</text><circle cx="650" cy="317" r="53" fill="#e1eff6" stroke="#183249" stroke-width="2"/><text x="650" y="337" text-anchor="middle" font-size="64">−</text><text x="175" y="410" text-anchor="middle" font-size="29">Ion: ortsfest</text><text x="650" y="410" text-anchor="middle" font-size="29">Elektron: beweglich</text><text x="450" y="460" text-anchor="middle" font-size="30" class="title">Zusammen: elektrisch neutral</text><rect x="30" y="515" width="840" height="340" rx="18" fill="white" stroke="#bfd2df" stroke-width="2"/><text x="60" y="563" font-size="36" class="title">p-Dotierung</text><text x="60" y="607" font-size="30">Akzeptor: 3 Außenelektronen</text><rect x="110" y="635" width="130" height="105" rx="6" fill="#f8e7e4" stroke="#183249" stroke-width="2"/><text x="175" y="708" text-anchor="middle" font-size="64">−</text><circle cx="650" cy="687" r="53" fill="#f8e7e4" stroke="#183249" stroke-width="2"/><text x="650" y="707" text-anchor="middle" font-size="64">+</text><text x="175" y="780" text-anchor="middle" font-size="29">Ion: ortsfest</text><text x="650" y="780" text-anchor="middle" font-size="29">Loch: beweglich</text><text x="450" y="830" text-anchor="middle" font-size="30" class="title">Zusammen: elektrisch neutral</text><rect x="30" y="885" width="840" height="190" rx="18" fill="white" stroke="#bfd2df" stroke-width="2"/><text x="55" y="932" font-size="30" class="title">Loch = fehlendes Bindungselektron</text><text x="55" y="977" font-size="29">Nachbarelektron füllt Platz; Loch rückt weiter.</text><text x="55" y="1022" font-size="29">Kein Proton, kein Hohlraum. Ionen ortsfest.</text><text x="55" y="1058" font-size="24">Symbolbild: nur die Dotierbeiträge sind gezählt.</text></svg>
