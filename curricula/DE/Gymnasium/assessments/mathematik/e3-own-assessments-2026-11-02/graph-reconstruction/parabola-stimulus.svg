    <dc:title>Parabel mit S und P</dc:title>
    <dc:description>Koordinatensystem mit Einheitsgitter. Eine nach oben geöffnete Parabel hat den markierten Scheitel S bei (−1,−2) und den markierten Punkt P bei (1,0). Sie schneidet die x-Achse außerdem bei x=−3. Die Achsenskalierung beträgt auf beiden Achsen eine Einheit je Gitterabstand.</dc:description>
