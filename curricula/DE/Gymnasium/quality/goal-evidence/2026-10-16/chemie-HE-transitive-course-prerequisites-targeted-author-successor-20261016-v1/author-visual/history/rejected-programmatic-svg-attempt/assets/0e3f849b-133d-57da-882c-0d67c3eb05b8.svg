<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#172b42} .h{font-size:48px;font-weight:700}.sub{font-size:27px;fill:#425c72}.t{font-size:30px}.b{font-size:33px;font-weight:700}.small{font-size:26px}.note{font-size:25px;fill:#425c72}.panel{fill:#f6f9fc;stroke:#d3dfe8;stroke-width:2}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356e9c"/></marker></defs><rect width="1600" height="1000" fill="#fff"/><text class="h" x="65" y="80">Faraday-Gesetze qualitativ deuten</text><text class="sub" x="65" y="125">Ladung · Elektronenübertragung · Stoff- und Massenumsatz</text><rect class="panel" x="55" y="165" width="1490" height="345" rx="20"/><text class="b" x="90" y="215">1  Gleicher Metallionentyp, gleiche Bedingungen</text><text class="small" x="100" y="265">weniger übertragene Ladung</text><text class="small" x="885" y="265">mehr übertragene Ladung</text><rect x="115" y="295" width="150" height="45" rx="7" fill="#6b9bc0"/><rect x="900" y="295" width="300" height="45" rx="7" fill="#356e9c"/><path d="M300 320H710" stroke="#356e9c" stroke-width="5" marker-end="url(#a)"/><text class="t" x="340" y="305">mehr Elektronen</text><path d="M180 365V410" stroke="#356e9c" stroke-width="4" marker-end="url(#a)"/><path d="M1080 365V410" stroke="#356e9c" stroke-width="4" marker-end="url(#a)"/><rect x="105" y="435" width="170" height="12" fill="#be7044"/><rect x="905" y="423" width="170" height="24" fill="#be7044"/><text class="small" x="100" y="482">kleinerer Stoffumsatz</text><text class="small" x="885" y="482">größerer Stoffumsatz</text><rect class="panel" x="55" y="535" width="1490" height="315" rx="20"/><text class="b" x="90" y="587">2  Gleiche Ladungsmenge, verschiedene Metallionen</text><text class="t" x="145" y="657">Ag⁺  +  e⁻  →  Ag</text><text class="t" x="885" y="657">Cu²⁺  +  2 e⁻  →  Cu</text><text class="small" x="145" y="712">ein Elektron je Silberatom</text><text class="small" x="885" y="712">zwei Elektronen je Kupferatom</text><text class="small" x="145" y="757">Bei gleicher Ladung: unterschiedliche Teilchen- und Stoffmengen</text><text class="small" x="145" y="802">Für den Massenvergleich zusätzlich die molaren Massen beachten.</text><text class="note" x="65" y="902">Vergleichsmodell ohne Nebenreaktionen. Schematische Bilder, keine Messdaten.</text><text class="note" x="65" y="946">Qualitative Aussagen; keine Strom-, Zeit- oder Massenrechnung. Eigene Darstellung · CC BY 4.0</text></svg>