<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">NI EP5: Stoffströme der Fraktionierung und des Crackens / Material streams in fractionation and cracking</title>
<desc id="desc">A: Heated crude feeds a column hotter below and cooler above. A light low-boiling fraction exits high; a heavy high-boiling fraction exits low and enters thermal cracking without oxygen to form a shorter-hydrocarbon mixture. B: A deliberately incorrect fresh diagram bypasses cracking and claims short molecules from a changed outlet. Both are qualitative classroom models, not plant instructions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="1120" height="680" fill="white"/>
<g font-family="Arial,sans-serif" font-size="17" fill="#172033">
<text x="25" y="32">A · Qualitatives Verfahrensschema / Qualitative process model</text>
<rect x="25" y="100" width="200" height="75" rx="8" fill="#eef4fc" stroke="#334155" stroke-width="2"/>
<text x="37" y="127">Rohöl / Crude oil</text>
<text x="37" y="150">Stoffgemisch / Mixture</text>
<rect x="300" y="70" width="265" height="230" rx="8" fill="#eef4fc" stroke="#334155" stroke-width="2"/>
<text x="312" y="97">Erhitzen → Kolonne</text>
<text x="312" y="120">Heating → Column</text>
<text x="312" y="143"></text>
<text x="312" y="166">oben kühler / cooler top</text>
<text x="312" y="189"></text>
<text x="312" y="212">unten heißer / hotter base</text>
<rect x="755" y="60" width="330" height="90" rx="8" fill="#eef4fc" stroke="#334155" stroke-width="2"/>
<text x="767" y="87">Leichte Fraktion / Light fraction</text>
<text x="767" y="110">niedriger siedend / lower boiling</text>
<text x="767" y="133">weiterhin Gemisch / still a mixture</text>
<rect x="300" y="350" width="300" height="75" rx="8" fill="#eef4fc" stroke="#334155" stroke-width="2"/>
<text x="312" y="377">Schwere Fraktion / Heavy fraction</text>
<text x="312" y="400">höher siedend / higher boiling</text>
<rect x="755" y="255" width="330" height="90" rx="8" fill="#eef4fc" stroke="#334155" stroke-width="2"/>
<text x="767" y="282">Thermisches Cracken</text>
<text x="767" y="305">Thermal cracking</text>
<text x="767" y="328">ohne O₂-Zufuhr / no oxygen feed</text>
<rect x="755" y="395" width="330" height="75" rx="8" fill="#eef4fc" stroke="#334155" stroke-width="2"/>
<text x="767" y="422">Kürzeres Produktgemisch</text>
<text x="767" y="445">Shorter-hydrocarbon mixture</text>
<path d="M225,137 L300,137" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="248" y="123" font-size="15">F1</text>
<path d="M565,100 L755,100" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="640" y="85" font-size="15">F2</text>
<path d="M432,300 L432,350" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="448" y="333" font-size="15">F3</text>
<path d="M600,385 L665,385 L665,300 L755,300" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="680" y="285" font-size="15">F4</text>
<path d="M920,345 L920,395" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="939" y="378" font-size="15">F5</text>
<text x="25" y="483" font-size="15">Fraktionen sind Gemische; keine Ausbeuten/Anlagenbedienung / Fractions remain mixtures; no yields/plant operation.</text>
<line x1="25" y1="500" x2="1090" y2="500" stroke="#94a3b8"/>
<text x="25" y="533">B · Frischer Fehlervorschlag — prüfen, nicht übernehmen / Fresh incorrect proposal — evaluate, do not copy</text>
<rect x="25" y="562" width="255" height="64" rx="8" fill="#fff4ed" stroke="#334155" stroke-width="2"/>
<text x="37" y="589">Schwere Fraktion</text>
<text x="37" y="612">Heavy fraction</text>
<rect x="790" y="562" width="295" height="64" rx="8" fill="#fff4ed" stroke="#334155" stroke-width="2"/>
<text x="802" y="589">Angeblich kurze Moleküle</text>
<text x="802" y="612">Claimed shorter molecules</text>
<path d="M280,594 L790,594" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="325" y="577" font-size="15">„Nur anderer Auslass“ / “Only a different outlet”</text>
<text x="25" y="660" font-size="15">Pfeile sind Stoffströme, keine Reaktionsgleichungen / Arrows are material streams, not reaction equations.</text>
</g></svg>
