<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>Aufbau des Sonnensystems</title>
<desc>Zwei Bahnschemata: Sonne mit drei exemplarischen Planeten und eine Kometenellipse mit der Sonne im linken Brennpunkt.</desc>
<rect width="1600" height="900" fill="#fff"/>
<g font-family="Arial, Liberation Sans, sans-serif" fill="#183249">
<text x="50" y="85" font-size="42" text-anchor="start" font-weight="700">Aufbau des Sonnensystems</text>
<rect x="50" y="160" width="720" height="610" rx="22" fill="#f5f9fc" stroke="#ccd9e2" stroke-width="2"/>
<rect x="830" y="160" width="720" height="610" rx="22" fill="#f5f9fc" stroke="#ccd9e2" stroke-width="2"/>
<text x="85" y="218" font-size="32" text-anchor="start" font-weight="700">Planeten</text>
<text x="865" y="218" font-size="32" text-anchor="start" font-weight="700">Komet</text>
<circle cx="360" cy="470" r="88" fill="none" stroke="#3b789e" stroke-width="3" data-orbit="0"/>
<circle cx="427.4119" cy="413.4347" r="13" fill="#d97947" stroke="#183249" stroke-width="2" data-planet-orbit="0"/>
<circle cx="360" cy="470" r="154" fill="none" stroke="#3b789e" stroke-width="3" data-orbit="1"/>
<circle cx="220.4286" cy="535.0832" r="13" fill="#61a9b0" stroke="#183249" stroke-width="2" data-planet-orbit="1"/>
<circle cx="360" cy="470" r="220" fill="none" stroke="#3b789e" stroke-width="3" data-orbit="2"/>
<circle cx="515.5635" cy="625.5635" r="13" fill="#897ec0" stroke="#183249" stroke-width="2" data-planet-orbit="2"/>
<circle cx="360" cy="470" r="42" fill="#ffd36b" stroke="#b57b26" stroke-width="2"/>
<text x="360" y="467" font-size="21" text-anchor="middle" >Sonne</text>
<text x="360" y="491" font-size="16" text-anchor="middle" >ein Stern</text>
<ellipse cx="1210" cy="470" rx="280" ry="168" fill="none" stroke="#3b789e" stroke-width="3" data-comet-orbit="true"/>
<circle cx="986" cy="470" r="29" fill="#ffd36b" stroke="#b57b26" stroke-width="2" data-comet-sun="true"/>
<text x="986" y="532" font-size="24" text-anchor="middle" >Sonne</text>
<circle cx="1490" cy="470" r="12" fill="#94a4ae" stroke="#183249" stroke-width="2" data-comet="true"/>
<text x="1475" y="425" font-size="24" text-anchor="middle" >Komet</text>
<text x="85" y="726" font-size="27" text-anchor="start" >Planeten umlaufen die Sonne.</text>
<text x="865" y="691" font-size="27" text-anchor="start" >Häufig stark gestreckte Bahn;</text>
<text x="865" y="729" font-size="27" text-anchor="start" >Sonne in einem Brennpunkt.</text>
<text x="800" y="826" font-size="26" text-anchor="middle" >Zwei Bahnschemata – dieselbe Sonne in beiden Darstellungen.</text>
<text x="800" y="867" font-size="23" text-anchor="middle" >Körper, Größen und Abstände sind beispielhaft und nicht maßstabsgetreu.</text>
</g>
</svg>
