<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Optisches Gitter: Hauptmaxima</title><style>text{font-family:'DejaVu Sans',sans-serif}line,path{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="dim" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#243445" stroke-width="1.3"/></marker><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#243445" stroke-width="1.3"/></marker></defs><rect width="1920" height="1080" fill="#f4f8fa"/><path d="M0 0H1920V118Q1360 180 960 134T0 158Z" fill="#deedf3"/><text x="52" y="79" font-size="53" fill="#243445" >Optisches Gitter: Hauptmaxima</text><text x="54" y="132" font-size="25" fill="#277393" >Senkrechter, kohärenter, monochromatischer Einfall · Fernfeld</text><rect x="36" y="173" width="1028" height="685" rx="22" fill="#edf5f8" stroke="#bdd3dd" stroke-width="2"/><rect x="1090" y="173" width="794" height="210" rx="22" fill="#ffffff" stroke="#bdd3dd" stroke-width="2"/><rect x="1090" y="400" width="794" height="185" rx="22" fill="#ffffff" stroke="#bdd3dd" stroke-width="2"/><rect x="1090" y="602" width="794" height="256" rx="22" fill="#fff7e9" stroke="#bdd3dd" stroke-width="2"/><text x="64" y="204" font-size="23" fill="#277393" >Querschnitt · Spalte vergrößert, nicht maßstäblich</text><rect x="242" y="235" width="16" height="36" rx="2" fill="#617282"/><rect x="242" y="281" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="309" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="337" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="365" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="393" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="421" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="449" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="477" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="505" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="533" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="561" width="16" height="18" rx="2" fill="#617282"/><rect x="242" y="589" width="16" height="31" rx="2" fill="#617282"/><line x1="65" y1="290" x2="155" y2="290" stroke="#26764e" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="360" x2="155" y2="360" stroke="#26764e" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="430" x2="155" y2="430" stroke="#26764e" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="500" x2="155" y2="500" stroke="#26764e" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="570" x2="155" y2="570" stroke="#26764e" stroke-width="2" marker-end="url(#arrow)"/><text x="62" y="263" font-size="25" fill="#26764e" >Licht</text><text x="65" y="650" font-size="23" fill="#26764e" >λ: Wellenlänge</text><line x1="250" y1="430" x2="880" y2="430" stroke="#243445" stroke-width="2" stroke-dasharray="8 8"/><line x1="250" y1="430" x2="880" y2="267.3346994592885" stroke="#277393" stroke-width="3" stroke-dasharray="8 8"/><path d="M358,430 A108,108 0 0 0 354.57055034760026,403" fill="none" stroke="#277393" stroke-width="3"/><text x="400" y="423" font-size="25" fill="#277393" >θ₁</text><line x1="250" y1="683" x2="880" y2="683" stroke="#243445" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/><line x1="250" y1="663" x2="250" y2="696" stroke="#243445" stroke-width="3" /><line x1="880" y1="663" x2="880" y2="696" stroke="#243445" stroke-width="3" /><text x="498" y="718" font-size="24" fill="#243445" >L: Schirmabstand</text><line x1="880" y1="235" x2="880" y2="620" stroke="#243445" stroke-width="3" /><text x="843" y="221" font-size="25" fill="#243445" >Schirm</text><text x="365" y="620" font-size="22" fill="#277393" >Gestrichelt: geometrische Bezugslinien</text><rect x="882" y="263.3346994592885" width="48" height="8" rx="3" fill="#54a875"/><text x="966" y="276.3346994592885" font-size="25" fill="#243445" >m = +1</text><rect x="882" y="426" width="48" height="8" rx="3" fill="#54a875"/><text x="966" y="439" font-size="25" fill="#243445" >m = 0</text><rect x="882" y="588.6653005407115" width="48" height="8" rx="3" fill="#54a875"/><text x="966" y="601.6653005407115" font-size="25" fill="#243445" >m = -1</text><circle cx="880" cy="267.3346994592885" r="4" fill="#243445"/><circle cx="880" cy="430" r="4" fill="#243445"/><text x="851" y="252.33469945928852" font-size="24" fill="#243445" >P</text><text x="850" y="459" font-size="24" fill="#243445" >O</text><line x1="941" y1="430" x2="941" y2="267.3346994592885" stroke="#243445" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="964" y="356.66734972964423" font-size="27" fill="#243445" >y₁</text><line x1="207" y1="416" x2="207" y2="444" stroke="#243445" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/><line x1="201" y1="416" x2="250" y2="416" stroke="#277393" stroke-width="1" /><line x1="201" y1="444" x2="250" y2="444" stroke="#277393" stroke-width="1" /><text x="183" y="442" font-size="28" fill="#277393" >g</text><text x="65" y="763" font-size="25" fill="#243445" >g: Abstand benachbarter Spaltmitten</text><text x="65" y="800" font-size="24" fill="#277393" >Nur Hauptmaximumrichtungen gezeigt;</text><text x="65" y="831" font-size="24" fill="#277393" >keine maßstäbliche Intensitätsdarstellung.</text><text x="1120" y="217" font-size="30" fill="#277393" >Gemeinsame Phase → Hauptmaximum</text><text x="1120" y="268" font-size="39" fill="#243445" >g sin θₘ = m λ</text><text x="1120" y="315" font-size="29" fill="#243445" >m = 0, ±1, ±2, …</text><text x="1120" y="354" font-size="24" fill="#243445" >Gangunterschied benachbarter Spalte: Δs ≈ g sin θ</text><text x="1120" y="444" font-size="33" fill="#243445" >Schirmposition: yₘ = L tan θₘ</text><text x="1120" y="490" font-size="27" fill="#243445" >Geometrisch möglich: |m λ / g| ≤ 1</text><text x="1120" y="532" font-size="25" fill="#243445" >Bei Gleichheit: θ = ±90°;</text><text x="1120" y="566" font-size="25" fill="#243445" >kein Schnitt mit einem endlichen Schirm.</text><text x="1120" y="644" font-size="29" fill="#9d521e" >Beispiel</text><text x="1120" y="683" font-size="29" fill="#243445" >500 Linien/mm → g = 2,0 µm</text><text x="1120" y="723" font-size="28" fill="#243445" >λ = 500 nm, L = 1,0 m, m = +1</text><text x="1120" y="764" font-size="29" fill="#243445" >sin θ₁ = 0,25 → θ₁ ≈ 14,5°</text><text x="1120" y="813" font-size="32" fill="#26764e" >y₁ = L tan θ₁ ≈ 0,258 m</text><rect x="36" y="884" width="1848" height="158" rx="22" fill="#e7f2eb" stroke="#bdd3dd" stroke-width="2"/><text x="66" y="927" font-size="30" fill="#26764e" >Warum entstehen dort Hauptmaxima?</text><text x="66" y="969" font-size="26" fill="#243445" >Der Gangunterschied benachbarter Spalte ist ein ganzzahliges Vielfaches von λ: Die Beiträge verstärken sich.</text><text x="66" y="1011" font-size="26" fill="#243445" >Die Bedingung beschreibt Hauptmaxima, nicht alle Nebenmaxima oder Minima eines realen Gitters.</text></svg>