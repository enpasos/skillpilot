<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" preserveAspectRatio="none" role="img" aria-labelledby="title desc">
  <title id="title">Gleich große, entgegengesetzte Impulse</title>
  <desc id="desc">Beide Pfeile beginnen an den markierten Jackenpunkten. Jede Länge von 145 Zeichnungseinheiten entspricht 2 kg·m/s.</desc>
  <!-- The origin marks are part of the generated scene. The same polygon and
       scale bind both momenta; the sign determines its horizontal direction. -->
  <defs>
    <path id="momentum" d="M0,-6 H118 V-19 L145,0 L118,19 V6 H0 Z"/>
  </defs>
  <g transform="translate(964 432) scale(-1 1)">
    <use href="#momentum" fill="#075da7"/><circle r="10" fill="#101924"/>
  </g>
  <g transform="translate(1463 433)">
    <use href="#momentum" fill="#c73537"/><circle r="10" fill="#101924"/>
  </g>
</svg>
