<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>Gezeiten: Unterschiede in der Anziehung</title>
<desc>Absolute Anziehung am mondfernen Rand, Erdmittelpunkt und mondnahen Rand mit streng wachsenden Pfeilen; rechts Differenzen zur Erdmitte, vergrößert dargestellt.</desc>
<rect width="1600" height="900" fill="#fff"/>
<g font-family="Arial, Liberation Sans, sans-serif" fill="#183249">
<text x="50" y="85" font-size="42" text-anchor="start" font-weight="700">Gezeiten: Unterschiede in der Anziehung</text>
<rect x="40" y="160" width="735" height="560" rx="22" fill="#f5f9fc" stroke="#ccd9e2" stroke-width="2"/>
<rect x="825" y="160" width="735" height="560" rx="22" fill="#f5f9fc" stroke="#ccd9e2" stroke-width="2"/>
<text x="70" y="214" font-size="30" text-anchor="start" font-weight="700">Anziehung durch den Mond</text>
<text x="70" y="255" font-size="23" text-anchor="start" >Überall zum Mond, unterschiedlich stark</text>
<text x="855" y="214" font-size="30" text-anchor="start" font-weight="700">Relativ zur Erdmitte</text>
<text x="855" y="255" font-size="23" text-anchor="start" >Differenzpfeile vergrößert dargestellt</text>
<circle cx="355" cy="450" r="145" fill="#edf0ec" stroke="#183249" stroke-width="2"/>
<circle cx="725" cy="450" r="29" fill="#f0e0b3" stroke="#183249" stroke-width="2"/>
<text x="725" y="402" font-size="25" text-anchor="middle" >Mond</text>
<circle cx="210" cy="450" r="5" fill="#183249" />
<path d="M210,445 L223.8083,445 L223.8083,438 L235.8083,450 L223.8083,462 L223.8083,455 L210,455 Z" fill="#397eaa" data-absolute="0" data-origin-x="210" data-length="25.8083"/>
<text x="210" y="634" font-size="22" text-anchor="middle" >mondfern</text>
<circle cx="355" cy="450" r="5" fill="#183249" />
<path d="M355,445 L393,445 L393,438 L405,450 L393,462 L393,455 L355,455 Z" fill="#397eaa" data-absolute="1" data-origin-x="355" data-length="50"/>
<text x="355" y="634" font-size="22" text-anchor="middle" >Erdmitte</text>
<circle cx="500" cy="450" r="5" fill="#183249" />
<path d="M500,445 L623.2099000000001,445 L623.2099000000001,438 L635.2099000000001,450 L623.2099000000001,462 L623.2099000000001,455 L500,455 Z" fill="#397eaa" data-absolute="2" data-origin-x="500" data-length="135.2099"/>
<text x="500" y="634" font-size="22" text-anchor="middle" >mondnah</text>
<text x="355" y="548" font-size="25" text-anchor="middle" >Erde</text>
<ellipse cx="1125" cy="450" rx="173" ry="150" fill="#c3e3ed" stroke="#6c9eb4" stroke-width="2"/>
<circle cx="1125" cy="450" r="145" fill="#edf0ec" stroke="#183249" stroke-width="2"/>
<circle cx="1495" cy="450" r="29" fill="#f0e0b3" stroke="#183249" stroke-width="2"/>
<text x="1495" y="402" font-size="25" text-anchor="middle" >Mond</text>
<path d="M980,445 L943.6166,445 L943.6166,438 L931.6166,450 L943.6166,462 L943.6166,455 L980,455 Z" fill="#397eaa" data-relative="far" data-origin-x="980" data-length="48.3834"/>
<path d="M1270,445 L1428.4198000000001,445 L1428.4198000000001,438 L1440.4198000000001,450 L1428.4198000000001,462 L1428.4198000000001,455 L1270,455 Z" fill="#397eaa" data-relative="near" data-origin-x="1270" data-length="170.4198"/>
<circle cx="1125" cy="450" r="5" fill="#183249" />
<text x="1125" y="490" font-size="22" text-anchor="middle" >Erdmitte</text>
<text x="1125" y="550" font-size="25" text-anchor="middle" >Erde</text>
<text x="980" y="634" font-size="22" text-anchor="middle" >mondfern</text>
<text x="1270" y="634" font-size="22" text-anchor="middle" >mondnah</text>
<text x="1125" y="682" font-size="23" text-anchor="middle" >Vereinfachtes Gleichgewichtsmodell</text>
<text x="800" y="775" font-size="27" text-anchor="middle" >Auch die Sonne zieht verschiedene Erdbereiche unterschiedlich stark an.</text>
<text x="800" y="821" font-size="27" text-anchor="middle" >Die Beiträge von Mond und Sonne überlagern sich.</text>
<text x="800" y="871" font-size="23" text-anchor="middle" >Schematisch; keine Vorhersage örtlicher Hochwasserzeiten.</text>
