<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Vektor mit einer Zahl multiplizieren</title>
  <desc id="desc">Von einem gemeinsamen Ursprung zeigt a gleich (2,1) nach rechts oben. 2a zeigt in dieselbe Richtung und ist doppelt so lang, ein halb a halb so lang, minus a gleich lang in Gegenrichtung. 0a ist der Nullvektor am Ursprung. Darunter veranschaulicht eine dreidimensionale Komponentenrechnung dieselbe Regel.</desc>
  <defs>
    <marker id="blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#1766bb"/></marker>
    <marker id="green" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#17865b"/></marker>
    <marker id="orange" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#c05b16"/></marker>
    <marker id="purple" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#7542aa"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#fffdf8"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="bold" fill="#122a4c">Vektor · Zahl: Länge und Richtung ändern</text>
  <rect x="70" y="100" width="1060" height="445" rx="18" fill="#eef6ff" stroke="#b6d2ed" stroke-width="2"/>
  <g stroke="#bfd0e2" stroke-width="1">
    <path d="M150 135 V505 M225 135 V505 M300 135 V505 M375 135 V505 M450 135 V505 M525 135 V505 M600 135 V505 M675 135 V505 M750 135 V505 M825 135 V505 M900 135 V505 M975 135 V505 M1050 135 V505"/>
    <path d="M130 155 H1070 M130 230 H1070 M130 305 H1070 M130 380 H1070 M130 455 H1070"/>
  </g>
  <g stroke="#5d7188" stroke-width="2"><path d="M130 380 H1070 M600 515 V135"/></g>
  <path d="M300 530 L900 230" stroke="#a8a8a8" stroke-width="3" stroke-dasharray="10 10"/>
  <g fill="none" stroke-linecap="round">
    <path d="M600 380 L900 230" stroke="#17865b" stroke-width="9" marker-end="url(#green)"/>
    <path d="M600 380 L750 305" stroke="#1766bb" stroke-width="8" marker-end="url(#blue)"/>
    <path d="M600 380 L675 342.5" stroke="#7542aa" stroke-width="7" marker-end="url(#purple)"/>
    <path d="M600 380 L450 455" stroke="#c05b16" stroke-width="8" marker-end="url(#orange)"/>
  </g>
  <circle cx="600" cy="380" r="7" fill="#122a4c"/>
  <g font-family="Arial,sans-serif" font-size="27" font-weight="bold">
    <text x="910" y="220" fill="#17865b">2a = (4, 2)</text>
    <text x="757" y="297" fill="#1766bb">a = (2, 1)</text>
    <text x="660" y="329" fill="#7542aa">½a</text>
    <text x="275" y="472" fill="#c05b16">−a = (−2, −1)</text>
    <text x="616" y="424" fill="#122a4c">0a = (0, 0)</text>
  </g>
  <text x="600" y="603" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#122a4c">Im Raum wird jede Koordinate mit demselben Faktor multipliziert:</text>
  <text x="600" y="654" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#122a4c">−2 · (2, 1, 3) = (−4, −2, −6)</text>
</svg>
