<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Gegebener Stammfunktionsgraph H, unabhängiger Graph B</title>
  <desc id="desc">Ein nach unten geöffneter Parabelbogen von (0,2) über den Hochpunkt (1,3) bis (2,2). Die Punkte liegen auf einer glatten Kurve und sind nicht geradlinig verbunden.</desc>
  <rect width="800" height="500" rx="18" fill="#fffdf8"/>
  <g stroke="#e6eaf1" stroke-width="1">
    <path d="M180 40V390 M400 40V390 M620 40V390"/>
    <path d="M90 60H710 M90 160H710 M90 260H710 M90 360H710"/>
  </g>
  <g stroke="#314159" stroke-width="2.5" stroke-linecap="round">
    <path d="M90 360H750 M180 390V35"/>
  </g>
  <g fill="#314159" font-family="Arial, sans-serif" font-size="28">
    <text x="735" y="385">x</text><text x="224" y="48">H(x)</text>
    <text x="174" y="390">0</text><text x="394" y="390">1</text><text x="614" y="390">2</text>
    <text x="193" y="167">2</text><text x="193" y="67">3</text>
  </g>
  <path d="M180 160 Q290 60 400 60 Q510 60 620 160" fill="none" stroke="#0876bd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0876bd" stroke="white" stroke-width="3">
    <circle cx="180" cy="160" r="7"/><circle cx="400" cy="60" r="7"/><circle cx="620" cy="160" r="7"/>
  </g>
</svg>
