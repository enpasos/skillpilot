<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Entropieproduktion und Irreversibilität</title>
<desc id="desc">Vier Ursachen positiver Entropieproduktion: Reibung, Mischung verschiedener idealer Gase, Wärmeübertragung bei endlicher Temperaturdifferenz und freie Expansion. Die Schemata verwenden keine zählbaren Teilchensymbole. Das isolierte Gesamtsystem umfasst jeweils alle beteiligten Körper und ihre Umgebung.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243b53"/></marker><marker id="heatArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c64b21"/></marker><style>text{font-family:DejaVu Sans,sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.h{font-size:30px;font-weight:700}.t{font-size:25px}.small{font-size:21px}.formula{font-size:33px;font-weight:700}.card{fill:#fff;stroke:#bdcbd7;stroke-width:2}.arrow{stroke:#243b53;stroke-width:4;fill:none;marker-end:url(#arrow)}.heat{stroke:#c64b21;stroke-width:6;fill:none;marker-end:url(#heatArrow)}</style></defs>
<rect width="1600" height="900" fill="#f6f9fc"/>
<text x="70" y="68" class="title">Entropieproduktion und Irreversibilität</text>
<rect x="70" y="95" width="1460" height="115" rx="18" fill="#e7f0f8" stroke="#3f6f93" stroke-width="2"/>
<text x="800" y="138" class="h" text-anchor="middle">Isoliertes Gesamtsystem: alle beteiligten Körper + Umgebung</text>
<text x="800" y="183" class="formula" text-anchor="middle">ΔS<tspan baseline-shift="sub" font-size="23">ges</tspan> = S<tspan baseline-shift="sub" font-size="23">erzeugt</tspan> &gt; 0 bei irreversiblen Vorgängen</text>
<rect x="70" y="235" width="720" height="270" rx="16" class="card"/>
<text x="105" y="281" class="h">Reibung</text>
<rect x="128" y="330" width="95" height="68" rx="4" fill="#efc49f" stroke="#8f6447" stroke-width="2"/>
<path d="M244 352 H345" class="arrow"/>
<text x="278" y="327" class="small" text-anchor="middle">v nimmt ab</text>
<path d="M108 403 H365" stroke="#5d7286" stroke-width="5"/>
<path d="M120 403 l-12 17 M153 403 l-12 17 M186 403 l-12 17 M219 403 l-12 17 M252 403 l-12 17 M285 403 l-12 17 M318 403 l-12 17 M351 403 l-12 17" stroke="#5d7286" stroke-width="2"/>
<text x="402" y="337" class="t">Geordnete Bewegung</text>
<text x="402" y="376" class="t">→ innere Energie</text>
<text x="402" y="413" class="small">Körper und Unterlage</text>
<text x="402" y="439" class="small">erwärmen sich.</text>
<text x="105" y="469" class="t">Energie bleibt erhalten; Entropie wird erzeugt.</text>
<rect x="810" y="235" width="720" height="270" rx="16" class="card"/>
<text x="845" y="281" class="h">Mischung / Diffusion</text>
<rect x="850" y="320" width="255" height="103" rx="9" fill="#e3edff" stroke="#355c78" stroke-width="3"/>
<path d="M856 323 H977 V420 H856 Z" fill="#f9cfb6"/>
<line x1="977" y1="320" x2="977" y2="423" stroke="#355c78" stroke-width="3"/>
<text x="913" y="378" class="t" text-anchor="middle">Gas A</text>
<text x="1041" y="378" class="t" text-anchor="middle">Gas B</text>
<path d="M1120 371 H1180" class="arrow"/>
<rect x="1200" y="320" width="255" height="103" rx="9" fill="#ded8ec" stroke="#355c78" stroke-width="3"/>
<text x="1327" y="365" class="t" text-anchor="middle">homogenes</text>
<text x="1327" y="400" class="t" text-anchor="middle">Gemisch</text>
<text x="845" y="454" class="small">Verschiedene ideale Gase, anfangs gleiches T und p.</text>
<text x="845" y="486" class="small">Trennwand entfernt; Stoffmengen und Gesamtvolumen gleich.</text>
<rect x="70" y="525" width="720" height="270" rx="16" class="card"/>
<text x="105" y="571" class="h">Endliche Temperaturdifferenz</text>
<rect x="110" y="616" width="170" height="92" rx="11" fill="#ffe1c9" stroke="#c64b21" stroke-width="2"/>
<text x="195" y="673" class="h" text-anchor="middle">heiß: T<tspan baseline-shift="sub" font-size="20">h</tspan></text>
<path d="M304 660 H554" class="heat"/>
<text x="429" y="630" class="t" text-anchor="middle">Wärme</text>
<rect x="580" y="616" width="170" height="92" rx="11" fill="#d8edff" stroke="#3476a8" stroke-width="2"/>
<text x="665" y="673" class="h" text-anchor="middle">kalt: T<tspan baseline-shift="sub" font-size="20">c</tspan></text>
<text x="105" y="756" class="t">T<tspan baseline-shift="sub" font-size="18">h</tspan> &gt; T<tspan baseline-shift="sub" font-size="18">c</tspan>: Wärme fließt spontan von heiß nach kalt.</text>
<rect x="810" y="525" width="720" height="270" rx="16" class="card"/>
<text x="845" y="571" class="h">Freie Expansion</text>
<rect x="850" y="610" width="255" height="98" rx="8" fill="#fff" stroke="#355c78" stroke-width="3"/>
<path d="M856 613 H977 V705 H856 Z" fill="#9fcae9"/>
<line x1="977" y1="610" x2="977" y2="708" stroke="#355c78" stroke-width="3"/>
<text x="913" y="669" class="t" text-anchor="middle">Gas</text>
<text x="1040" y="669" class="small" text-anchor="middle">Vakuum</text>
<path d="M1120 659 H1180" class="arrow"/>
<rect x="1200" y="610" width="255" height="98" rx="8" fill="#cce3f3" stroke="#355c78" stroke-width="3"/>
<text x="1327" y="652" class="t" text-anchor="middle">Gas im</text>
<text x="1327" y="688" class="t" text-anchor="middle">ganzen Raum</text>
<text x="845" y="742" class="small">Isoliertes geschlossenes Gefäß; Teilchenzahl bleibt gleich.</text>
<text x="845" y="774" class="small">Nur die innere Trennwand entfällt, nicht die Außenwand.</text>
<text x="800" y="846" class="h" text-anchor="middle">Ein Teilsystem zurückzuführen bedeutet nicht, das Ganze vollständig umzukehren.</text>
<text x="800" y="883" class="small" text-anchor="middle">Entropieproduktion ist nicht bloß Entropietransport. Im isolierten Ganzen gibt es keinen Transport nach außen.</text>
</svg>
