<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Entropieerzeugung und thermodynamischer Zeitpfeil</title>
<desc id="desc">Ein isoliertes Paar idealer Wärmereservoire tauscht Wärme von heiß nach kalt aus. Die Energieänderungen heben sich auf, die Gesamtentropie nimmt zu. Die gedachte spontane Umkehr als einzige Wirkung hätte eine negative Gesamtentropieänderung.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#243b53"/></marker><marker id="heatArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c64b21"/></marker><style>text{font-family:DejaVu Sans,sans-serif;fill:#17324d}.title{font-size:42px;font-weight:700}.h{font-size:30px;font-weight:700}.t{font-size:25px}.small{font-size:21px}.formula{font-size:33px;font-weight:700}.card{fill:#fff;stroke:#bdcbd7;stroke-width:2}.arrow{stroke:#243b53;stroke-width:4;fill:none;marker-end:url(#arrow)}.heat{stroke:#c64b21;stroke-width:6;fill:none;marker-end:url(#heatArrow)}</style></defs>
<rect width="1600" height="900" fill="#f6f9fc"/>
<text x="70" y="75" class="title">Entropieerzeugung und thermodynamischer Zeitpfeil</text>
<rect x="70" y="105" width="1460" height="116" rx="18" fill="#e7f0f8" stroke="#3f6f93" stroke-width="2"/>
<text x="800" y="150" class="h" text-anchor="middle">Isoliertes Gesamtsystem: System + Umgebung</text>
<text x="800" y="195" class="formula" text-anchor="middle">ΔS<tspan baseline-shift="sub" font-size="23">ges</tspan> = S<tspan baseline-shift="sub" font-size="23">erzeugt</tspan> ≥ 0</text>
<rect x="100" y="265" width="1400" height="355" rx="20" fill="#fff" stroke="#355c78" stroke-width="3" stroke-dasharray="11 7"/>
<text x="800" y="305" class="small" text-anchor="middle">Nach außen kein Energie- oder Stoffaustausch · ideale Reservoire bei konstanten Kelvin-Temperaturen</text>
<rect x="180" y="350" width="345" height="135" rx="15" fill="#ffe1c9" stroke="#c64b21" stroke-width="2"/>
<text x="352" y="400" class="h" text-anchor="middle">Heißes Reservoir</text>
<text x="352" y="449" class="formula" text-anchor="middle">T<tspan baseline-shift="sub" font-size="23">h</tspan> &gt; T<tspan baseline-shift="sub" font-size="23">c</tspan></text>
<rect x="1075" y="350" width="345" height="135" rx="15" fill="#d8edff" stroke="#3476a8" stroke-width="2"/>
<text x="1247" y="400" class="h" text-anchor="middle">Kaltes Reservoir</text>
<text x="1247" y="449" class="formula" text-anchor="middle">T<tspan baseline-shift="sub" font-size="23">c</tspan> &gt; 0 K</text>
<path d="M565 420 H1035" class="heat"/>
<text x="800" y="382" class="h" text-anchor="middle">Wärme Q &gt; 0</text>
<text x="352" y="532" class="t" text-anchor="middle">ΔU<tspan baseline-shift="sub" font-size="18">h</tspan> = −Q</text>
<text x="1247" y="532" class="t" text-anchor="middle">ΔU<tspan baseline-shift="sub" font-size="18">c</tspan> = +Q</text>
<text x="352" y="580" class="formula" text-anchor="middle">ΔS<tspan baseline-shift="sub" font-size="23">h</tspan> = −Q/T<tspan baseline-shift="sub" font-size="23">h</tspan></text>
<text x="1247" y="580" class="formula" text-anchor="middle">ΔS<tspan baseline-shift="sub" font-size="23">c</tspan> = +Q/T<tspan baseline-shift="sub" font-size="23">c</tspan></text>
<rect x="190" y="645" width="1220" height="67" rx="12" fill="#e0f1e8"/>
<text x="800" y="690" class="formula" text-anchor="middle">ΔS<tspan baseline-shift="sub" font-size="23">ges</tspan> = Q (1/T<tspan baseline-shift="sub" font-size="23">c</tspan> − 1/T<tspan baseline-shift="sub" font-size="23">h</tspan>) &gt; 0</text>
<text x="800" y="758" class="h" text-anchor="middle">Diese irreversible Richtung zeichnet den makroskopischen Zeitpfeil aus.</text>
<text x="800" y="805" class="t" text-anchor="middle">Die spontane Umkehr als einzige Wirkung hätte ΔS<tspan baseline-shift="sub" font-size="18">ges</tspan> &lt; 0: im isolierten Ganzen unmöglich.</text>
<text x="800" y="857" class="small" text-anchor="middle">Reversibler Grenzfall: S<tspan baseline-shift="sub" font-size="16">erzeugt</tspan> = 0 · Die Entropie eines einzelnen Teilsystems darf abnehmen.</text>
</svg>
