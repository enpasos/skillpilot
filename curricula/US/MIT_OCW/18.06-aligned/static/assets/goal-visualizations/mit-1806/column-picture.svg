<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Column picture of the same system</title>
<desc id="desc">At left both column vectors start at the origin and end at (1, 1) and (1, 2). At right the first vector starts at (0, 0). Twice the second vector starts at (1, 1) and ends at b = (3, 5). The weights (1, 2) solve the system. Both horizontal axes are b₁ and both vertical axes are b₂. Each grid has unit intervals.</desc>
<defs>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#006c70"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a33c27"/></marker>
</defs>
<rect width="760" height="420" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="26" y="39" fill="#1d2a36" font-size="32" text-anchor="start" font-weight="700">Column picture</text>
<text x="38" y="86" fill="#1d2a36" font-size="23" text-anchor="start" font-weight="700">The two columns</text>
<text x="360" y="86" fill="#1d2a36" font-size="23" text-anchor="start" font-weight="700">Add one c₁ and two c₂</text>
<line x1="145" y1="163" x2="145" y2="339" stroke="#d9dfe4" stroke-width="2" />
<text x="145" y="364" fill="#475767" font-size="19" text-anchor="middle">1</text>
<line x1="233" y1="163" x2="233" y2="339" stroke="#d9dfe4" stroke-width="2" />
<text x="233" y="364" fill="#475767" font-size="19" text-anchor="middle">2</text>
<line x1="57" y1="251" x2="233" y2="251" stroke="#d9dfe4" stroke-width="2" />
<text x="45" y="257" fill="#475767" font-size="19" text-anchor="end">1</text>
<line x1="57" y1="163" x2="233" y2="163" stroke="#d9dfe4" stroke-width="2" />
<text x="45" y="169" fill="#475767" font-size="19" text-anchor="end">2</text>
<line x1="53" y1="339" x2="254.12" y2="339" stroke="#1d2a36" stroke-width="2" />
<line x1="57" y1="343" x2="57" y2="141.88" stroke="#1d2a36" stroke-width="2" />
<text x="265" y="345" fill="#1d2a36" font-size="21">b₁</text>
<text x="68" y="146" fill="#1d2a36" font-size="21">b₂</text>
<text x="51" y="364" fill="#475767" font-size="19" text-anchor="end">0</text>
<line x1="57" y1="339" x2="145" y2="251" stroke="#006c70" stroke-width="5" marker-end="url(#teal)"/>
<line x1="57" y1="339" x2="145" y2="163" stroke="#a33c27" stroke-width="5" marker-end="url(#red)"/>
<text x="157" y="255" fill="#006c70" font-size="21" text-anchor="start">c₁ = (1, 1)</text>
<text x="157" y="161" fill="#a33c27" font-size="21" text-anchor="start">c₂ = (1, 2)</text>
<line x1="424" y1="109" x2="424" y2="339" stroke="#d9dfe4" stroke-width="2" />
<text x="424" y="364" fill="#475767" font-size="19" text-anchor="middle">1</text>
<line x1="470" y1="109" x2="470" y2="339" stroke="#d9dfe4" stroke-width="2" />
<text x="470" y="364" fill="#475767" font-size="19" text-anchor="middle">2</text>
<line x1="516" y1="109" x2="516" y2="339" stroke="#d9dfe4" stroke-width="2" />
<text x="516" y="364" fill="#475767" font-size="19" text-anchor="middle">3</text>
<line x1="562" y1="109" x2="562" y2="339" stroke="#d9dfe4" stroke-width="2" />
<text x="562" y="364" fill="#475767" font-size="19" text-anchor="middle">4</text>
<line x1="378" y1="293" x2="562" y2="293" stroke="#d9dfe4" stroke-width="2" />
<text x="366" y="299" fill="#475767" font-size="19" text-anchor="end">1</text>
<line x1="378" y1="247" x2="562" y2="247" stroke="#d9dfe4" stroke-width="2" />
<text x="366" y="253" fill="#475767" font-size="19" text-anchor="end">2</text>
<line x1="378" y1="201" x2="562" y2="201" stroke="#d9dfe4" stroke-width="2" />
<text x="366" y="207" fill="#475767" font-size="19" text-anchor="end">3</text>
<line x1="378" y1="155" x2="562" y2="155" stroke="#d9dfe4" stroke-width="2" />
<text x="366" y="161" fill="#475767" font-size="19" text-anchor="end">4</text>
<line x1="378" y1="109" x2="562" y2="109" stroke="#d9dfe4" stroke-width="2" />
<text x="366" y="115" fill="#475767" font-size="19" text-anchor="end">5</text>
<line x1="374" y1="339" x2="573.04" y2="339" stroke="#1d2a36" stroke-width="2" />
<line x1="378" y1="343" x2="378" y2="97.95999999999998" stroke="#1d2a36" stroke-width="2" />
<text x="584" y="345" fill="#1d2a36" font-size="21">b₁</text>
<text x="385" y="104" fill="#1d2a36" font-size="21">b₂</text>
<text x="372" y="364" fill="#475767" font-size="19" text-anchor="end">0</text>
<line x1="378" y1="339" x2="424" y2="293" stroke="#006c70" stroke-width="5" marker-end="url(#teal)"/>
<line x1="424" y1="293" x2="516" y2="109" stroke="#a33c27" stroke-width="5" marker-end="url(#red)"/>
<text x="445" y="300" fill="#006c70" font-size="23" text-anchor="start">c₁</text>
<text x="504" y="213" fill="#a33c27" font-size="23" text-anchor="start">2c₂</text>
<text x="537" y="119" fill="#1d2a36" font-size="24" text-anchor="start" font-weight="700">b = (3, 5)</text>
<text x="27" y="401" fill="#1d2a36" font-size="26" text-anchor="start">c₁ + 2c₂ = (1, 1) + (2, 4) = (3, 5) = b</text></g>
</svg>
