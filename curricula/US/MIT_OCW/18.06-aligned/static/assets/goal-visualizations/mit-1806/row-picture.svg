<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Row picture of a system of two equations</title>
<desc id="desc">The graph shows the first quadrant. The solid line x + y = 3 and the dashed line x + 2y = 5 intersect at (1, 2). Each grid interval is one unit on both axes.</desc>
<defs>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#006c70"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a33c27"/></marker>
</defs>
<rect width="760" height="420" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="41" fill="#1d2a36" font-size="32" text-anchor="start" font-weight="700">Row picture</text>
<line x1="120" y1="116" x2="120" y2="340" stroke="#d9dfe4" stroke-width="2" />
<text x="120" y="365" fill="#475767" font-size="19" text-anchor="middle">1</text>
<line x1="176" y1="116" x2="176" y2="340" stroke="#d9dfe4" stroke-width="2" />
<text x="176" y="365" fill="#475767" font-size="19" text-anchor="middle">2</text>
<line x1="232" y1="116" x2="232" y2="340" stroke="#d9dfe4" stroke-width="2" />
<text x="232" y="365" fill="#475767" font-size="19" text-anchor="middle">3</text>
<line x1="288" y1="116" x2="288" y2="340" stroke="#d9dfe4" stroke-width="2" />
<text x="288" y="365" fill="#475767" font-size="19" text-anchor="middle">4</text>
<line x1="344" y1="116" x2="344" y2="340" stroke="#d9dfe4" stroke-width="2" />
<text x="344" y="365" fill="#475767" font-size="19" text-anchor="middle">5</text>
<line x1="400" y1="116" x2="400" y2="340" stroke="#d9dfe4" stroke-width="2" />
<text x="400" y="365" fill="#475767" font-size="19" text-anchor="middle">6</text>
<line x1="64" y1="284" x2="400" y2="284" stroke="#d9dfe4" stroke-width="2" />
<text x="52" y="290" fill="#475767" font-size="19" text-anchor="end">1</text>
<line x1="64" y1="228" x2="400" y2="228" stroke="#d9dfe4" stroke-width="2" />
<text x="52" y="234" fill="#475767" font-size="19" text-anchor="end">2</text>
<line x1="64" y1="172" x2="400" y2="172" stroke="#d9dfe4" stroke-width="2" />
<text x="52" y="178" fill="#475767" font-size="19" text-anchor="end">3</text>
<line x1="64" y1="116" x2="400" y2="116" stroke="#d9dfe4" stroke-width="2" />
<text x="52" y="122" fill="#475767" font-size="19" text-anchor="end">4</text>
<line x1="60" y1="340" x2="413.44" y2="340" stroke="#1d2a36" stroke-width="2" />
<line x1="64" y1="344" x2="64" y2="102.56" stroke="#1d2a36" stroke-width="2" />
<text x="58" y="365" fill="#475767" font-size="19" text-anchor="end">0</text>
<text x="415.12" y="347" fill="#1d2a36" font-size="22" text-anchor="start">x</text>
<text x="58" y="99.44" fill="#1d2a36" font-size="22" text-anchor="end">y</text>
<line x1="64" y1="172" x2="232" y2="340" stroke="#006c70" stroke-width="5" />
<line x1="64" y1="200.0" x2="344" y2="340" stroke="#a33c27" stroke-width="5" stroke-dasharray="11 7"/>
<circle cx="120" cy="228" r="8" fill="#1d2a36" stroke="#fff" stroke-width="2"/>
<line x1="466" y1="140" x2="511" y2="140" stroke="#006c70" stroke-width="5" />
<text x="525" y="148" fill="#1d2a36" font-size="26" text-anchor="start">x + y = 3</text>
<line x1="466" y1="204" x2="511" y2="204" stroke="#a33c27" stroke-width="5" stroke-dasharray="11 7"/>
<text x="525" y="212" fill="#1d2a36" font-size="26" text-anchor="start">x + 2y = 5</text>
<circle cx="486" cy="266" r="7" fill="#1d2a36" stroke="#fff" stroke-width="2"/>
<text x="525" y="275" fill="#1d2a36" font-size="28" text-anchor="start" font-weight="700">(1, 2)</text>
<text x="30" y="399" fill="#1d2a36" font-size="24" text-anchor="start">Both equations hold at the intersection.</text></g>
</svg>
