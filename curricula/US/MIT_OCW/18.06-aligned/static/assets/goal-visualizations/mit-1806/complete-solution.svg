<rect x="106" y="292" width="28" height="22" fill="#fff"/>
<text x="120" y="309" fill="#475767" font-size="19" text-anchor="middle">−1</text>
<line x1="176" y1="116" x2="176" y2="340" stroke="#d9dfe4" stroke-width="2" />
<line x1="232" y1="116" x2="232" y2="340" stroke="#d9dfe4" stroke-width="2" />
<rect x="218" y="292" width="28" height="22" fill="#fff"/>
<text x="232" y="309" fill="#475767" font-size="19" text-anchor="middle">1</text>
<line x1="288" y1="116" x2="288" y2="340" stroke="#d9dfe4" stroke-width="2" />
<rect x="274" y="292" width="28" height="22" fill="#fff"/>
<text x="288" y="309" fill="#475767" font-size="19" text-anchor="middle">2</text>
<line x1="344" y1="116" x2="344" y2="340" stroke="#d9dfe4" stroke-width="2" />
<rect x="330" y="292" width="28" height="22" fill="#fff"/>
<text x="344" y="309" fill="#475767" font-size="19" text-anchor="middle">3</text>
<line x1="64" y1="340" x2="344" y2="340" stroke="#d9dfe4" stroke-width="2" />
<rect x="146" y="329" width="22" height="22" fill="#fff"/>
<text x="168" y="347" fill="#475767" font-size="19" text-anchor="end">−1</text>
<line x1="64" y1="284" x2="344" y2="284" stroke="#d9dfe4" stroke-width="2" />
<line x1="64" y1="228" x2="344" y2="228" stroke="#d9dfe4" stroke-width="2" />
<rect x="146" y="217" width="22" height="22" fill="#fff"/>
<text x="168" y="235" fill="#475767" font-size="19" text-anchor="end">1</text>
<line x1="64" y1="172" x2="344" y2="172" stroke="#d9dfe4" stroke-width="2" />
<rect x="146" y="161" width="22" height="22" fill="#fff"/>
<text x="168" y="179" fill="#475767" font-size="19" text-anchor="end">2</text>
<line x1="64" y1="116" x2="344" y2="116" stroke="#d9dfe4" stroke-width="2" />
<rect x="146" y="105" width="22" height="22" fill="#fff"/>
<text x="168" y="123" fill="#475767" font-size="19" text-anchor="end">3</text>
<line x1="60" y1="284" x2="357.44" y2="284" stroke="#1d2a36" stroke-width="2" />
<line x1="176" y1="344" x2="176" y2="102.56" stroke="#1d2a36" stroke-width="2" />
