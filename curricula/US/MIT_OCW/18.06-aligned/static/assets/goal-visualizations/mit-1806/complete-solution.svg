<text x="505" y="172" fill="#1d2a36" font-size="23" text-anchor="start">N(A): x + y = 0</text>
<line x1="446" y1="216" x2="483" y2="216" stroke="#1d2a36" stroke-width="4" marker-end="url(#ink)"/>
<text x="505" y="224" fill="#1d2a36" font-size="23" text-anchor="start">x<tspan font-size="17" dy="6">p</tspan><tspan dy="-6"> = (1, 0)</tspan></text>
<circle cx="468" cy="268" r="7" fill="#006c70" stroke="#fff" stroke-width="2"/>
<text x="505" y="276" fill="#1d2a36" font-size="23" text-anchor="start">(−2, 2) in N(A)</text>
<circle cx="468" cy="320" r="8" fill="#a33c27" stroke="#fff" stroke-width="2"/>
<text x="505" y="328" fill="#1d2a36" font-size="23" text-anchor="start">(1, 0) and (−1, 2) solve</text>
<text x="30" y="399" fill="#1d2a36" font-size="24" text-anchor="start">Shifting N(A) by x<tspan font-size="17" dy="6">p</tspan><tspan dy="-6"> gives every solution.</tspan></text></g>
</svg>
