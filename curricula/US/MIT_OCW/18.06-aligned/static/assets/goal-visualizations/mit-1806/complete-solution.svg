<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Complete solution as the shifted nullspace</title>
<desc id="desc">The graph shows x from -2 to 3 and y from -1 to 3. The matrix A has the rows (1, 1) and (2, 2), and b = (1, 2). The dashed line x + y = 0 through the origin is the nullspace N(A). The solid parallel line x + y = 1 holds all solutions of the system x + y = 1, 2x + 2y = 2. An arrow from the origin to (1, 0) marks the particular solution x_p. The same arrow from (-2, 2) on the nullspace line ends at (-1, 2) on the solution line. Each grid interval is one unit on both axes.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1d2a36"/></marker>
</defs>
<rect width="760" height="420" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="41" fill="#1d2a36" font-size="32" text-anchor="start" font-weight="700">Complete solution</text>
<text x="30" y="76" fill="#475767" font-size="21" text-anchor="start">A has the rows (1, 1) and (2, 2), and b = (1, 2).</text>
<line x1="64" y1="116" x2="64" y2="340" stroke="#d9dfe4" stroke-width="2" />
