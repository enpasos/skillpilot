<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Vom Lehrplan zum geführten Lernen</title>
  <desc id="desc">Das persönliche Curriculum liefert Kompetenzen und Voraussetzungen. Gemeinsam wirksame Fachpläne für Mathematik und Physik ergänzen Zeiträume. SkillPilot berechnet aus Fälligkeiten, Rückständen und Lernstand den nächsten zulässigen Schritt. Der Coach nennt den Stand, begleitet das Lernen und prüft den Fortschritt. Bestätigter Fortschritt fließt in die nächste Berechnung ein.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b6f86"/>
    </marker>
  </defs>
  <rect width="1200" height="490" rx="24" fill="#f5f7fb"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="30" y="47" font-size="30" font-weight="700" fill="#17324d">Vom Lehrplan zum geführten Lernen</text>
    <text x="30" y="83" font-size="21" fill="#4e657d">Alle Fachpläne gelten gemeinsam. Das aktuelle Lernfach bleibt wechselbar.</text>

    <rect x="30" y="120" width="258" height="248" rx="18" fill="#ffffff" stroke="#cfe1f2" stroke-width="2"/>
    <text x="48" y="154" font-size="18" font-weight="700" fill="#0668b3">1 · CURRICULUM</text>
    <text x="48" y="195" font-size="25" font-weight="700" fill="#17324d">Persönliches</text>
    <text x="48" y="227" font-size="25" font-weight="700" fill="#17324d">Curriculum</text>
    <text x="48" y="277" font-size="22" fill="#34506c">Kompetenzen</text>
    <text x="48" y="312" font-size="22" fill="#34506c">Voraussetzungen</text>

    <rect x="324" y="120" width="258" height="248" rx="18" fill="#f6f1ff" stroke="#d5c4ef" stroke-width="2"/>
    <text x="342" y="154" font-size="18" font-weight="700" fill="#7040a0">2 · PLANUNG</text>
    <text x="342" y="195" font-size="25" font-weight="700" fill="#17324d">Fachpläne</text>
    <text x="342" y="246" font-size="21" fill="#34506c">Mathematik + Physik</text>
    <text x="342" y="281" font-size="22" fill="#34506c">Abschnitte, Termine</text>
    <text x="342" y="316" font-size="22" fill="#34506c">und Puffer</text>

    <rect x="618" y="120" width="258" height="248" rx="18" fill="#edf7ff" stroke="#b7d8f6" stroke-width="2"/>
    <text x="636" y="154" font-size="18" font-weight="700" fill="#0668b3">3 · SKILLPILOT</text>
    <text x="636" y="195" font-size="25" font-weight="700" fill="#17324d">Tagesauftrag</text>
    <text x="636" y="246" font-size="21" fill="#34506c">Fälliges + Rückstand</text>
    <text x="636" y="281" font-size="21" fill="#34506c">Lernstand prüfen</text>
    <text x="636" y="316" font-size="21" fill="#34506c">Zulässiges Ziel</text>

    <rect x="912" y="120" width="258" height="248" rx="18" fill="#eef8f2" stroke="#b9dfca" stroke-width="2"/>
    <text x="930" y="154" font-size="18" font-weight="700" fill="#26704c">4 · GEFÜHRT LERNEN</text>
    <text x="930" y="195" font-size="25" font-weight="700" fill="#17324d">Coach im Chat</text>
    <text x="930" y="246" font-size="22" fill="#34506c">Stand nennen</text>
    <text x="930" y="281" font-size="22" fill="#34506c">Erklären und üben</text>
    <text x="930" y="316" font-size="22" fill="#34506c">Fortschritt prüfen</text>
    <g fill="none" stroke="#5b6f86" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 293 242 H 317"/>
      <path d="M 587 242 H 611"/>
      <path d="M 881 242 H 905"/>
      <path d="M 1041 373 V 412 H 747 V 376"/>
    </g>
    <text x="586" y="456" font-size="21" fill="#34506c">Bestätigter Fortschritt fließt in die Berechnung zurück.</text>
  </g>
</svg>
