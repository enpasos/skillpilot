<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
<title id="title">Optimistic vs. Pessimistic Filtering</title>
<desc id="desc">Both panels have identical graph positions and no mastered goals. Scope F contains Kinematics, Velocity and Acceleration; Vectors is outside. Kinematics contains Velocity and Acceleration. Direct prerequisites are Vectors to Kinematics and Velocity to Acceleration. Vectors is inherited by both atomic children. Optimistic mode ignores all three outside-source prerequisite edges and makes Velocity available. Strict mode checks them and makes neither goal available. Effective prerequisites are computed on the full graph before restriction.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="17" markerHeight="17" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#1976E9"/></marker>
<marker id="arrow-grey" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="17" markerHeight="17" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#ABB4BE"/></marker>
</defs>
<rect width="1448" height="1086" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#132033">
<text x="724" y="86" font-size="52" font-weight="bold" fill="#132033" text-anchor="middle">Optimistic vs. Pessimistic Filtering</text>
<text x="724" y="133" font-size="26" font-weight="normal" fill="#526173" text-anchor="middle">same graph, same scope, same learner state – different prerequisite checks</text>
<rect x="36" y="174" width="676" height="602" rx="12" fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1.5"/>
<rect x="36" y="174" width="676" height="94" rx="12" fill="#F8FAFC" stroke="#D0D7E0" stroke-width="1.5"/>
<text x="374.0" y="213" font-size="27" font-weight="bold" fill="#132033" text-anchor="middle">Optimistic mode (§11.3)</text>
<text x="374.0" y="247" font-size="21" font-weight="normal" fill="#526173" text-anchor="middle">Only prerequisites inside F are checked.</text>
<rect x="258" y="286" width="434" height="420" rx="12" fill="#FAFCFF" stroke="#9ABBDD" stroke-width="1.7" stroke-dasharray="8 7"/>
<text x="274" y="312" font-size="22" font-weight="bold" fill="#526173" text-anchor="start">filter scope F</text>
<g data-edge-source="Kinematics" data-edge-target="Velocity" data-relation="contains" data-panel="optimistic" data-ignored="false">
<path d="M426 394 V435 H366 V480" fill="none" stroke="#8994A2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
