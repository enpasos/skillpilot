<text x="1074.0" y="247" font-size="21" font-weight="normal" fill="#526173" text-anchor="middle">Prerequisites inside and outside F are checked.</text>
<rect x="958" y="286" width="434" height="420" rx="12" fill="#FAFCFF" stroke="#9ABBDD" stroke-width="1.7" stroke-dasharray="8 7"/>
