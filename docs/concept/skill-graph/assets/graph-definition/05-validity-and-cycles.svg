<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
<title id="title">Validity and Cycles</title>
<desc id="desc">Two graphs use the same node positions. A contains B and X is a direct prerequisite of A. Inheritance adds X as a prerequisite of B. The right graph additionally has B as a direct prerequisite of X, creating B to X to B. The direct relation is acyclic in both panels. Acyclicity is only one validity condition.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="17" markerHeight="17" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#1976E9"/></marker>
<marker id="arrow-grey" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="17" markerHeight="17" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#ABB4BE"/></marker>
</defs>
<rect width="1448" height="1086" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#132033">
<text x="724" y="86" font-size="52" font-weight="bold" fill="#132033" text-anchor="middle">Validity and Cycles</text>
<text x="724" y="133" font-size="26" font-weight="normal" fill="#526173" text-anchor="middle">An acyclic direct graph can still produce an effective cycle.</text>
<rect x="36" y="181" width="676" height="624" rx="12" fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1.5"/>
<rect x="36" y="181" width="676" height="94" rx="12" fill="#F8FAFC" stroke="#D0D7E0" stroke-width="1.5"/>
<text x="374.0" y="220" font-size="28" font-weight="bold" fill="#132033" text-anchor="middle">Without a cycle</text>
<text x="374.0" y="254" font-size="21" font-weight="normal" fill="#526173" text-anchor="middle">Passes the acyclicity check</text>
<g data-edge-source="A" data-edge-target="B" data-relation="contains" data-panel="acyclic" data-ignored="false">
<path d="M540 432 V546" fill="none" stroke="#8994A2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g data-edge-source="X" data-edge-target="A" data-relation="direct" data-panel="acyclic" data-ignored="false">
<path d="M268 387 H460" fill="none" stroke="#1976E9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
</g>
<g data-edge-source="X" data-edge-target="B" data-relation="inherited" data-panel="acyclic" data-ignored="false">
<path d="M216 432 V591 H460" fill="none" stroke="#1976E9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
</g>
<g data-node="X" data-style="atomic" data-panel="acyclic">
<rect x="108" y="342" width="160" height="90" rx="12" fill="#FFF0D9" stroke="#C3943F" stroke-width="2.5"/>
<text x="188.0" y="400.6" font-size="40" font-weight="bold" fill="#132033" text-anchor="middle">X</text>
</g>
<g data-node="A" data-style="cluster" data-panel="acyclic">
<rect x="460" y="342" width="160" height="90" rx="12" fill="#E4F2DC" stroke="#719B50" stroke-width="2.5"/>
<text x="540.0" y="400.6" font-size="40" font-weight="bold" fill="#132033" text-anchor="middle">A</text>
</g>
<g data-node="B" data-style="atomic" data-panel="acyclic">
<rect x="460" y="546" width="160" height="90" rx="12" fill="#FFF0D9" stroke="#C3943F" stroke-width="2.5"/>
<text x="540.0" y="604.6" font-size="40" font-weight="bold" fill="#132033" text-anchor="middle">B</text>
</g>
<text x="282.50" y="755" font-size="30" font-weight="bold" fill="#132033">R</text>
<text x="304.17" y="761" font-size="16" font-weight="bold" fill="#132033">eff</text>
<text x="323.73" y="755" font-size="30" font-weight="bold" fill="#132033"> is acyclic</text>
<rect x="736" y="181" width="676" height="624" rx="12" fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1.5"/>
<rect x="736" y="181" width="676" height="94" rx="12" fill="#F8FAFC" stroke="#D0D7E0" stroke-width="1.5"/>
<text x="1074.0" y="220" font-size="28" font-weight="bold" fill="#132033" text-anchor="middle">Cycle caused by inheritance</text>
<text x="1074.0" y="254" font-size="21" font-weight="normal" fill="#526173" text-anchor="middle">Fails the acyclicity check</text>
<g data-edge-source="A" data-edge-target="B" data-relation="contains" data-panel="cyclic" data-ignored="false">
<path d="M1240 432 V546" fill="none" stroke="#8994A2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g data-edge-source="X" data-edge-target="A" data-relation="direct" data-panel="cyclic" data-ignored="false">
<path d="M968 387 H1160" fill="none" stroke="#1976E9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
</g>
<g data-edge-source="X" data-edge-target="B" data-relation="inherited" data-panel="cyclic" data-ignored="false">
<path d="M916 432 V591 H1160" fill="none" stroke="#1976E9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
</g>
<g data-edge-source="B" data-edge-target="X" data-relation="direct" data-panel="cyclic" data-ignored="false">
<path d="M1240 636 V692 H836 V432" fill="none" stroke="#1976E9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
</g>
<g data-node="X" data-style="atomic" data-panel="cyclic">
<rect x="808" y="342" width="160" height="90" rx="12" fill="#FFF0D9" stroke="#C3943F" stroke-width="2.5"/>
<text x="888.0" y="400.6" font-size="40" font-weight="bold" fill="#132033" text-anchor="middle">X</text>
</g>
<g data-node="A" data-style="cluster" data-panel="cyclic">
<rect x="1160" y="342" width="160" height="90" rx="12" fill="#E4F2DC" stroke="#719B50" stroke-width="2.5"/>
<text x="1240.0" y="400.6" font-size="40" font-weight="bold" fill="#132033" text-anchor="middle">A</text>
</g>
<g data-node="B" data-style="atomic" data-panel="cyclic">
<rect x="1160" y="546" width="160" height="90" rx="12" fill="#FFF0D9" stroke="#C3943F" stroke-width="2.5"/>
<text x="1240.0" y="604.6" font-size="40" font-weight="bold" fill="#132033" text-anchor="middle">B</text>
</g>
<text x="1074" y="755" font-size="30" font-weight="bold" fill="#132033" text-anchor="middle">Cycle: B → X → B</text>
<text x="546.55" y="850" font-size="27" font-weight="bold" fill="#132033">R</text>
<text x="566.05" y="856" font-size="16" font-weight="bold" fill="#132033">d</text>
<text x="575.83" y="850" font-size="27" font-weight="bold" fill="#132033"> is acyclic in both panels.</text>
<text x="724" y="890" font-size="24" font-weight="normal" fill="#526173" text-anchor="middle">Acyclicity alone is not a full validity proof (see §7 and §10).</text>
<rect x="36" y="922" width="1376" height="130" rx="12" fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1.5"/>
<text x="60" y="954" font-size="24" font-weight="bold" fill="#132033" text-anchor="start">Legend</text>
<path d="M62 981 H124" fill="none" stroke="#8994A2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="144" y="988" font-size="21" font-weight="normal" fill="#132033" text-anchor="start">contains (C)</text>
<path d="M495 981 H557" fill="none" stroke="#1976E9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="577.00" y="988" font-size="21" font-weight="normal" fill="#132033">direct requires (R</text>
<text x="738.03" y="993" font-size="16" font-weight="normal" fill="#132033">d</text>
<text x="746.94" y="988" font-size="21" font-weight="normal" fill="#132033">)</text>
<path d="M955 981 H1017" fill="none" stroke="#1976E9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
<text x="1037" y="988" font-size="21" font-weight="normal" fill="#132033" text-anchor="start">inherited prerequisite</text>
<text x="1037.00" y="1011" font-size="20" font-weight="normal" fill="#526173">added to R</text>
<text x="1134.88" y="1016" font-size="16" font-weight="normal" fill="#526173">eff</text>
<rect x="62" y="1007" width="62" height="32" rx="6" fill="#E4F2DC" stroke="#719B50" stroke-width="1.8"/>
<text x="144" y="1031" font-size="21" font-weight="normal" fill="#132033" text-anchor="start">cluster</text>
<rect x="495" y="1007" width="62" height="32" rx="6" fill="#FFF0D9" stroke="#C3943F" stroke-width="1.8"/>
<text x="577" y="1031" font-size="21" font-weight="normal" fill="#132033" text-anchor="start">atomic goal</text>
</g>
</svg>
