<!DOCTYPE html>
<html>
<body>
  <div id="output"></div>
  <script>
    const svgData = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <line x1="22" y1="2" x2="11" y2="13"></line>
  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
</svg>`;
    
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, 512, 512);
      // Get base64, remove prefix
      const base64 = canvas.toDataURL('image/png').split(',')[1];
      document.getElementById('output').innerText = base64;
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
  </script>
</body>
</html>
