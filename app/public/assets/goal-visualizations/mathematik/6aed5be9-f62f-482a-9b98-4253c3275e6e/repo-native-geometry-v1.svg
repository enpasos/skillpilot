<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sekanten-, Tangenten- und Normalensteigungen mit Steigungswinkeln bestimmen</title>
  <desc id="desc">Drei freundliche Diagrammkarten zeigen eine Sekante durch zwei Kurvenpunkte, Tangente und Normale in einem gemeinsamen Punkt sowie den Sonderfall einer waagerechten Tangente.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#263238" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowDark" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L14 8 L2 14" fill="none" stroke="#263238" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L14 8 L2 14" fill="none" stroke="#c73535" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L14 8 L2 14" fill="none" stroke="#2675a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .card { fill: #fffdf8; stroke: #263238; stroke-width: 4; }
      .heading { font: 700 34px 'DejaVu Sans', sans-serif; fill: #172126; }
      .label { font: 600 27px 'DejaVu Sans', sans-serif; fill: #172126; }
      .small { font: 600 24px 'DejaVu Sans', sans-serif; fill: #172126; }
      .formula { font: 700 29px 'DejaVu Sans', sans-serif; fill: #172126; }
      .curve { fill: none; stroke: #202629; stroke-width: 7; stroke-linecap: round; }
      .secant { fill: none; stroke: #2675a8; stroke-width: 9; stroke-linecap: round; }
      .tangent { fill: none; stroke: #c73535; stroke-width: 9; stroke-linecap: round; }
      .normal { fill: none; stroke: #2675a8; stroke-width: 9; stroke-linecap: round; }
      .guide { fill: none; stroke: #4b555a; stroke-width: 4; stroke-dasharray: 12 11; stroke-linecap: round; }
      .angleRed { fill: none; stroke: #c73535; stroke-width: 5; stroke-linecap: round; }
      .angleBlue { fill: none; stroke: #2675a8; stroke-width: 5; stroke-linecap: round; }
      .point { fill: #f5a623; stroke: #172126; stroke-width: 5; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f6f1e7"/>
  <text x="800" y="58" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="41" font-weight="700" fill="#101719">Sekanten-, Tangenten- und Normalensteigungen</text>
  <text x="800" y="108" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="41" font-weight="700" fill="#101719">mit Steigungswinkeln bestimmen</text>

  <!-- Karte 1: Sekante -->
  <g>
    <rect class="card" x="35" y="145" width="490" height="715" rx="30"/>
    <rect x="55" y="165" width="450" height="76" rx="22" fill="#cfe8f7" stroke="#263238" stroke-width="3"/>
  </g>
  <text class="heading" x="280" y="215" text-anchor="middle">Sekante</text>

  <!-- A=(130,600), B=(390,470): Lauf 260, Anstieg 130, also Verhältnis 2:1 -->
  <path class="curve" d="M78 760 C92 690 108 625 130 600 C205 557 298 582 390 470 C425 410 447 325 463 270"/>
  <path class="secant" d="M66 632 L456 437"/>
  <path class="guide" d="M130 600 H472" marker-end="url(#arrowDark)"/>
  <path class="guide" d="M390 600 V470"/>
  <circle class="point" cx="130" cy="600" r="13"/>
  <circle class="point" cx="390" cy="470" r="13"/>
  <text class="label" x="98" y="579">A</text>
  <text class="label" x="405" y="454">B</text>
  <text class="label" x="446" y="421" fill="#2675a8">s</text>
  <path class="angleBlue" d="M202 600 A72 72 0 0 0 194.4 567.8" marker-end="url(#arrowBlue)"/>
  <text class="small" x="82" y="405" fill="#2675a8">αₛ ≈ 26,6°</text>
  <text class="small" x="238" y="635">Δx = 2</text>
  <text class="small" x="403" y="544">Δy = 1</text>
  <rect x="92" y="700" width="376" height="105" rx="19" fill="#eef7fc" stroke="#2675a8" stroke-width="3"/>
  <text class="formula" x="280" y="746" text-anchor="middle">mₛ = Δy / Δx = 1/2</text>
  <text class="small" x="280" y="785" text-anchor="middle">Gerade durch A und B</text>

  <!-- Karte 2: Tangente und Normale -->
  <g>
    <rect class="card" x="555" y="145" width="490" height="715" rx="30"/>
    <rect x="575" y="165" width="450" height="76" rx="22" fill="#ead9f4" stroke="#263238" stroke-width="3"/>
  </g>
  <text class="heading" x="800" y="215" text-anchor="middle">Tangente und Normale</text>

  <!-- P=(800,510); Tangente Richtungsvektor (1,2), Normale (-2,1) -->
  <path class="curve" d="M590 785 C665 750 735 640 800 510 C865 380 920 305 1000 282"/>
  <path class="tangent" d="M665 780 L935 240"/>
  <path class="normal" d="M590 405 L1010 615"/>
  <path class="guide" d="M800 510 H996" marker-end="url(#arrowDark)"/>
  <path class="guide" d="M800 510 H880 V350"/>
  <circle class="point" cx="800" cy="510" r="14"/>
  <text class="label" x="760" y="554">P</text>
  <text class="label" x="938" y="270" fill="#c73535">t</text>
  <text class="label" x="602" y="392" fill="#2675a8">n</text>
  <text class="small" x="830" y="548">Δx = 1</text>
  <text class="small" x="893" y="425">Δy = 2</text>
  <!-- Rechter Winkel exakt in P zwischen den beiden Geraden -->
  <path d="M800 510 L809.8 490.3 L790.2 480.5 L780.3 500.2" fill="none" stroke="#172126" stroke-width="4" stroke-linejoin="round"/>
  <!-- Tangentenwinkel 63,4 Grad vom positiven Bezugsstrahl zur Tangente -->
  <path class="angleRed" d="M866 510 A66 66 0 0 0 829.5 451.0" marker-end="url(#arrowRed)"/>
  <text class="small" x="886" y="485" fill="#c73535">αₜ ≈ 63,4°</text>
  <!-- Normalenwinkel 153,4 Grad vom positiven Bezugsstrahl zum links-oberen Normalenstrahl -->
  <path class="angleBlue" d="M910 510 A110 110 0 0 0 701.6 460.8" marker-end="url(#arrowBlue)"/>
  <text class="small" x="592" y="365" fill="#2675a8">αₙ ≈ 153,4°</text>
  <rect x="590" y="680" width="420" height="130" rx="19" fill="#faf4fc" stroke="#8a4fa5" stroke-width="3"/>
  <text class="formula" x="800" y="723" text-anchor="middle">mₜ = 2;   mₙ = −1/2</text>
  <text class="formula" x="800" y="763" text-anchor="middle">mₜ · mₙ = −1</text>
  <text class="small" x="800" y="798" text-anchor="middle">αₙ − αₜ = 90°</text>

  <!-- Karte 3: Sonderfall -->
  <g>
    <rect class="card" x="1075" y="145" width="490" height="715" rx="30"/>
    <rect x="1095" y="165" width="450" height="76" rx="22" fill="#dcefd5" stroke="#263238" stroke-width="3"/>
  </g>
  <text class="heading" x="1320" y="215" text-anchor="middle">Sonderfall</text>

  <!-- Waagerechte Tangente und senkrechte Normale treffen sich exakt in P' -->
  <path class="curve" d="M1135 755 C1185 630 1245 500 1320 500 C1395 500 1455 630 1505 755"/>
  <path class="tangent" d="M1135 500 H1505"/>
  <path class="normal" d="M1320 295 V735"/>
  <circle class="point" cx="1320" cy="500" r="14"/>
  <text class="label" x="1340" y="477">P′</text>
  <text class="label" x="1480" y="482" fill="#c73535">t′</text>
  <text class="label" x="1340" y="326" fill="#2675a8">n′</text>
  <path d="M1320 500 H1350 V470" fill="none" stroke="#172126" stroke-width="4"/>
  <path class="angleBlue" d="M1400 500 A80 80 0 0 0 1320 420" marker-end="url(#arrowBlue)"/>
  <text class="small" x="1390" y="413" fill="#2675a8">αₙ = 90°</text>
  <text class="small" x="1405" y="540" fill="#c73535">αₜ = 0°</text>
  <rect x="1140" y="680" width="360" height="115" rx="19" fill="#f3faef" stroke="#5d8f4d" stroke-width="3"/>
  <text class="formula" x="1320" y="727" text-anchor="middle">mₜ = 0</text>
  <text class="formula" x="1320" y="771" text-anchor="middle">mₙ nicht definiert</text>
</svg>
