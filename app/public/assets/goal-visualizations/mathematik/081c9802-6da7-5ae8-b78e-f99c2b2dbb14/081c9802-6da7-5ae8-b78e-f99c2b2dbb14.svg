<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Rechtwinkligkeit mit dem Kehrsatz des Pythagoras prüfen</title>
  <desc id="description">Links hat das Dreieck die Seitenlängen 5, 12 und 13. Die längste Seite ist 13; wegen 5²+12²=13² ist der ihr gegenüberliegende Winkel recht. Rechts hat ein Dreieck die Seitenlängen 5, 12 und 14. Die längste Seite ist 14; wegen 5²+12² ungleich 14² ist es nicht rechtwinklig.</desc>
  <rect width="1600" height="900" fill="#fffdf8"/>
  <text x="800" y="92" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="54" font-weight="700" fill="#102b48">Rechtwinkligkeit mit dem Kehrsatz prüfen</text>
  <text x="800" y="148" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#344f67">Zuerst die längste Seite bestimmen, dann Quadrate vergleichen.</text>

  <rect x="80" y="190" width="660" height="590" rx="28" fill="#eaf7ef" stroke="#add5ba" stroke-width="3"/>
  <rect x="860" y="190" width="660" height="590" rx="28" fill="#fff0eb" stroke="#edc1b2" stroke-width="3"/>
  <text x="410" y="250" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#196844">5, 12, 13</text>
  <text x="1190" y="250" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#a3432b">5, 12, 14</text>

  <!-- Left triangle is exact 5-12-13 at 30 px per length unit. -->
  <path d="M170 430 L170 580 L530 580 Z" fill="#c7e8d2" stroke="#247855" stroke-width="6" stroke-linejoin="round"/>
  <path d="M170 430 L530 580" stroke="#cc5a34" stroke-width="9"/>
  <path d="M170 552 h28 v28" fill="none" stroke="#196844" stroke-width="5"/>
  <g font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="#102b48">
    <text x="120" y="516">5</text><text x="344" y="626">12</text><text x="335" y="457" fill="#a3432b">13: längste</text>
  </g>
  <text x="410" y="692" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#102b48">5² + 12² = 13²</text>
  <text x="410" y="745" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#196844">rechtwinklig</text>

  <!-- Right triangle has exact side lengths 5, 12, 14 at the same 30 px/unit scale. -->
  <path d="M900 580 L1320 580 L982.5 454.725 Z" fill="#f8d7cd" stroke="#b55234" stroke-width="6" stroke-linejoin="round"/>
  <path d="M900 580 L1320 580" stroke="#cc5a34" stroke-width="9"/>
  <g font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="#102b48">
    <text x="891" y="497">5</text><text x="1160" y="479">12</text><text x="1070" y="626" fill="#a3432b">14: längste</text>
  </g>
  <text x="1190" y="692" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#102b48">5² + 12² ≠ 14²</text>
  <text x="1190" y="745" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#a3432b">nicht rechtwinklig</text>

  <text x="800" y="843" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" fill="#344f67">Bei Gleichheit liegt der rechte Winkel der längsten Seite gegenüber.</text>
</svg>
