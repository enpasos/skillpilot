<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1024" viewBox="0 0 1792 1024" role="img" aria-labelledby="title description">
  <title id="title">Einzelphotonen-Interferenz am Doppelspalt</title>
  <desc id="description">Eine Einzelphotonenquelle, eine Barriere mit genau zwei getrennten Spalten und ein senkrechter Nachweisschirm. Drei kumulative Aufnahmen folgen von links nach rechts in der Zeit. In jeder Aufnahme ist die senkrechte Richtung die Ortsrichtung, in der die Trefferhaeufigkeit variiert und schliesslich horizontale Interferenzstreifen bildet.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f2ff"/>
    </linearGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#253247"/>
      <stop offset="0.5" stop-color="#64748b"/>
      <stop offset="1" stop-color="#253247"/>
    </linearGradient>
    <radialGradient id="source" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d8b4fe"/>
      <stop offset="0.55" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#581c87"/>
    </radialGradient>
    <pattern id="weakDots" width="38" height="22" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="2.3" fill="#6b21a8"/><circle cx="21" cy="15" r="2.1" fill="#7e22ce"/>
      <circle cx="34" cy="7" r="1.8" fill="#9333ea"/>
    </pattern>
    <pattern id="mediumDots" width="28" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#581c87"/><circle cx="13" cy="13" r="2.3" fill="#7e22ce"/>
      <circle cx="23" cy="6" r="2" fill="#9333ea"/>
    </pattern>
    <pattern id="denseDots" width="19" height="15" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="2" fill="#581c87"/><circle cx="10" cy="11" r="2.1" fill="#6b21a8"/>
      <circle cx="16" cy="5" r="1.8" fill="#9333ea"/>
    </pattern>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/>
    </marker>
    <marker id="timeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1d4ed8"/>
    </marker>
    <g id="fewHits" fill="#7e22ce" stroke="#3b0764" stroke-width="1.2">
      <circle cx="27" cy="46" r="4"/><circle cx="211" cy="82" r="4"/><circle cx="76" cy="147" r="4"/>
      <circle cx="232" cy="198" r="4"/><circle cx="42" cy="267" r="4"/><circle cx="147" cy="286" r="4"/>
      <circle cx="226" cy="329" r="4"/><circle cx="91" cy="382" r="4"/><circle cx="188" cy="430" r="4"/>
      <circle cx="31" cy="481" r="4"/><circle cx="132" cy="513" r="4"/><circle cx="238" cy="535" r="4"/>
    </g>
    <g id="additionalHits" fill="#7e22ce" stroke="#3b0764" stroke-width="0.8">
      <circle cx="54" cy="35" r="3"/><circle cx="105" cy="55" r="3"/><circle cx="161" cy="42" r="3"/><circle cx="239" cy="62" r="3"/>
      <circle cx="18" cy="105" r="3"/><circle cx="61" cy="117" r="3"/><circle cx="124" cy="96" r="3"/><circle cx="181" cy="121" r="3"/><circle cx="222" cy="112" r="3"/>
      <circle cx="29" cy="158" r="3"/><circle cx="96" cy="171" r="3"/><circle cx="154" cy="152" r="3"/><circle cx="205" cy="176" r="3"/><circle cx="244" cy="151" r="3"/>
      <circle cx="19" cy="229" r="3"/><circle cx="66" cy="214" r="3"/><circle cx="119" cy="240" r="3"/><circle cx="175" cy="219" r="3"/><circle cx="216" cy="244" r="3"/>
      <circle cx="25" cy="293" r="3"/><circle cx="74" cy="315" r="3"/><circle cx="111" cy="278" r="3"/><circle cx="169" cy="306" r="3"/><circle cx="210" cy="283" r="3"/><circle cx="245" cy="311" r="3"/>
      <circle cx="17" cy="351" r="3"/><circle cx="58" cy="371" r="3"/><circle cx="126" cy="345" r="3"/><circle cx="163" cy="375" r="3"/><circle cx="218" cy="360" r="3"/>
      <circle cx="36" cy="411" r="3"/><circle cx="73" cy="443" r="3"/><circle cx="119" cy="421" r="3"/><circle cx="158" cy="452" r="3"/><circle cx="231" cy="416" r="3"/>
      <circle cx="19" cy="502" r="3"/><circle cx="62" cy="519" r="3"/><circle cx="102" cy="488" r="3"/><circle cx="171" cy="525" r="3"/><circle cx="216" cy="493" r="3"/>
    </g>
  </defs>

  <rect width="1792" height="1024" fill="#fbfdff"/>
  <text x="896" y="74" text-anchor="middle" fill="#111827" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="700">Einzelphotonen-Interferenz</text>

  <!-- Experimental arrangement. No photon trajectory is drawn. -->
  <g font-family="DejaVu Sans, sans-serif">
    <!-- Source center y=512.5 is the midpoint of slit centers y=410 and y=615. -->
    <rect x="58" y="465.5" width="94" height="94" rx="14" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <circle cx="105" cy="512.5" r="25" fill="url(#source)" stroke="#3b0764" stroke-width="3"/>
    <text x="105" y="604" text-anchor="middle" fill="#111827" font-size="27">Quelle</text>
    <text x="105" y="636" text-anchor="middle" fill="#475569" font-size="20">Einzelphotonen</text>

    <!-- Exactly two openings: three opaque bars leave two separate gaps. -->
    <rect x="330" y="240" width="30" height="150" fill="url(#barrier)" stroke="#111827" stroke-width="2"/>
    <rect x="330" y="430" width="30" height="165" fill="url(#barrier)" stroke="#111827" stroke-width="2"/>
    <rect x="330" y="635" width="30" height="145" fill="url(#barrier)" stroke="#111827" stroke-width="2"/>
    <rect x="326" y="390" width="38" height="40" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="326" y="595" width="38" height="40" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="345" y="824" text-anchor="middle" fill="#111827" font-size="29" font-weight="700">Doppelspalt</text>
    <text x="390" y="405" fill="#ea580c" font-size="22">Spalt 1</text>
    <line x1="382" y1="410" x2="366" y2="410" stroke="#ea580c" stroke-width="2.5" marker-end="url(#orangeArrow)"/>
    <text x="390" y="610" fill="#ea580c" font-size="22">Spalt 2</text>
    <line x1="382" y1="615" x2="366" y2="615" stroke="#ea580c" stroke-width="2.5" marker-end="url(#orangeArrow)"/>

    <rect x="610" y="242.5" width="24" height="540" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/>
    <text x="622" y="824" text-anchor="middle" fill="#111827" font-size="27" font-weight="700">Nachweisschirm</text>
    <text x="622" y="854" text-anchor="middle" fill="#475569" font-size="20">jeder Treffer lokalisiert</text>
  </g>

  <!-- Time runs horizontally; detector position and intensity variation run vertically. -->
  <g font-family="DejaVu Sans, sans-serif">
    <line x1="700" y1="142" x2="1620" y2="142" stroke="#1d4ed8" stroke-width="4" marker-end="url(#timeArrow)"/>
    <text x="1160" y="124" text-anchor="middle" fill="#1e3a8a" font-size="23" font-weight="700">Zeit · kumulative Trefferzahl</text>

    <text x="820" y="202" text-anchor="middle" fill="#374151" font-size="23" font-weight="700">wenige Treffer</text>
    <rect x="690" y="220" width="260" height="570" rx="8" fill="url(#panel)" stroke="#111827" stroke-width="3"/>
    <use href="#fewHits" transform="translate(690 225)"/>

    <text x="1160" y="202" text-anchor="middle" fill="#374151" font-size="23" font-weight="700">mehr Treffer</text>
    <rect x="1030" y="220" width="260" height="570" rx="8" fill="url(#panel)" stroke="#111827" stroke-width="3"/>
    <use href="#fewHits" transform="translate(1030 225)"/>
    <use href="#additionalHits" transform="translate(1030 225)"/>

    <text x="1500" y="202" text-anchor="middle" fill="#374151" font-size="23" font-weight="700">viele Treffer</text>
    <rect x="1370" y="220" width="260" height="570" rx="8" fill="url(#panel)" stroke="#111827" stroke-width="3"/>
    <!-- Horizontal bands: their changing density is a function of vertical detector position. -->
    <rect x="1380" y="256" width="240" height="34" fill="url(#weakDots)" opacity="0.78"/>
    <rect x="1380" y="369" width="240" height="48" fill="url(#mediumDots)" opacity="0.9"/>
    <!-- Central maximum is centered at y=512.5: source and midpoint between both slits. -->
    <rect x="1380" y="477.5" width="240" height="70" fill="url(#denseDots)"/>
    <rect x="1380" y="608" width="240" height="48" fill="url(#mediumDots)" opacity="0.9"/>
    <rect x="1380" y="735" width="240" height="34" fill="url(#weakDots)" opacity="0.78"/>
    <use href="#fewHits" transform="translate(1370 225)" opacity="0.7"/>
    <use href="#additionalHits" transform="translate(1370 225)" opacity="0.58"/>

    <text x="1160" y="824" text-anchor="middle" fill="#475569" font-size="21">senkrechte Ortsrichtung am Schirm → wechselnde Trefferhäufigkeit</text>
  </g>

  <!-- Probability profile aligned with the vertical variation of the final detector image. -->
  <line x1="1650" y1="220" x2="1650" y2="790" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M1650 220
           C1654 242 1700 253 1714 273 C1700 292 1654 306 1650 326
           C1655 347 1726 369 1740 393 C1726 417 1655 435 1650 456
           C1658 476 1760 489 1770 512.5 C1760 536 1658 551 1650 571
           C1655 592 1726 609 1740 632 C1726 656 1655 679 1650 700
           C1654 720 1700 734 1714 752 C1700 773 1654 779 1650 790"
        fill="none" stroke="#7e22ce" stroke-width="4"/>
  <text x="1708" y="818" text-anchor="middle" fill="#111827" font-family="DejaVu Sans, sans-serif" font-size="17">Wahrscheinlichkeits-</text>
  <text x="1708" y="840" text-anchor="middle" fill="#111827" font-family="DejaVu Sans, sans-serif" font-size="17">verteilung</text>

  <rect x="760" y="900" width="790" height="78" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="1155" y="933" text-anchor="middle" fill="#1e3a8a" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700">Viele einzelne Treffer bauen das Interferenzmuster auf.</text>
  <text x="1155" y="963" text-anchor="middle" fill="#1e3a8a" font-family="DejaVu Sans, sans-serif" font-size="22">Dem Einzelphoton wird keine klassische Bahn zugeschrieben.</text>
</svg>
