<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#fff"/><g font-family="DejaVu Sans, sans-serif" fill="#15374b"><text x="50" y="55" font-size="32">Ein Intervall braucht zwei passende Differenzen</text><line x1="191.25" y1="150" x2="191.25" y2="480" stroke="#b5c9d0" stroke-width="2"/><text x="183.25" y="510" font-size="20">2</text><line x1="353.75" y1="150" x2="353.75" y2="480" stroke="#b5c9d0" stroke-width="2"/><text x="345.75" y="510" font-size="20">3</text><line x1="516.25" y1="150" x2="516.25" y2="480" stroke="#b5c9d0" stroke-width="2"/><text x="508.25" y="510" font-size="20">4</text><line x1="678.75" y1="150" x2="678.75" y2="480" stroke="#b5c9d0" stroke-width="2"/><text x="670.75" y="510" font-size="20">5</text><line x1="110" y1="438.75" x2="760" y2="438.75" stroke="#b5c9d0" stroke-width="2"/><text x="70" y="445.75" font-size="20">4</text><line x1="110" y1="356.25" x2="760" y2="356.25" stroke="#b5c9d0" stroke-width="2"/><text x="70" y="363.25" font-size="20">6</text><line x1="110" y1="273.75" x2="760" y2="273.75" stroke="#b5c9d0" stroke-width="2"/><text x="70" y="280.75" font-size="20">8</text><line x1="110" y1="191.25" x2="760" y2="191.25" stroke="#b5c9d0" stroke-width="2"/><text x="70" y="198.25" font-size="20">10</text><line x1="110" y1="480" x2="775" y2="480" stroke="#15374b" stroke-width="3"/><line x1="110" y1="480" x2="110" y2="135" stroke="#15374b" stroke-width="3"/><text x="740" y="545" font-size="23">t in s</text><text x="80" y="118" font-size="23">Ort s in m</text><line x1="191.25" y1="438.75" x2="678.75" y2="191.25" stroke="#177d91" stroke-width="5" stroke-dasharray="10 7"/><line x1="191.25" y1="438.75" x2="678.75" y2="438.75" stroke="#b45b00" stroke-width="4"/><line x1="678.75" y1="438.75" x2="678.75" y2="191.25" stroke="#b45b00" stroke-width="4"/><circle cx="191.25" cy="438.75" r="7" fill="#177d91"/><text x="146.25" y="420.75" font-size="21">(2; 4)</text><circle cx="678.75" cy="191.25" r="7" fill="#177d91"/><text x="633.75" y="173.25" font-size="21">(5; 10)</text><text x="820" y="200" font-size="26">Δs = 10 − 4 = 6 m</text><text x="820" y="255" font-size="26">Δt = 5 − 2 = 3 s</text><text x="820" y="330" font-size="27">Δs / Δt = +2 m/s</text><text x="820" y="390" font-size="24">Mittel auf [2;5] s</text><text x="820" y="440" font-size="23">Höhe ≠ Änderungsrate</text><text x="75" y="610" font-size="23">Zwei Endpunkte legen die Bewegung zwischen ihnen nicht vollständig fest.</text></g></svg>
