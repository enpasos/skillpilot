<text x="70" y="1181" font-size="34" font-weight="700">Kontrollversuch: nur T trennen.</text>
<text x="70" y="1235" font-size="33">100 kΩ bleibt von B nach 0 V.</text>
<text x="70" y="1300" font-size="33">Nur ausgeschaltet umstecken.</text>
<text x="70" y="1350" font-size="33">Vor Einschalten: Lehrkraft prüft.</text>
