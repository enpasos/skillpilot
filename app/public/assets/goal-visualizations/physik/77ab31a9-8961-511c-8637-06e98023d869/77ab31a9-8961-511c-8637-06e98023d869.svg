<path d="M610 600 V700 M610 620 L680 570 M610 680 L680 735 V980 M500 650 H610"/>
<path d="M636 703 L667 725" marker-end="url(#arrow)"/>
<rect x="70" y="560" width="190" height="160" rx="12" fill="#e8f3fa"/>
