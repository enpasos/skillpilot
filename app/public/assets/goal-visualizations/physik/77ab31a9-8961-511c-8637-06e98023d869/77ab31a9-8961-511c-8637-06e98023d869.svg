<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1430" viewBox="0 0 900 1430" role="img" aria-labelledby="title desc">
<title id="title">Vorgegebener Transistorschalter für eigene Versuche</title><desc id="desc">Vollständiger Modulplan: Plus fünf Volt über dreihundertdreißig Ohm und LED zum Kollektor eines npn-Transistors; Emitter an gemeinsam null Volt. Null- oder Fünf-Volt-Steuerung über trennbare Verbindung T und zehn Kiloohm an die Basis. Hundert Kiloohm verbinden die Basis dauerhaft mit null Volt. Der Kontrollversuch trennt nur T.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto"><path d="M0 0 L22 11 L0 22 Z" fill="#123149"/></marker></defs>
