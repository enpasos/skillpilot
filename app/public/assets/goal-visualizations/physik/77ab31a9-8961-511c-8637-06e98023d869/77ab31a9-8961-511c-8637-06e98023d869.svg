<g fill="#123149"><circle cx="680" cy="215" r="7"/><circle cx="500" cy="650" r="7"/><circle cx="170" cy="980" r="7"/><circle cx="500" cy="980" r="7"/><circle cx="680" cy="980" r="7"/></g>
<text x="535" y="220" font-size="38" font-weight="700">+5 V</text>
<text x="453" y="320" font-size="36">330 Ω</text>
<text x="680" y="463" font-size="31" text-anchor="middle" font-weight="700">LED</text>
<text x="733" y="390" font-size="34">A</text><text x="733" y="532" font-size="34">K</text>
<text x="732" y="570" font-size="36" font-weight="700">C</text><text x="732" y="760" font-size="36" font-weight="700">E</text>
<text x="525" y="617" font-size="36" font-weight="700">B</text><text x="751" y="666" font-size="35">npn</text>
<text x="165" y="602" font-size="29" text-anchor="middle">Steuerung</text><text x="165" y="684" font-size="33" text-anchor="middle" font-weight="700">0 V / 5 V</text>
<text x="293" y="606" font-size="35" font-weight="700">T</text><text x="353" y="606" font-size="32">10 kΩ</text>
<text x="284" y="840" font-size="35">100 kΩ</text><text x="247" y="896" font-size="32">B nach 0 V</text>
<text x="450" y="1048" font-size="35" text-anchor="middle">gemeinsamer 0-V-Anschluss</text>
