<g font-family="DejaVu Sans,Arial,sans-serif" fill="#123149">
<text x="450" y="65" text-anchor="middle" font-size="43" font-weight="700">Transistorschalter untersuchen</text>
<text x="450" y="115" text-anchor="middle" font-size="31">Vorgegebener Lehrmodulplan</text>
<rect x="35" y="150" width="830" height="950" rx="20" fill="#f5f9fc" stroke="#a7bfce" stroke-width="3"/>
