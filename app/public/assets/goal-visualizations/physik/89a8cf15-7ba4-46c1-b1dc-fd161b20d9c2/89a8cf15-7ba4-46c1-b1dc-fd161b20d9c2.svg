<text x="817" y="534" font-size="27" class="title">Überlagerung und Flugbahn</text>
<text x="838" y="581" font-size="29" >x = vₓ · t</text>
<text x="838" y="630" font-size="29" >y = ½ g · t²</text>
<text x="838" y="679" font-size="29" >y = [g / (2 vₓ²)] · x²</text>
<text x="817" y="737" font-size="23" >Gleiche Zeiten: gleiche x-Zuwächse,</text>
<text x="817" y="774" font-size="23" >aber wachsende y-Zuwächse.</text>
<text x="817" y="815" font-size="23" >Die Flugbahn ist eine Parabel.</text>
