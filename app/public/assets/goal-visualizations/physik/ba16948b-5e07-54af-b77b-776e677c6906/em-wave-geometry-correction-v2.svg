<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536">
  <defs>
    <linearGradient id="panelBackground" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="1100">
      <stop offset="0" stop-color="#e9effc"/>
      <stop offset="1" stop-color="#e7eaf9"/>
    </linearGradient>
    <filter id="softEdge" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="handLine" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrowBlack" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#050505"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#c2383e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#286aa5"/>
    </marker>
    <style>
      .label { font-family: "DejaVu Sans Condensed", "Liberation Sans Narrow", sans-serif; }
      .red-lobe { fill: #f6a4a8; fill-opacity: .50; stroke: #b92f36; stroke-width: 7; stroke-linejoin: round; }
      .blue-lobe { fill: #8bb9e5; fill-opacity: .46; stroke: #28699f; stroke-width: 7; stroke-linejoin: round; }
      .red-vector { stroke: #c2383e; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowRed); }
      .blue-vector { stroke: #286aa5; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <!-- Two joined clean-background patches remove only the previous field drawing.
       Their stepped left edge intentionally preserves the central comparison box. -->
  <rect x="1530" y="295" width="1140" height="460" fill="url(#panelBackground)"/>
  <rect x="1700" y="735" width="970" height="360" fill="url(#panelBackground)"/>

  <g filter="url(#handLine)">
    <!-- E field: four consecutive half-waves sharing P0..P4 on k. -->
    <path class="red-lobe" d="M1700 571 Q1790 256 1880 638 L1700 571 Z"/>
    <path class="red-lobe" d="M1880 638 Q1970 1029 2060 705 L1880 638 Z"/>
    <path class="red-lobe" d="M2060 705 Q2150 502 2240 772 L2060 705 Z"/>
    <path class="red-lobe" d="M2240 772 Q2330 1155 2420 839 L2240 772 Z"/>

    <!-- B field: exactly the same four longitudinal intervals, alternating sides. -->
    <path class="blue-lobe" d="M1700 571 Q1470 836 1880 638 L1700 571 Z"/>
    <path class="blue-lobe" d="M1880 638 Q2190 529 2060 705 L1880 638 Z"/>
    <path class="blue-lobe" d="M2060 705 Q2010 902 2240 772 L2060 705 Z"/>
    <path class="blue-lobe" d="M2240 772 Q2470 675 2420 839 L2240 772 Z"/>

    <!-- E vector bundles. -->
    <path class="red-vector" d="M1730 582 L1730 500"/><path class="red-vector" d="M1760 593 L1760 455"/>
    <path class="red-vector" d="M1790 605 L1790 425"/><path class="red-vector" d="M1820 616 L1820 455"/>
    <path class="red-vector" d="M1850 627 L1850 520"/>
    <path class="red-vector" d="M1910 649 L1910 730"/><path class="red-vector" d="M1940 660 L1940 805"/>
    <path class="red-vector" d="M1970 672 L1970 865"/><path class="red-vector" d="M2000 683 L2000 815"/>
    <path class="red-vector" d="M2030 694 L2030 755"/>
    <path class="red-vector" d="M2090 716 L2090 660"/><path class="red-vector" d="M2120 727 L2120 625"/>
    <path class="red-vector" d="M2150 739 L2150 610"/><path class="red-vector" d="M2180 750 L2180 640"/>
    <path class="red-vector" d="M2210 761 L2210 705"/>
    <path class="red-vector" d="M2270 783 L2270 855"/><path class="red-vector" d="M2300 794 L2300 925"/>
    <path class="red-vector" d="M2330 806 L2330 995"/><path class="red-vector" d="M2360 817 L2360 940"/>
    <path class="red-vector" d="M2390 828 L2390 885"/>

    <!-- B vector bundles. The third bundle is confined to P2..P3. -->
    <path class="blue-vector" d="M1730 582 L1700 604"/><path class="blue-vector" d="M1760 593 L1700 637"/>
    <path class="blue-vector" d="M1790 605 L1685 682"/><path class="blue-vector" d="M1820 616 L1755 664"/>
    <path class="blue-vector" d="M1850 627 L1818 651"/>
    <path class="blue-vector" d="M1910 649 L1942 627"/><path class="blue-vector" d="M1940 660 L2005 616"/>
    <path class="blue-vector" d="M1970 672 L2070 604"/><path class="blue-vector" d="M2000 683 L2065 639"/>
    <path class="blue-vector" d="M2030 694 L2062 672"/>
    <path class="blue-vector" d="M2090 716 L2060 738"/><path class="blue-vector" d="M2120 727 L2060 771"/>
    <path class="blue-vector" d="M2150 739 L2060 805"/><path class="blue-vector" d="M2180 750 L2115 798"/>
    <path class="blue-vector" d="M2210 761 L2178 785"/>
    <path class="blue-vector" d="M2270 783 L2302 761"/><path class="blue-vector" d="M2300 794 L2365 750"/>
    <path class="blue-vector" d="M2330 806 L2420 744"/><path class="blue-vector" d="M2360 817 L2425 773"/>
    <path class="blue-vector" d="M2390 828 L2422 806"/>
  </g>

  <!-- Propagation axis is deliberately rendered above both fields. -->
  <path d="M1635 547 L2505 870" stroke="#050505" stroke-width="10" fill="none" stroke-linecap="round" marker-end="url(#arrowBlack)"/>

  <g class="label">
    <text x="1760" y="395" font-size="62" font-weight="700" fill="#b92f36">E</text>
    <text x="1578" y="720" font-size="70" font-weight="700" fill="#28699f">B</text>
    <text x="2050" y="930" font-size="70" font-weight="700" fill="#28699f">B</text>
    <text x="2440" y="815" font-size="72" font-weight="700" fill="#050505">k</text>
    <text x="1900" y="365" font-size="48" font-weight="500" fill="#050505">gekoppelte elektrische</text>
    <text x="1900" y="420" font-size="48" font-weight="500" fill="#050505">und magnetische Felder</text>
    <path d="M1900 435 Q1875 472 1835 480" stroke="#050505" stroke-width="5" fill="none"/>
    <text x="2455" y="500" text-anchor="middle" font-size="46" font-weight="500" fill="#050505">Quelle:</text>
    <text x="2455" y="555" text-anchor="middle" font-size="46" font-weight="500" fill="#050505">beschleunigte</text>
    <text x="2455" y="610" text-anchor="middle" font-size="46" font-weight="500" fill="#050505">Ladungen</text>
  </g>
</svg>
