<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1070" viewBox="0 0 900 1070"><title>Leiter, Nichtleiter und Halbleiter: elementarer Materialvergleich</title><desc>Gleich geformte Proben aus Kupfer, Glas und Silizium werden unter vergleichbaren Bedingungen qualitativ eingeordnet. Kupfer leitet gut, Glas sehr schlecht; die typische Leitfähigkeit reinen Siliziums liegt in diesem Vergleich dazwischen. Keine Energiebänder, Dotierung oder Messdaten.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#183249}.title{font-weight:700}.muted{fill:#45647a}</style><rect width="900" height="1070" fill="#f3f8fb"/><text x="35" y="58" font-size="38" class="title">Wie gut leitet ein Material?</text><text x="35" y="105" font-size="29">Vergleichbare Bedingungen · gleiche Temperatur</text><rect x="30" y="145" width="840" height="225" rx="18" fill="white" stroke="#bfd2df" stroke-width="2"/><rect x="65" y="210" width="135" height="75" rx="5" fill="#d69a6d" stroke="#183249" stroke-width="3"/><text x="230" y="197" font-size="36" class="title">Kupfer: Leiter</text><text x="230" y="250" font-size="29">gut leitend</text><text x="65" y="335" font-size="28">Beispiel: Kern eines Stromkabels</text><rect x="30" y="400" width="840" height="225" rx="18" fill="white" stroke="#bfd2df" stroke-width="2"/><rect x="65" y="465" width="135" height="75" rx="5" fill="#d9edf3" stroke="#183249" stroke-width="3"/><text x="230" y="452" font-size="36" class="title">Glas: Nichtleiter</text><text x="230" y="505" font-size="29">sehr gering leitend</text><text x="65" y="590" font-size="28">Beispiel: elektrischer Isolator</text><rect x="30" y="655" width="840" height="225" rx="18" fill="white" stroke="#bfd2df" stroke-width="2"/><rect x="65" y="720" width="135" height="75" rx="5" fill="#aebac4" stroke="#183249" stroke-width="3"/><text x="230" y="707" font-size="36" class="title">Reines Silizium: Halbleiter</text><text x="230" y="760" font-size="29">hier zwischen Kupfer und Glas</text><text x="65" y="845" font-size="28">Beispiel: Grundmaterial von Mikrochips</text><rect x="30" y="910" width="840" height="130" rx="18" fill="white" stroke="#bfd2df" stroke-width="2"/><text x="55" y="954" font-size="28">Typische Materialien bei Raumtemperatur.</text><text x="55" y="997" font-size="28">Die Materialklasse folgt nicht aus Größe oder Form.</text></svg>
