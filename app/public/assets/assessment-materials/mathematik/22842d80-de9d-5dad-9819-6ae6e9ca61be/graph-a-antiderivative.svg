<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Gegebener Stammfunktionsgraph F, Graph A</title>
  <desc id="desc">Der Graph von F steigt von (-2,0) durch (-1,1) und (0,4) bis (2,8); bei (0,4) ändert sich seine Krümmung, ohne dass die Tangente springt. Danach fällt er durch (3,7) bis (4,4). Die Kurvenstücke sind Parabelbögen, keine Geraden.</desc>
  <rect width="800" height="500" rx="18" fill="#fffdf8"/>
  <g stroke="#e6eaf1" stroke-width="1">
    <path d="M100 40V450 M200 40V450 M300 40V450 M400 40V450 M500 40V450 M600 40V450 M700 40V450"/>
    <path d="M80 80H730 M80 170H730 M80 260H730 M80 350H730 M80 440H730"/>
  </g>
  <g stroke="#314159" stroke-width="2.5" stroke-linecap="round">
    <path d="M75 440H750 M300 455V35"/>
  </g>
  <g fill="#314159" font-family="Arial, sans-serif" font-size="28">
    <text x="735" y="465">x</text><text x="313" y="52">F(x)</text>
    <text x="88" y="470">−2</text><text x="188" y="470">−1</text>
    <text x="293" y="470">0</text><text x="394" y="470">1</text>
    <text x="494" y="470">2</text><text x="594" y="470">3</text><text x="694" y="470">4</text>
    <text x="313" y="267">4</text><text x="313" y="87">8</text>
  </g>
  <path d="M100 440 Q200 440 300 260 Q400 80 500 80 Q600 80 700 260" fill="none" stroke="#0876bd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0876bd" stroke="white" stroke-width="3">
    <circle cx="100" cy="440" r="6"/><circle cx="200" cy="395" r="6"/>
    <circle cx="300" cy="260" r="6"/><circle cx="400" cy="125" r="6"/>
    <circle cx="500" cy="80" r="6"/><circle cx="600" cy="125" r="6"/>
    <circle cx="700" cy="260" r="6"/>
  </g>
</svg>
