<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1410" viewBox="0 0 900 1410"><title>Aufgabenmaterial: drei qualitative Bandmodelle</title><desc>Drei qualitative Energie-Bandbilder mit Ausgangsbesetzung bei 0 Kelvin: A teilweise besetztes erlaubtes Band; B volles unteres und leeres oberes Band mit kleiner Bandlücke; C wie B mit einem besetzten Zusatzniveau knapp unter dem oberen Band. Höhe bedeutet Energie, nicht räumliche Schichtung.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#183249}.title{font-weight:700}path,line{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#183249"/></marker></defs><rect width="900" height="1410" fill="white"/><text x="35" y="55" font-size="36" class="title">Aufgabenmaterial: Bandmodelle A–C</text><text x="35" y="105" font-size="29">Höhe = Energie · Ausgangsbesetzung bei T = 0 K</text><rect x="30" y="145" width="840" height="315" rx="16" fill="#f5f9fc" stroke="#bfd2df" stroke-width="2"/><text x="60" y="193" font-size="36" class="title">A</text><line x1="190" y1="410" x2="190" y2="210" stroke="#183249" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="225" width="390" height="85" fill="#d5e9f7" stroke="#183249" stroke-width="2"/><rect x="270" y="310" width="390" height="85" fill="#216b91" stroke="#183249" stroke-width="2"/><text x="270" y="437" font-size="27">Ein erlaubter Energiebereich</text><rect x="30" y="490" width="840" height="315" rx="16" fill="#f5f9fc" stroke="#bfd2df" stroke-width="2"/><text x="60" y="538" font-size="36" class="title">B</text><line x1="190" y1="755" x2="190" y2="555" stroke="#183249" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="565" width="390" height="60" fill="#d5e9f7" stroke="#183249" stroke-width="2"/><rect x="270" y="695" width="390" height="60" fill="#216b91" stroke="#183249" stroke-width="2"/><text x="275" y="552" font-size="27">oberes Band</text><text x="275" y="788" font-size="27">unteres Band</text><text x="685" y="667" font-size="25">kleine</text><text x="685" y="700" font-size="25">Bandlücke</text><rect x="30" y="835" width="840" height="315" rx="16" fill="#f5f9fc" stroke="#bfd2df" stroke-width="2"/><text x="60" y="883" font-size="36" class="title">C</text><line x1="190" y1="1100" x2="190" y2="900" stroke="#183249" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="910" width="390" height="60" fill="#d5e9f7" stroke="#183249" stroke-width="2"/><rect x="270" y="1040" width="390" height="60" fill="#216b91" stroke="#183249" stroke-width="2"/><text x="275" y="897" font-size="27">oberes Band</text><text x="275" y="1133" font-size="27">unteres Band</text><text x="685" y="1012" font-size="25">kleine</text><text x="685" y="1045" font-size="25">Bandlücke</text><line x1="285" y1="989" x2="645" y2="989" stroke="#216b91" stroke-width="5"/><path d="M455 989L455 1010L595 1010" fill="none" stroke="#183249" stroke-width="1.5"/><text x="330" y="1029" font-size="24">besetztes Zusatzniveau</text><rect x="30" y="1180" width="840" height="195" rx="16" fill="#f5f9fc" stroke="#bfd2df" stroke-width="2"/><rect x="60" y="1213" width="45" height="28" fill="#216b91"/><text x="125" y="1237" font-size="28">besetzte Zustände</text><rect x="60" y="1258" width="45" height="28" fill="#d5e9f7" stroke="#183249"/><text x="125" y="1282" font-size="28">erlaubte, unbesetzte Zustände</text><text x="60" y="1332" font-size="27">Weißer Zwischenraum: keine erlaubten Zustände,</text><text x="60" y="1358" font-size="24">außer dem eingezeichneten Zusatzniveau in C.</text></svg>
