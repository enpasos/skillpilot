<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 900 960"><title>Aufgabenmaterial: einfacher Kollektor-Serienzweig</title><desc>Vorgegebene npn-Emitterschaltung mit 10 Volt Versorgung und 1 Kiloohm Kollektorwiderstand, Emitter an 0 Volt, Ausgang am Kollektor. Die Basisansteuerung ist vorgegeben. Markiert sind Kollektorstrom, Widerstandsspannungsabfall und Ausgangsspannung. Die Modellbeziehungen U_R=R_C I_C und U_C=10 Volt−U_R sind bereitgestellt.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#183249}.title{font-weight:700}path,line{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#183249"/></marker></defs><rect width="900" height="960" fill="white"/><text x="35" y="55" font-size="37" class="title">Material: einfache Emitterschaltung</text><text x="35" y="105" font-size="29">Kollektorzweig und Spannungsbeziehungen</text><text x="425" y="155" font-size="33">+10 V</text><path d="M470 175V220M470 320V365M470 525V660H160V575M160 485V455H390" fill="none" stroke="#183249" stroke-width="4"/><rect x="448" y="220" width="44" height="100" fill="white" stroke="#183249" stroke-width="3"/><text x="550" y="250" font-size="30">R_C = 1,0 kΩ</text><path d="M410 225V320" fill="none" stroke="#183249" stroke-width="2.5" marker-end="url(#arrow)"/><text x="345" y="280" font-size="30">I_C</text><path d="M525 220V320" fill="none" stroke="#183249" stroke-width="2" marker-end="url(#arrow)"/><text x="545" y="310" font-size="30">U_R</text><circle cx="430" cy="445" r="90" fill="#eef6fb" stroke="#183249" stroke-width="2.5"/><path d="M390 400V490M390 405L470 365M390 485L470 525" fill="none" stroke="#183249" stroke-width="4"/><path d="M430 505L461 520" fill="none" stroke="#183249" stroke-width="3" marker-end="url(#arrow)"/><text x="325" y="445" font-size="31">B</text><text x="490" y="382" font-size="31">C</text><text x="490" y="545" font-size="31">E</text><path d="M470 345H710M710 345V660M470 660H710" fill="none" stroke="#183249" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M710 365V640" fill="none" stroke="#183249" stroke-width="2" marker-end="url(#arrow)"/><text x="735" y="480" font-size="31">U_C</text><text x="730" y="520" font-size="24">gegen 0 V</text><circle cx="470" cy="345" r="6" fill="#183249"/><path d="M440 660H500M450 675H490M460 690H480" fill="none" stroke="#183249" stroke-width="3"/><text x="530" y="686" font-size="30">0 V</text><circle cx="160" cy="530" r="45" fill="white" stroke="#183249" stroke-width="2.5"/><path d="M160 552V508" fill="none" stroke="#183249" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="405" font-size="28">I_B(t) vorgegeben</text><text x="40" y="725" font-size="26">Spannungspfeile markieren Bezugsspannungen.</text><rect x="30" y="765" width="840" height="165" rx="16" fill="#f5f9fc" stroke="#bfd2df" stroke-width="2"/><text x="60" y="810" font-size="29" class="title">Vorgegebene Modellbeziehungen:</text><text x="60" y="859" font-size="32">U_R = R_C · I_C</text><text x="60" y="906" font-size="32">U_C = 10 V − U_R</text></svg>
