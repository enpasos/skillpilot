<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><title>Aufgabenmaterial: Schaltung und Diodenkennlinie</title><desc>Geschlossener Kleinspannungs-Serienkreis mit Quelle, Diode und Widerstand; technische Bezugsrichtung A nach K. Kennliniendaten bei konstanter Temperatur: minus ein Volt, minus 0,001 Milliampere; plus 0,2 Volt, plus 0,001 Milliampere; plus 0,6 Volt, plus zwei Milliampere. Die Grafik gibt keine Deutung als Durchlass- oder Sperrpolung vor.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#183249"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#183249}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1440" height="760" fill="white"/><text x="40" y="55" font-size="31" font-weight="bold">Aufgabenmaterial: Schaltung und Kennlinie einer Diode</text><text x="40" y="100" font-size="23">Kleinspannung, Strombegrenzung; U_D ist die Spannung A gegen K.</text><path d="M100 300H260M330 300H470V510H100V360" fill="none" stroke="#183249" stroke-width="4"/><circle cx="100" cy="330" r="30" fill="white" stroke="#183249" stroke-width="3"/><text x="90" y="323" font-size="24">+</text><text x="89" y="353" font-size="24">−</text><path d="M260 270L310 300L260 330Z" fill="white" stroke="#183249" stroke-width="4"/><line x1="320" y1="265" x2="320" y2="335" stroke="#183249" stroke-width="4"/><line x1="310" y1="300" x2="330" y2="300" stroke="#183249" stroke-width="4"/><rect x="445" y="380" width="50" height="75" fill="white" stroke="#183249" stroke-width="3"/><text x="505" y="420" font-size="24">R</text><text x="230" y="365" font-size="24">A</text><text x="325" y="365" font-size="24">K</text><path d="M230 225H355" stroke="#183249" stroke-width="3" marker-end="url(#a)"/><text x="275" y="205" font-size="24">I_D</text><text x="40" y="580" font-size="22">Quelle in der gezeigten Polung;</text><text x="40" y="615" font-size="22">für den zweiten Fall umpolen.</text><text x="650" y="155" font-size="24">I_D / mA</text><path d="M640 560H1380M1070 600V175" fill="none" stroke="#183249" stroke-width="2" marker-end="url(#a)"/><text x="1260" y="615" font-size="24">U_D / V</text><line x1="690" y1="553" x2="690" y2="567" stroke="#183249" stroke-width="2"/><text x="690" y="590" text-anchor="middle" font-size="20">−1,0</text><line x1="1070" y1="553" x2="1070" y2="567" stroke="#183249" stroke-width="2"/><text x="1070" y="590" text-anchor="middle" font-size="20">0</text><line x1="1146.0" y1="553" x2="1146.0" y2="567" stroke="#183249" stroke-width="2"/><text x="1146.0" y="590" text-anchor="middle" font-size="20">+0,2</text><line x1="1298.0" y1="553" x2="1298.0" y2="567" stroke="#183249" stroke-width="2"/><text x="1298.0" y="590" text-anchor="middle" font-size="20">+0,6</text><line x1="1063" y1="395" x2="1077" y2="395" stroke="#183249" stroke-width="2"/><text x="1050" y="402" text-anchor="end" font-size="20">1</text><line x1="1063" y1="230" x2="1077" y2="230" stroke="#183249" stroke-width="2"/><text x="1050" y="237" text-anchor="end" font-size="20">2</text><path d="M690 560.165C830 560.16 1000 560.1 1070 560C1100 560 1125 560 1146 559.835C1200 559.5 1260 420 1298 230" fill="none" stroke="#176b94" stroke-width="4"/><circle cx="690" cy="560.165" r="6" fill="#183249"/><circle cx="1146.0" cy="559.835" r="6" fill="#183249"/><circle cx="1298.0" cy="230" r="6" fill="#183249"/><text x="660" y="450" font-size="21">Q: (−1,0 V | −0,001 mA)</text><path d="M700 467L690 550" fill="none" stroke="#45647a" stroke-width="1.5"/><text x="940" y="680" font-size="21">R: (+0,2 V | +0,001 mA)</text><path d="M1130 648L1146 571" fill="none" stroke="#45647a" stroke-width="1.5"/><text x="1110" y="195" font-size="21">P: (+0,6 V | +2 mA)</text><text x="650" y="725" font-size="20">Vorliegende Diode, konstante Temperatur; Punkte beschriftet.</text></svg>
