<svg xmlns="http://www.w3.org/2000/svg" width="850" height="640" viewBox="0 0 850 640" role="img" aria-labelledby="title desc">
<title id="title">Gegebener Graph von p und drei Geraden</title>
<desc id="desc">Der Graph p(x)=−0,5x²+12x auf 0≤x≤24 und die horizontalen Geraden a:y=54,b:y=72,c:y=80. Die x-Achse ist in Dreierschritten, die senkrechte Achse in Achtzehnerschritten beschriftet. Farbe und Linienart unterscheiden die Kurven; gemeinsame Punkte sind nicht markiert.</desc>
