<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Eingabegraph f mit berührender Nullstelle</title>
  <desc id="desc">Ein gekrümmter Funktionsgraph liegt nie unter der x-Achse. Er berührt die x-Achse bei x gleich eins und hat bei x gleich null und x gleich zwei jeweils Höhe eins.</desc>
  <rect width="800" height="460" rx="18" fill="#fffdf8"/>
  <g stroke="#e6eaf1" stroke-width="1">
    <path d="M40 40V390 M140 40V390 M340 40V390 M540 40V390 M640 40V390"/>
    <path d="M40 100H740 M40 220H740 M40 340H740"/>
  </g>
  <g stroke="#314159" stroke-width="2.5" stroke-linecap="round">
    <path d="M40 340H748 M140 390V35"/>
  </g>
  <g fill="#314159" font-family="Arial, sans-serif" font-size="22">
    <text x="735" y="365">x</text>
    <text x="151" y="50">f(x)</text>
    <text x="130" y="370">0</text>
    <text x="332" y="370">1</text>
    <text x="531" y="370">2</text>
    <text x="151" y="228">1</text>
  </g>
  <polyline fill="none" stroke="#0876bd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="40,70 80,137.2 120,194.8 140,220 180,263.2 220,296.8 260,320.8 300,335.2 340,340 380,335.2 420,320.8 460,296.8 500,263.2 540,220 560,194.8 600,137.2 640,70"/>
  <g fill="#0876bd" stroke="white" stroke-width="3">
    <circle cx="140" cy="220" r="7"/>
    <circle cx="340" cy="340" r="7"/>
    <circle cx="540" cy="220" r="7"/>
  </g>
</svg>
