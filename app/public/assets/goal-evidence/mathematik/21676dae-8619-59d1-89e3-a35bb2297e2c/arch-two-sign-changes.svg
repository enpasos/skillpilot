<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Eingabegraph f mit zwei Vorzeichenwechseln</title>
  <desc id="desc">Ein gekrümmter Funktionsgraph liegt links von minus eins unter der x-Achse, zwischen minus eins und eins darüber und rechts von eins wieder darunter. Die Nullstellen sind bei minus eins und eins, der Punkt bei x gleich null hat Höhe eins.</desc>
  <rect width="800" height="460" rx="18" fill="#fffdf8"/>
  <g stroke="#e6eaf1" stroke-width="1">
    <path d="M80 36V420 M200 36V420 M400 36V420 M600 36V420 M720 36V420"/>
    <path d="M60 60H740 M60 180H740 M60 300H740 M60 420H740"/>
  </g>
  <g stroke="#314159" stroke-width="2.5" stroke-linecap="round">
    <path d="M60 180H748 M400 428V35"/>
  </g>
  <g fill="#314159" font-family="Arial, sans-serif" font-size="22">
    <text x="735" y="205">x</text>
    <text x="500" y="55">f(x)</text>
    <text x="185" y="210">−1</text>
    <text x="591" y="210">1</text>
    <text x="410" y="210">0</text>
    <text x="413" y="68">1</text>
  </g>
  <polyline fill="none" stroke="#0876bd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="80,367.2 120,295.2 160,232.8 200,180 240,136.8 280,103.2 320,79.2 360,64.8 400,60 440,64.8 480,79.2 520,103.2 560,136.8 600,180 640,232.8 680,295.2 720,367.2"/>
  <g fill="#0876bd" stroke="white" stroke-width="3">
    <circle cx="200" cy="180" r="7"/>
    <circle cx="400" cy="60" r="7"/>
    <circle cx="600" cy="180" r="7"/>
  </g>
</svg>
