site_name: SkillPilot
site_url: https://skillpilot.com/
repo_url: https://github.com/enpasos/skillpilot
repo_name: enpasos/skillpilot

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home [draft]: index.md
  - Start Here:
      - Schnellstart (Deutsch): story2/story.de.md
      - Quickstart (English): story2/story.en.md
      - Whitepaper (English): whitepaper/whitepaper.en.md
      - Whitepaper (Deutsch): whitepaper/whitepaper.de.md
  - Learners & Teachers:
      - Learning Process [draft]: learning_process.md
      - Strategies [draft]: learning_strategies.md
      - Velocity [draft]: learning_velocity.md
      - Spaced Repetition [draft]: spaced_repetition_system.md
      - Feynman Rules [draft]: feynman_rules_for_learning.md
      - Import/Export [draft]: export_import.md
  - Curriculum Champions:
      - Champion Guide [draft]: curriculum_champions.md
      - Curriculum Structure [draft]: curriculum_structure.md
      - Module Landscape [draft]: module-landscape.md
      - Landscape Metrics [draft]: landscape-metrics.md
      - Mannheim Metrics [draft]: mannheim-metrics.md
  - Institutions & Ministries:
      - Data & Privacy [draft]: data_concept.md
  - Developers & Designers:
      - Konzept:
          - Curriculum Graph Definition: graph_mathematical_definition.md
          - Relation Checks [draft]: requires_relation_checks.md
          - Exam Nodes (Concept) [draft]: concept_exam_node.md
          - Exam Mode (GPT) [draft]: concept_exam_mode_gpt.md
          - Title Localization (Concept) [draft]: title_concept.md
      - Development:
          - Production Pipeline [draft]: graph_production_pipeline.md
          - Landscape JSON Field Reference [draft]: landscape-json-field-reference.md
          - CI [draft]: ci.md
          - Deployment [draft]: deployment.md
          - Database (Liquibase) [draft]: liquibase.md
          - Auto-Update [draft]: autoupdate_mechanism.md
