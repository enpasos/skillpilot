site_name: SkillPilot
site_url: https://enpasos.github.io/skillpilot/
repo_url: https://github.com/enpasos/skillpilot
repo_name: enpasos/skillpilot

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/language-switcher.css

extra_javascript:
  - javascripts/bilingual-map.js
  - javascripts/language-switcher.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

exclude_docs: |
  **/source/**
  **/*-source/**

# Navigation policy: this tree lists the section index pages plus the durable
# entry documents per section. Generated status artifacts and dated audit or
# rollout dossiers are intentionally not listed here; they stay reachable
