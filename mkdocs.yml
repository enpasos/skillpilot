site_name: SkillPilot
site_url: https://skillpilot.com/
repo_url: https://github.com/enpasos/skillpilot
repo_name: enpasos/skillpilot

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Whitepaper:
      - English: whitepaper/whitepaper.en.md
      - Deutsch: whitepaper/whitepaper.de.md
  - Concepts:
      - Data & Privacy: data_concept.md
      - Curriculum Structure: curriculum_structure.md
      - Module Landscape: module-landscape.md
  - Graph Architecture:
      - Mathematical Definition: graph_mathematical_definition.md
      - Production Pipeline: graph_production_pipeline.md
      - Relation Checks: requires_relation_checks.md
      - Import/Export: export_import.md
  - Learning & Didactics:
      - Learning Process: learning_process.md
      - Strategies: learning_strategies.md
      - Velocity: learning_velocity.md
      - Spaced Repetition: spaced_repetition_system.md
      - Feynman Rules: feynman_rules_for_learning.md
  - Operations:
      - CI: ci.md
      - Deployment: deployment.md
      - Database (Liquibase): liquibase.md
      - Auto-Update: autoupdate_mechanism.md
  - Metrics:
      - Mannheim: mannheim-metrics.md
      - Landscape: landscape-metrics.md
  - Use Cases: use_case_scenarios.md
  - Work Notes:
       - Hall of Fame: work_notes_hall_of_fame.md
