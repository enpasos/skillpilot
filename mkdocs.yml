site_name: SkillPilot
site_url: https://skillpilot.com/
repo_url: https://github.com/enpasos/skillpilot
repo_name: enpasos/skillpilot

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Concept:
      - Curriculum Graph:
          - Graph Definition: graph_mathematical_definition.md
          - Node Types: node_types.md
      - Levels of Personalization: levels_of_personalization.md
      - Runtime Workflows:
          - Learning Workflow: learning_workflow.md
          - Import/Export Workflow: import_export_workflow.md
      - Didactic:
          - Feynman Rules: feynman_rules_for_learning.md
          - Learning Velocity: learning_velocity.md
          - Autopilot & Frontier Goal Selection Strategies: frontier_goal_selection_strategies_and_autopilot.md
  - Production Pipelines:
      - Curriculum Graph: graph_production_pipeline.md
  - QA & CI:
      - CI: ci.md
      - Relation Checks: requires_relation_checks.md
      - Champion Guide: curriculum_champions.md
  - Deploy:
      - Deployment: deployment.md
  - Dev:
      - Landscape JSON Field Reference: landscape-json-field-reference.md
      - Database (Liquibase): liquibase.md
      - Auto-Update: autoupdate_mechanism.md
  - Security:
      - Data & Privacy: data_concept.md
