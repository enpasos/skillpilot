server:
  port: 8080
  forward-headers-strategy: framework

logging:
  file:
    name: logs/skillpilot.log
  level:
    root: INFO
    com.skillpilot.backend: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

spring:
  application:
    name: skillpilot-backend
  ai:
    mcp:
      server:
        enabled: ${skillpilot.claude.mcp.enabled:false}
        protocol: STATELESS
        name: skillpilot-claude-mcp
        version: 0.1.0
        type: SYNC
        instructions: >-
          Follow the user's explicit request and the descriptions of the currently available tools.
          When getCoachContext is available and the request is a coaching task, call it first and
          follow state.stateMachine.requiredAction. After changing coach state, reload the context
          before making another coaching decision. Preserve backend-provided fields unchanged when
          passing them between tools. When getCoachContext returns a language, answer in that language;
          otherwise continue in the user's language. Never ask for or expose a permanent SkillPilot ID
          or an OAuth credential.
        capabilities:
          resource: false
          tool: true
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /api/claude/mcp
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:skillpilot}
    username: ${POSTGRES_USER:skillpilot}
    password: ${POSTGRES_PASSWORD:skillpilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  endpoint:
    health:
      probes:
        enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}

skillpilot:
  public-base-url: ${SKILLPILOT_PUBLIC_BASE_URL:https://skillpilot.com}
  claude:
    enabled: ${SKILLPILOT_CLAUDE_ENABLED:false}
    secure-cookie: ${SKILLPILOT_CLAUDE_SECURE_COOKIE:true}
    binding-ttl: ${SKILLPILOT_CLAUDE_BINDING_TTL:PT5M}
    launch-ttl: ${SKILLPILOT_CLAUDE_LAUNCH_TTL:PT5M}
    mcp-url: ${SKILLPILOT_CLAUDE_MCP_URL:https://skillpilot.com/api/claude/mcp}
    mcp:
      enabled: ${SKILLPILOT_CLAUDE_MCP_ENABLED:${SKILLPILOT_CLAUDE_ENABLED:false}}
      coach-enabled: ${SKILLPILOT_CLAUDE_COACH_TOOLS_ENABLED:true}
      regression-enabled: ${SKILLPILOT_CLAUDE_REGRESSION_TOOLS_ENABLED:false}
    oauth:
      # Claude's hosted clients identify themselves with this CIMD URL. Override
      # only if Anthropic changes the published client metadata document.
      client-id: ${SKILLPILOT_CLAUDE_OAUTH_CLIENT_ID:https://claude.ai/oauth/mcp-oauth-client-metadata}
      protected-resource-metadata: ${SKILLPILOT_CLAUDE_RESOURCE_METADATA:https://skillpilot.com/api/claude/oauth/protected-resource}
      access-token-ttl: ${SKILLPILOT_CLAUDE_ACCESS_TOKEN_TTL:PT1H}
      refresh-token-ttl: ${SKILLPILOT_CLAUDE_REFRESH_TOKEN_TTL:P30D}
  curriculum:
    source: ${SKILLPILOT_CURRICULUM_SOURCE:repository}
    consumer-version: ${SKILLPILOT_CURRICULUM_CONSUMER_VERSION:0.1.0}
    packages:
      store-directory: ${SKILLPILOT_CURRICULUM_PACKAGE_STORE:../tmp/curriculum-package-store}
      active-lock: ${SKILLPILOT_CURRICULUM_PACKAGE_LOCK:locks/active.json}
  landscapes:
    directory: ../curricula
  ai:
    api-key: ${SKILLPILOT_AI_API_KEY:}
    trace:
      enabled: ${SKILLPILOT_AI_TRACE_ENABLED:false}
      path: ${SKILLPILOT_AI_TRACE_PATH:tmp/ai-trace.jsonl}
      max-body-chars: ${SKILLPILOT_AI_TRACE_MAX_BODY_CHARS:50000}
  security:
    signing-secret: ${SKILLPILOT_SIGNING_SECRET:default-insecure-secret-change-me}


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
 

cors:
  allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
