server:
  port: 8080
  forward-headers-strategy: framework

logging:
  file:
    name: logs/skillpilot.log
  level:
    root: INFO
    com.skillpilot.backend: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

spring:
  application:
    name: skillpilot-backend
  ai:
    mcp:
      server:
        # SkillPilot registers one stateless transport and one explicit tool allowlist per
        # provider contract line. Keep Spring AI's singular, context-wide MCP auto-server disabled.
        enabled: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:skillpilot}
    username: ${POSTGRES_USER:skillpilot}
    password: ${POSTGRES_PASSWORD:skillpilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      client:
        registration:
          github:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}

skillpilot:
  public-base-url: ${SKILLPILOT_PUBLIC_BASE_URL:https://skillpilot.com}
  claude:
    enabled: ${SKILLPILOT_CLAUDE_ENABLED:false}
    secure-cookie: ${SKILLPILOT_CLAUDE_SECURE_COOKIE:true}
    binding-ttl: ${SKILLPILOT_CLAUDE_BINDING_TTL:PT5M}
    launch-ttl: ${SKILLPILOT_CLAUDE_LAUNCH_TTL:PT5M}
    mcp-url: ${SKILLPILOT_CLAUDE_MCP_URL:https://skillpilot.com/api/claude/mcp}
    mcp:
      enabled: ${SKILLPILOT_CLAUDE_MCP_ENABLED:${SKILLPILOT_CLAUDE_ENABLED:false}}
      coach-enabled: ${SKILLPILOT_CLAUDE_COACH_TOOLS_ENABLED:true}
      regression-enabled: ${SKILLPILOT_CLAUDE_REGRESSION_TOOLS_ENABLED:false}
      server-name: ${SKILLPILOT_CLAUDE_MCP_SERVER_NAME:skillpilot-claude-mcp}
      server-version: ${SKILLPILOT_CLAUDE_MCP_SERVER_VERSION:0.1.0}
      request-timeout: ${SKILLPILOT_CLAUDE_MCP_REQUEST_TIMEOUT:PT30S}
      instructions: >-
        Follow the user's explicit request and the descriptions of the currently available tools.
        When getCoachContext is available and the request is a coaching task, call it first and
        follow state.stateMachine.requiredAction. After changing coach state, reload the context
        before making another coaching decision. Preserve backend-provided fields unchanged when
        passing them between tools. When getCoachContext returns a language, answer in that language;
        otherwise continue in the user's language. Never ask for or expose a permanent SkillPilot ID
        or an OAuth credential.
    oauth:
      # Claude's hosted clients identify themselves with this CIMD URL. Override
      # only if Anthropic changes the published client metadata document.
      client-id: ${SKILLPILOT_CLAUDE_OAUTH_CLIENT_ID:https://claude.ai/oauth/mcp-oauth-client-metadata}
      protected-resource-metadata: ${SKILLPILOT_CLAUDE_RESOURCE_METADATA:https://skillpilot.com/api/claude/oauth/protected-resource}
      access-token-ttl: ${SKILLPILOT_CLAUDE_ACCESS_TOKEN_TTL:PT1H}
      refresh-token-ttl: ${SKILLPILOT_CLAUDE_REFRESH_TOKEN_TTL:P30D}
  openai:
    coach:
      v1:
        enabled: ${SKILLPILOT_OPENAI_COACH_V1_ENABLED:false}
        bootstrap-enabled: ${SKILLPILOT_OPENAI_COACH_V1_BOOTSTRAP_ENABLED:false}
        writes-enabled: ${SKILLPILOT_OPENAI_COACH_V1_WRITES_ENABLED:false}
        # These policies are shared by every OpenAI coach contract hosted in
        # this one Spring Boot process.
        secure-cookie: ${SKILLPILOT_OPENAI_SECURE_COOKIE:true}
        binding-ttl: ${SKILLPILOT_OPENAI_BINDING_TTL:PT5M}
        launch-ttl: ${SKILLPILOT_OPENAI_LAUNCH_TTL:PT5M}
        learning-session-ttl: ${SKILLPILOT_OPENAI_LEARNING_SESSION_TTL:PT24H}
        cleanup-interval-ms: ${SKILLPILOT_OPENAI_CLEANUP_INTERVAL_MS:3600000}
        # Public endpoints are immutable parts of the language-neutral V1
        # contract. Nginx maps this origin to its internal route in this JVM.
        mcp-url: https://mcp-coach-v1.skillpilot.com/mcp
        oauth-resource: https://mcp-coach-v1.skillpilot.com/mcp
        server-build: "@skillpilotServerBuild@"
        # Optional assertion only. The effective revision is derived from the
        # loaded repository JSON or active package generation at startup.
        curriculum-revision: ${SKILLPILOT_CURRICULUM_REVISION:}
        workflow-version: ${SKILLPILOT_OPENAI_COACH_V1_WORKFLOW_VERSION:coach@1.0}
        open-ai-apps-challenge: ${SKILLPILOT_OPENAI_COACH_V1_OPENAI_APPS_CHALLENGE:}
        chatgpt-url: ${SKILLPILOT_OPENAI_CHATGPT_URL:https://chatgpt.com/}
        security:
          # Mandatory OAuth/provider safety baseline. It mirrors provider
          # activation; an explicit false override is rejected at startup.
          secure-mode: ${SKILLPILOT_OPENAI_COACH_V1_ENABLED:false}
        rate-limit:
          enabled: ${SKILLPILOT_OPENAI_RATE_LIMIT_ENABLED:true}
          window: ${SKILLPILOT_OPENAI_RATE_LIMIT_WINDOW:PT1M}
          mcp-requests: ${SKILLPILOT_OPENAI_RATE_LIMIT_MCP_REQUESTS:120}
          oauth-requests: ${SKILLPILOT_OPENAI_RATE_LIMIT_OAUTH_REQUESTS:60}
          ui-requests: ${SKILLPILOT_OPENAI_RATE_LIMIT_UI_REQUESTS:60}
          metadata-requests: ${SKILLPILOT_OPENAI_RATE_LIMIT_METADATA_REQUESTS:120}
          max-client-buckets: ${SKILLPILOT_OPENAI_RATE_LIMIT_MAX_CLIENT_BUCKETS:10000}
        mcp:
          enabled: ${SKILLPILOT_OPENAI_COACH_V1_MCP_ENABLED:${SKILLPILOT_OPENAI_COACH_V1_ENABLED:false}}
          server-name: skillpilot-coach-v1
          server-version: "@skillpilotServerBuild@"
          request-timeout: PT30S
        oauth:
          enabled: ${SKILLPILOT_OPENAI_COACH_V1_OAUTH_ENABLED:false}
          # The V1 coach owns one pre-registered static confidential client in
          # the authorization server hosted by this process.
          client-id: ${SKILLPILOT_OPENAI_COACH_V1_OAUTH_CLIENT_ID:}
          client-secret: ${SKILLPILOT_OPENAI_COACH_V1_OAUTH_CLIENT_SECRET:}
          redirect-uris: ${SKILLPILOT_OPENAI_COACH_V1_OAUTH_REDIRECT_URIS:}
          client-authentication-method: ${SKILLPILOT_OPENAI_COACH_V1_OAUTH_CLIENT_AUTHENTICATION_METHOD:client_secret_basic}
          client-jwk-set-uri: ${SKILLPILOT_OPENAI_COACH_V1_OAUTH_CLIENT_JWK_SET_URI:}
          client-assertion-signing-algorithm: ${SKILLPILOT_OPENAI_COACH_V1_OAUTH_CLIENT_ASSERTION_SIGNING_ALGORITHM:RS256}
          client-assertion-replay-cache-size: ${SKILLPILOT_OPENAI_OAUTH_CLIENT_ASSERTION_REPLAY_CACHE_SIZE:10000}
          # Exact former draft client IDs accepted only by the one-way cutover.
          legacy-client-ids: ${SKILLPILOT_OPENAI_COACH_V1_OAUTH_LEGACY_CLIENT_IDS:}
          protected-resource-metadata: https://mcp-coach-v1.skillpilot.com/.well-known/oauth-protected-resource/mcp
          access-token-ttl: ${SKILLPILOT_OPENAI_OAUTH_ACCESS_TOKEN_TTL:PT1H}
          refresh-token-ttl: ${SKILLPILOT_OPENAI_OAUTH_REFRESH_TOKEN_TTL:P30D}
  curriculum:
    source: ${SKILLPILOT_CURRICULUM_SOURCE:repository}
    consumer-version: ${SKILLPILOT_CURRICULUM_CONSUMER_VERSION:0.1.0}
    packages:
      store-directory: ${SKILLPILOT_CURRICULUM_PACKAGE_STORE:../tmp/curriculum-package-store}
      active-lock: ${SKILLPILOT_CURRICULUM_PACKAGE_LOCK:locks/active.json}
  landscapes:
    directory: ../curricula
  ai:
    api-key: ${SKILLPILOT_AI_API_KEY:}
    trace:
      enabled: ${SKILLPILOT_AI_TRACE_ENABLED:false}
      path: ${SKILLPILOT_AI_TRACE_PATH:tmp/ai-trace.jsonl}
      max-body-chars: ${SKILLPILOT_AI_TRACE_MAX_BODY_CHARS:50000}
  security:
    signing-secret: ${SKILLPILOT_SIGNING_SECRET:default-insecure-secret-change-me}

management:
  endpoint:
    health:
      probes:
        enabled: true
      # openAiDeCoach exists only while the provider is enabled. Keep the
      # readiness group valid for deployments in which that feature is off.
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,db,openAiDeCoach


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
 

cors:
  allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
