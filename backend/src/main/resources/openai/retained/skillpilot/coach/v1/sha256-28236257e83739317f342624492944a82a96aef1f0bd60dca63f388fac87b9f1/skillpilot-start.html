:root {

}

html,

  margin: 0;
  background: transparent;
}

button,
input,

  font: inherit;
}

.id-group {
  display: grid;
  gap: 0.45rem;
}

.id-label,

.language-fieldset legend {
  font-size: 0.9rem;
  font-weight: 700;
}

.identity-fieldset {

  margin: 0;
  padding: 0;
  border: 0;
}

.identity-fieldset legend {
  margin-bottom: 0.45rem;
}

.identity-options,

}

.identity-option input {
  width: 1rem;
  height: 1rem;
  margin-top: 0.2rem;
  flex: 0 0 auto;
  accent-color: #0789d1;
}

.identity-option-text {
  display: grid;
  gap: 0.2rem;
}

.identity-option-title {
  font-size: 0.95rem;
}

.identity-option-body,
.setup-option-description {

  font-size: 0.85rem;

.created-id-group {

  border: 1px solid #d5b66f;
  border-radius: 0.8rem;

.created-id-value {

  padding: 0.75rem;
  border: 1px solid #b8c4d3;
  border-radius: 0.65rem;
  background: #f4f8fc;
  color: #152033;
  font-size: 0.9rem;
  overflow-wrap: anywhere;
  user-select: all;
}

.setup-decision {
  display: grid;
  gap: 0.2rem;
}

.setup-shell {
  gap: 0.8rem;
}

.setup-step {
  display: grid;
  gap: 0;
  overflow: hidden;
  border: 1px solid #d7dee8;
  border-radius: 0.85rem;
  background: #ffffff;
}

.setup-step-header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 0.75rem;
  padding: 0.9rem;
}

.setup-step-number {
  display: inline-grid;
  width: 2rem;
  height: 2rem;
  place-items: center;
  border-radius: 999px;
  background: #0284c7;
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 750;
}

.setup-step-heading {
  display: grid;
  gap: 0.2rem;
}

.setup-step-title,
.setup-step-status,
.setup-step-summary,
.personalization-history-title,
.personalization-history-group-label,
.personalization-history-selection {
  margin: 0;
}

.setup-step-title {
  font-size: 1rem;
  line-height: 1.35;
}

.setup-step-status {
  color: #047857;
  font-size: 0.78rem;
  font-weight: 700;
}

.setup-step-summary {
  color: #526077;
  font-size: 0.82rem;
  line-height: 1.4;
}

.setup-step-toggle,
.setup-history-change {
  min-height: 2.75rem;
  padding: 0.55rem 0.7rem;
  border: 0;
  background: transparent;
  color: #0369a1;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 700;
}

.setup-step-toggle:hover,
.setup-step-toggle:focus-visible,
.setup-history-change:hover,
.setup-history-change:focus-visible {
  border-radius: 0.4rem;
  outline: 3px solid rgb(3 137 211 / 20%);
  outline-offset: 1px;
}

.setup-step-content {
  display: grid;
  gap: 0.8rem;
  padding: 0 0.9rem 0.9rem 3.65rem;
  border-top: 1px solid #e6ebf1;
  padding-top: 0.9rem;
}

.setup-step-content[hidden] {
  display: none;
}

.personalization-history-group,
.personalization-history-list {
  display: grid;
  gap: 0.45rem;
}

.personalization-history-title {
  color: #526077;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.personalization-history-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.65rem;
  padding: 0.65rem;
  border-radius: 0.65rem;
  background: #f4f8fc;
}

.personalization-history-labels {
  display: grid;
  gap: 0.15rem;
}

.personalization-history-group-label {
  font-size: 0.82rem;
  font-weight: 700;
}

.personalization-history-selection {
  color: #526077;
  font-size: 0.82rem;
  line-height: 1.4;
}

.setup-final-actions {
  justify-content: flex-end;
}

.setup-stage,
.setup-group {
  margin: 0;
}

.setup-stage {
  color: #526077;
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
}

.setup-group {
  font-size: 1rem;
}

.setup-option {
  display: grid;
  gap: 0.25rem;
  width: 100%;
  min-height: 2.75rem;
  padding: 0.75rem 0.85rem;
  border: 1px solid #9aa9bc;
  border-radius: 0.75rem;
  background: #ffffff;
  color: #142033;
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  text-align: left;
}

.setup-option:hover,
.setup-option:focus-visible {
  border-color: #057dbd;
  outline: 3px solid rgb(3 137 211 / 20%);
  outline-offset: 2px;
}

.curriculum-filter-fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.curriculum-filter-label {
  margin-bottom: 0.4rem;
  color: #526077;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.curriculum-category-tabs,
.curriculum-quality-buttons {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.25rem;
  padding: 0.25rem;
  border: 1px solid #d7dee8;
  border-radius: 0.7rem;
  background: #f4f8fc;
}

.curriculum-quality-buttons {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.curriculum-filter-button {
  min-height: 2.35rem;
  padding: 0.45rem 0.55rem;
  border: 0;
  border-radius: 0.5rem;
  background: transparent;
  color: #26354a;
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 650;
}

.curriculum-filter-button:hover,
.curriculum-filter-button:focus-visible {
  outline: 3px solid rgb(3 137 211 / 20%);
  outline-offset: 1px;
}

.curriculum-filter-button.is-active-category {
  background: #0284c7;
  color: #ffffff;
  box-shadow: 0 1px 2px rgb(15 23 42 / 15%);
}

.curriculum-filter-button.quality-all.is-active-quality {
  background: #0369a1;
  color: #ffffff;
  box-shadow: 0 1px 2px rgb(15 23 42 / 15%);
}

.curriculum-filter-button.quality-green.is-active-quality {
  background: #047857;
  color: #ffffff;
}

.curriculum-filter-button.quality-orange.is-active-quality {
  background: #c2410c;
  color: #ffffff;
}

.curriculum-filter-button.quality-red.is-active-quality {
  background: #b91c1c;
  color: #ffffff;
}

.curriculum-filter-button.quality-green::before,
.curriculum-filter-button.quality-orange::before,
.curriculum-filter-button.quality-red::before {
  display: inline-block;
  width: 0.5rem;
  height: 0.5rem;
  margin-right: 0.35rem;
  border-radius: 999px;
  content: "";
}

.curriculum-filter-button.quality-green::before {
  background: #047857;
}

.curriculum-filter-button.quality-orange::before {
  background: #c2410c;
}

.curriculum-filter-button.quality-red::before {
  background: #b91c1c;
}

.curriculum-filter-button.is-active-quality::before {
  background: #ffffff;
}

.curriculum-select {
  width: 100%;
  min-height: 2.75rem;
  padding: 0.65rem 0.8rem;
  border: 1px solid #b8c4d3;
  border-radius: 0.65rem;
  background: #ffffff;
  color: #152033;
}

.curriculum-select:focus-visible {
  border-color: #057dbd;
  outline: 3px solid rgb(3 137 211 / 20%);
  outline-offset: 2px;
}

.curriculum-select:disabled {
  cursor: not-allowed;
  opacity: 0.65;
}

.curriculum-empty {
  margin: 0;
  color: #526077;
  font-size: 0.85rem;
  line-height: 1.4;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.id-input {
  width: 100%;
  min-height: 2.75rem;
  padding: 0.65rem 0.8rem;
  border: 1px solid #b8c4d3;
  border-radius: 0.75rem;
  background: #ffffff;
  color: #152033;
}

.id-input:focus-visible {
  border-color: #057dbd;
  outline: 3px solid rgb(3 137 211 / 20%);
  outline-offset: 2px;
}

#root {
  width: 100%;
  color: #152033;
}

.start-shell {
  display: grid;
  gap: 1rem;
  width: min(100%, 680px);
  margin: 0 auto;
  padding: 1rem;
  border: 1px solid #d7dee8;
  border-radius: 1rem;
  background: #ffffff;
  box-shadow: 0 0.25rem 1rem rgb(15 23 42 / 8%);
}

.start-header {
  display: grid;
  gap: 0.35rem;
}

.eyebrow,
.body-copy,
.hint {
  margin: 0;
  color: #526077;
}

.eyebrow {
  font-size: 0.8rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

h1,
p,
dt,
dd,
label {
  overflow-wrap: anywhere;
}

h1 {
  margin: 0;
  font-size: clamp(1.1rem, 4vw, 1.4rem);
  line-height: 1.25;
}

.body-copy,
.hint,
.eligibility {
  font-size: 0.9rem;
  line-height: 1.5;
}

.profile-summary {
  display: grid;
  gap: 0.55rem;
  margin: 0;
  padding: 0.8rem;
  border-radius: 0.75rem;
  background: #f4f8fc;
}

.profile-item {
  display: grid;
  grid-template-columns: minmax(5.5rem, auto) minmax(0, 1fr);
  gap: 0.75rem;
}

.profile-item dt {
  color: #526077;
  font-size: 0.8rem;
  font-weight: 700;
}

.profile-item dd {
  margin: 0;
  font-size: 0.9rem;
  font-weight: 650;
}

.language-fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.language-fieldset legend {
  margin-bottom: 0.45rem;
}

.language-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.55rem;
}

.language-option {
  display: flex;
  min-height: 2.75rem;
  align-items: center;
  gap: 0.5rem;
  padding: 0.65rem 0.8rem;
  border: 1px solid #b8c4d3;
  border-radius: 0.75rem;
  cursor: pointer;
  font-weight: 650;
}

.language-option:focus-within {
  border-color: #057dbd;
  outline: 3px solid rgb(3 137 211 / 20%);
  outline-offset: 2px;
}

.language-option input,
.eligibility input {
  width: 1rem;
  height: 1rem;
  flex: 0 0 auto;
  accent-color: #0789d1;
}

.eligibility {
  display: flex;
  align-items: flex-start;
  gap: 0.7rem;
  padding: 0.85rem;
  border: 1px solid #c7d5e4;
  border-radius: 0.8rem;
  background: #f8fbff;
  cursor: pointer;
}

.eligibility input {
  margin-top: 0.2rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
}

.button {
  min-height: 2.75rem;
  padding: 0.65rem 1rem;
  border: 1px solid #9aa9bc;
  border-radius: 999px;
  background: #ffffff;
  color: #142033;
  cursor: pointer;
}

.button:hover:not(:disabled),
.button:focus-visible {
  border-color: #057dbd;
  outline: 3px solid rgb(3 137 211 / 20%);
  outline-offset: 2px;
}

.button-primary {
  border-color: #0789d1;
  background: #0789d1;
  color: #ffffff;
  font-weight: 700;
}

.button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.status-error {
  border-color: #e5a1a6;
  background: #fff8f8;
}

.status-warning {
  border-color: #e5ca8f;
  background: #fffaf0;
}

.status-success {
  border-color: #8fd1ae;
  background: #f3fbf7;
}

.status-warning-copy {
  padding: 0.75rem;
  border: 1px solid #e5ca8f;
  border-radius: 0.75rem;
  background: #fffaf0;
}

@media (prefers-color-scheme: dark) {
  #root {
    color: #edf3fb;
  }

  .start-shell {
    border-color: #445168;
    background: #111827;
    box-shadow: none;
  }

  .eyebrow,
  .body-copy,
  .hint,
  .profile-item dt {
    color: #b9c5d5;
  }

  .profile-summary,
  .eligibility {
    border-color: #48566d;
    background: #182235;
  }

  .language-option,
  .identity-option,
  .setup-option,
  .setup-step,
  .curriculum-select,
  .button,
  .id-input {
    border-color: #64748b;
    background: #172033;
    color: #edf3fb;
  }

  .identity-option-body,
  .setup-option-description,
  .setup-stage,
  .setup-step-summary,
  .personalization-history-title,
  .personalization-history-selection,
  .curriculum-filter-label,
  .curriculum-empty {
    color: #b9c5d5;
  }

  .curriculum-category-tabs,
  .curriculum-quality-buttons {
    border-color: #48566d;
    background: #182235;
  }

  .curriculum-filter-button {
    color: #dbe5f1;
  }

  .setup-step-content {
    border-color: #344056;
  }

  .personalization-history-row {
    background: #182235;
  }

  .setup-step-toggle,
  .setup-history-change {
    color: #7dd3fc;
  }

  .setup-step-status {
    color: #6ee7b7;
  }

  .created-id-group {
    border-color: #8a682d;
    background: #111827;
  }

  .created-id-value {
    border-color: #64748b;
    background: #172033;
    color: #edf3fb;
  }

  .button-primary {
    border-color: #1296dc;
    background: #0789d1;
    color: #ffffff;
  }

  .status-error {
    border-color: #8d3c45;
    background: #29181c;
  }

  .status-warning {
    border-color: #8a682d;
    background: #292114;
  }

  .status-warning-copy {
    border-color: #8a682d;
    background: #292114;
  }

  .status-success {
    border-color: #2c7952;
    background: #13261d;
  }
}

@media (max-width: 480px) {
  .start-shell {
    padding: 0.85rem;
  }

  .language-options,
  .profile-item {
    grid-template-columns: 1fr;
  }

  .curriculum-category-tabs,
  .curriculum-quality-buttons {
    grid-template-columns: 1fr;
  }

  .setup-step-header {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .setup-step-toggle {
    grid-column: 2;
    justify-self: start;
  }

  .setup-step-content {
    padding-left: 0.85rem;
  }

  .actions,
  .button {
    width: 100%;
  }
}
