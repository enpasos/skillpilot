[hidden] {

.goal-card {

  width: min(100%, 680px);
  margin: 0 auto;
  border: 1px solid var(--color-border-secondary, #d8e0eb);
  border-radius: var(--border-radius-xl, 18px);

}

.goal-content {

}

.eyebrow {

  color: var(--color-text-info, #1769aa);
  font-size: var(--font-text-xs-size, 0.78rem);
  font-weight: var(--font-weight-bold, 750);
  letter-spacing: 0.07em;

.goal-title {

  color: var(--color-text-primary, #17233f);

.goal-description {

  color: var(--color-text-secondary, #526076);

  font-weight: var(--font-weight-semibold, 700);
  text-underline-offset: 3px;
}

.cockpit-link:hover {
  text-decoration-thickness: 2px;
}

.cockpit-link:focus-visible {
  outline: 3px solid var(--color-ring-info, rgba(13, 103, 173, 0.28));
  outline-offset: 3px;
}

@media (prefers-color-scheme: dark) {
  .goal-card {
    border-color: var(--color-border-secondary, #33445f);
    background: var(--color-background-primary, #121c2d);
    box-shadow: none;
  }

  .goal-image {
    background: var(--color-background-secondary, #18253a);
  }

  .goal-title {
    color: var(--color-text-primary, #edf4ff);
  }

  .goal-description {
    color: var(--color-text-secondary, #b5c0d3);
  }

  .eyebrow,
  .cockpit-link {
    color: var(--color-text-info, #86c9ff);
  }
}
