databaseChangeLog:
  - changeSet:
      id: 034-add-learner-period-basis
      author: skillpilot
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: learner
        - not:
            - columnExists:
                tableName: learner
                columnName: learning_plan_period_basis
      changes:
        - addColumn:
            tableName: learner
            columns:
              - column:
                  name: learning_plan_period_basis
                  type: VARCHAR(16)
                  defaultValue: "DAY"
                  constraints:
                    nullable: false
