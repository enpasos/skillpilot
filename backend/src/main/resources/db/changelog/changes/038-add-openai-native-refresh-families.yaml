databaseChangeLog:
  - changeSet:
      id: 038-add-openai-native-refresh-families
      author: skillpilot
      changes:
        - createTable:
            tableName: openai_native_refresh_family
            columns:
              - column: { name: authorization_id, type: varchar(100), constraints: { primaryKey: true, nullable: false } }
              - column: { name: registered_client_id, type: varchar(100), constraints: { nullable: false } }
              - column: { name: revoked, type: boolean, constraints: { nullable: false } }
              - column: { name: expires_at, type: timestamp, constraints: { nullable: false } }
        - createTable:
            tableName: openai_native_refresh_history
            columns:
              - column: { name: token_hash, type: varchar(64), constraints: { primaryKey: true, nullable: false } }
              - column: { name: authorization_id, type: varchar(100), constraints: { nullable: false, references: 'openai_native_refresh_family(authorization_id)', foreignKeyName: fk_openai_native_refresh_family } }
              - column: { name: consumed, type: boolean, constraints: { nullable: false } }
        - createIndex:
            tableName: openai_native_refresh_history
            indexName: idx_openai_native_refresh_history_family
            columns:
              - column: { name: authorization_id }
        - createIndex:
            tableName: openai_native_refresh_family
            indexName: idx_openai_native_refresh_family_expiry
            columns:
              - column: { name: expires_at }
