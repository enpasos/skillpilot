databaseChangeLog:
  - changeSet:
      id: 009-add-openai-de-connections
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: openai_de_connection
      changes:
        - createTable:
            tableName: openai_de_connection
            columns:
              - column:
                  name: subject
                  type: VARCHAR(96)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: learner_skillpilot_id
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_authorized_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_used_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: openai_de_connection
            baseColumnNames: learner_skillpilot_id
            constraintName: fk_openai_de_connection_learner
            referencedTableName: learner
            referencedColumnNames: skillpilot_id
            onDelete: CASCADE
        - createIndex:
            tableName: openai_de_connection
            indexName: idx_openai_de_connection_learner
            columns:
              - column:
                  name: learner_skillpilot_id

  - changeSet:
      id: 009-add-openai-de-binding-grants
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: openai_de_binding_grant
      changes:
        - createTable:
            tableName: openai_de_binding_grant
            columns:
              - column:
                  name: token_hash
                  type: VARCHAR(128)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: learner_skillpilot_id
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: connection_subject
                  type: VARCHAR(96)
              - column:
                  name: client
                  type: VARCHAR(64)
        - addForeignKeyConstraint:
            baseTableName: openai_de_binding_grant
            baseColumnNames: learner_skillpilot_id
            constraintName: fk_openai_de_binding_grant_learner
            referencedTableName: learner
            referencedColumnNames: skillpilot_id
            onDelete: CASCADE
        - createIndex:
            tableName: openai_de_binding_grant
            indexName: idx_openai_de_binding_grant_expires
            columns:
              - column:
                  name: expires_at

  - changeSet:
      id: 009-add-openai-de-pending-launches
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: openai_de_pending_launch
      changes:
        - createTable:
            tableName: openai_de_pending_launch
            columns:
              - column:
                  name: id
                  type: VARCHAR(48)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: learner_skillpilot_id
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: connection_subject
                  type: VARCHAR(96)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: selected_curriculum
                  type: VARCHAR(255)
              - column:
                  name: client
                  type: VARCHAR(64)
        - addForeignKeyConstraint:
            baseTableName: openai_de_pending_launch
            baseColumnNames: learner_skillpilot_id
            constraintName: fk_openai_de_pending_launch_learner
            referencedTableName: learner
            referencedColumnNames: skillpilot_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: openai_de_pending_launch
            baseColumnNames: connection_subject
            constraintName: fk_openai_de_pending_launch_connection
            referencedTableName: openai_de_connection
            referencedColumnNames: subject
            onDelete: CASCADE
        - createIndex:
            tableName: openai_de_pending_launch
            indexName: idx_openai_de_pending_launch_connection
            columns:
              - column:
                  name: connection_subject
              - column:
                  name: created_at
        - createIndex:
            tableName: openai_de_pending_launch
            indexName: idx_openai_de_pending_launch_expires
            columns:
              - column:
                  name: expires_at
