databaseChangeLog:
  - changeSet:
      id: 022-add-learner-retention
      author: skillpilot
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: learner
        - not:
            - columnExists:
                tableName: learner
                columnName: last_activity_at
      changes:
        - addColumn:
            tableName: learner
            columns:
              - column:
                  name: last_activity_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: learner
            indexName: idx_learner_last_activity
            columns:
              - column:
                  name: last_activity_at
              - column:
                  name: skillpilot_id
        - createIndex:
            tableName: learner_copy_sources
            indexName: idx_learner_copy_sources_source
            columns:
              - column:
                  name: source_id
        - sql:
            sql: >-
              DELETE FROM learner_copy_sources
              WHERE source_id NOT IN (SELECT skillpilot_id FROM learner)
        - addForeignKeyConstraint:
            baseTableName: learner_copy_sources
            baseColumnNames: source_id
            referencedTableName: learner
            referencedColumnNames: skillpilot_id
            constraintName: fk_learner_copy_sources_source
            onDelete: CASCADE
