databaseChangeLog:
  - changeSet:
      id: 008-add-claude-connections
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: claude_connection
      changes:
        - createTable:
            tableName: claude_connection
            columns:
              - column:
                  name: subject
                  type: VARCHAR(96)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: learner_skillpilot_id
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_authorized_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_used_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: claude_connection
            baseColumnNames: learner_skillpilot_id
            constraintName: fk_claude_connection_learner
            referencedTableName: learner
            referencedColumnNames: skillpilot_id
            onDelete: CASCADE
        - createIndex:
            tableName: claude_connection
            indexName: idx_claude_connection_learner
            columns:
              - column:
                  name: learner_skillpilot_id

  - changeSet:
      id: 008-add-claude-binding-grants
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: claude_binding_grant
      changes:
        - createTable:
            tableName: claude_binding_grant
            columns:
              - column:
                  name: token_hash
                  type: VARCHAR(128)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: learner_skillpilot_id
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: connection_subject
                  type: VARCHAR(96)
              - column:
                  name: language
                  type: VARCHAR(16)
              - column:
                  name: client
                  type: VARCHAR(64)
        - addForeignKeyConstraint:
            baseTableName: claude_binding_grant
            baseColumnNames: learner_skillpilot_id
            constraintName: fk_claude_binding_grant_learner
            referencedTableName: learner
            referencedColumnNames: skillpilot_id
            onDelete: CASCADE
        - createIndex:
            tableName: claude_binding_grant
            indexName: idx_claude_binding_grant_expires
            columns:
              - column:
                  name: expires_at

  - changeSet:
      id: 008-add-claude-pending-launches
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: claude_pending_launch
      changes:
        - createTable:
            tableName: claude_pending_launch
            columns:
              - column:
                  name: id
                  type: VARCHAR(48)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: learner_skillpilot_id
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: language
                  type: VARCHAR(16)
              - column:
                  name: selected_curriculum
                  type: VARCHAR(255)
              - column:
                  name: client
                  type: VARCHAR(64)
        - addForeignKeyConstraint:
            baseTableName: claude_pending_launch
            baseColumnNames: learner_skillpilot_id
            constraintName: fk_claude_pending_launch_learner
            referencedTableName: learner
            referencedColumnNames: skillpilot_id
            onDelete: CASCADE
        - createIndex:
            tableName: claude_pending_launch
            indexName: idx_claude_pending_launch_learner
            columns:
              - column:
                  name: learner_skillpilot_id
              - column:
                  name: created_at
        - createIndex:
            tableName: claude_pending_launch
            indexName: idx_claude_pending_launch_expires
            columns:
              - column:
                  name: expires_at

  - changeSet:
      id: 008-add-claude-oauth-registered-client
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: oauth2_registered_client
      changes:
        - createTable:
            tableName: oauth2_registered_client
            columns:
              - column: { name: id, type: VARCHAR(100), constraints: { primaryKey: true, nullable: false } }
              - column: { name: client_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: client_id_issued_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: client_secret, type: VARCHAR(200) }
              - column: { name: client_secret_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: client_name, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: client_authentication_methods, type: VARCHAR(1000), constraints: { nullable: false } }
              - column: { name: authorization_grant_types, type: VARCHAR(1000), constraints: { nullable: false } }
              - column: { name: redirect_uris, type: VARCHAR(1000) }
              - column: { name: post_logout_redirect_uris, type: VARCHAR(1000) }
              - column: { name: scopes, type: VARCHAR(1000), constraints: { nullable: false } }
              - column: { name: client_settings, type: VARCHAR(2000), constraints: { nullable: false } }
              - column: { name: token_settings, type: VARCHAR(2000), constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: oauth2_registered_client
            columnNames: client_id
            constraintName: uq_oauth2_registered_client_client_id

  - changeSet:
      id: 008-bind-claude-pending-launches-to-connections
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: claude_pending_launch
        - not:
            - columnExists:
                tableName: claude_pending_launch
                columnName: connection_subject
      changes:
        - addColumn:
            tableName: claude_pending_launch
            columns:
              - column:
                  name: connection_subject
                  type: VARCHAR(96)
        - addForeignKeyConstraint:
            baseTableName: claude_pending_launch
            baseColumnNames: connection_subject
            constraintName: fk_claude_pending_launch_connection
            referencedTableName: claude_connection
            referencedColumnNames: subject
            onDelete: CASCADE
        - createIndex:
            tableName: claude_pending_launch
            indexName: idx_claude_pending_launch_connection
            columns:
              - column:
                  name: connection_subject
              - column:
                  name: created_at

  - changeSet:
      id: 008-add-claude-oauth-authorization
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: oauth2_authorization
      changes:
        - createTable:
            tableName: oauth2_authorization
            columns:
              - column: { name: id, type: VARCHAR(100), constraints: { primaryKey: true, nullable: false } }
              - column: { name: registered_client_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: principal_name, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: authorization_grant_type, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: authorized_scopes, type: VARCHAR(1000) }
              - column: { name: attributes, type: TEXT }
              - column: { name: state, type: VARCHAR(500) }
              - column: { name: authorization_code_value, type: TEXT }
              - column: { name: authorization_code_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: authorization_code_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: authorization_code_metadata, type: TEXT }
              # SkillPilot issues reference (opaque) tokens, so these values are
              # bounded strings and can be indexed portably on PostgreSQL/H2.
              - column: { name: access_token_value, type: VARCHAR(2000) }
              - column: { name: access_token_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: access_token_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: access_token_metadata, type: TEXT }
              - column: { name: access_token_type, type: VARCHAR(100) }
              - column: { name: access_token_scopes, type: VARCHAR(1000) }
              - column: { name: oidc_id_token_value, type: TEXT }
              - column: { name: oidc_id_token_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: oidc_id_token_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: oidc_id_token_metadata, type: TEXT }
              - column: { name: refresh_token_value, type: VARCHAR(2000) }
              - column: { name: refresh_token_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: refresh_token_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: refresh_token_metadata, type: TEXT }
              - column: { name: user_code_value, type: TEXT }
              - column: { name: user_code_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: user_code_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: user_code_metadata, type: TEXT }
              - column: { name: device_code_value, type: TEXT }
              - column: { name: device_code_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: device_code_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: device_code_metadata, type: TEXT }
        - createIndex:
            tableName: oauth2_authorization
            indexName: idx_oauth2_authorization_access_token
            columns:
              - column:
                  name: access_token_value
        - createIndex:
            tableName: oauth2_authorization
            indexName: idx_oauth2_authorization_refresh_token
            columns:
              - column:
                  name: refresh_token_value

  - changeSet:
      id: 008-add-claude-oauth-consent
      author: skillpilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: oauth2_authorization_consent
      changes:
        - createTable:
            tableName: oauth2_authorization_consent
            columns:
              - column: { name: registered_client_id, type: VARCHAR(100), constraints: { primaryKey: true, nullable: false } }
              - column: { name: principal_name, type: VARCHAR(200), constraints: { primaryKey: true, nullable: false } }
              - column: { name: authorities, type: VARCHAR(1000), constraints: { nullable: false } }
