  box-sizing: border-box;
}

:root {
  color-scheme: light dark;
  font-family: var(
    --font-family-sans,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif
  );
}

html,
body {
  margin: 0;
  background: transparent;
}

button {
  font: inherit;
}

#root {
  width: 100%;
  color: var(--color-text-primary, #262624);
}

.practice-shell {
  width: min(100%, 680px);
  margin: 0 auto;
  padding: 1rem;
  border: 1px solid var(--color-border-primary, #d9d7ce);
  border-radius: 1rem;
  background: var(--color-background-primary, #fff);
}

.practice-header {
  display: grid;
  gap: 0.35rem;
  margin-bottom: 1rem;
}

.eyebrow,
.progress-copy,
.card-label,
.card-position,
.status-copy {
  margin: 0;
  color: var(--color-text-secondary, #66645f);
  font-size: 0.875rem;
}

.goal-title,
.status-title,
.card-text {
  overflow-wrap: anywhere;
}

.goal-title {
  margin: 0;
  font-size: clamp(1.1rem, 4vw, 1.35rem);
  line-height: 1.25;
}

.progress-track {
  width: 100%;
  height: 0.4rem;
  overflow: hidden;
  border-radius: 999px;
  background: var(--color-background-secondary, #f5f4ed);
}

.progress-value {
  height: 100%;
  border-radius: inherit;
  background: var(--color-text-info, #2d6da3);
}

.card-stage {
  display: grid;
  min-height: 11rem;
  place-items: center;
  padding: clamp(1.15rem, 5vw, 2rem);
  border: 1px solid var(--color-border-primary, #d9d7ce);
  border-radius: 0.85rem;
  background: var(--color-background-secondary, #f5f4ed);
  text-align: center;
}

.card-side {
  display: grid;
  gap: 0.65rem;
  width: 100%;
}

.card-text {
  font-size: clamp(1rem, 4.2vw, 1.25rem);
  line-height: 1.5;
}

.card-text code {
  padding: 0.1em 0.25em;
  border-radius: 0.25rem;
  background: color-mix(in srgb, currentColor 10%, transparent);
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 0.9em;
}

.math-inline,
.math-display {
  font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
}

.math-inline {
  display: inline-block;
  margin: 0 0.08em;
}

.math-display {
  display: block;
  width: 100%;
  margin: 0.75rem 0;
  overflow-x: auto;
  text-align: center;
}

.card-position {
  margin-top: 0.55rem;
  text-align: center;
}

.navigation-actions,
.primary-actions,
.rating-actions,
.error-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.65rem;
  margin-top: 0.8rem;
}

.primary-actions {
  grid-template-columns: minmax(0, 1fr);
}

.button {
  min-height: 44px;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--color-border-primary, #aaa79d);
  border-radius: 999px;
  background: var(--color-background-primary, #fff);
  color: var(--color-text-primary, #262624);
  cursor: pointer;
}

.button:hover:not(:disabled),
.button:focus-visible {
  border-color: var(--color-border-info, #2d6da3);
  outline: 3px solid color-mix(in srgb, var(--color-text-info, #2d6da3) 22%, transparent);
  outline-offset: 2px;
}

.button:disabled {
  cursor: default;
  opacity: 0.45;
}

.button-primary {
  border-color: var(--color-background-info, #d6e4f6);
  background: var(--color-background-info, #d6e4f6);
  color: var(--color-text-primary, #262624);
  font-weight: 650;
}

.button-subtle {
  background: transparent;
}

.rating-not-known,
.rating-known {
  font-weight: 650;
}

.rating-not-known {
  border-color: var(--color-border-danger, #b84d49);
  background: var(--color-background-danger, #f7ecec);
}

.rating-known {
  border-color: var(--color-border-success, #4e7c44);
  background: var(--color-background-success, #e9f1dc);
}

.rated-status,
.batch-complete {
  margin: 0.8rem 0 0;
  padding: 0.75rem;
  border-radius: 0.7rem;
  text-align: center;
}

.rated-status {
  font-size: 0.9rem;
}

.rated-known {
  background: var(--color-background-success, #e9f1dc);
}

.rated-not-known {
  background: var(--color-background-danger, #f7ecec);
}

.batch-complete,
.status-panel {
  background: var(--color-background-tertiary, #faf9f5);
}

.batch-complete .button {
  width: 100%;
  margin-top: 0.75rem;
}

.status-panel {
  display: grid;
  gap: 0.55rem;
  padding: 1rem;
  border-radius: 0.8rem;
}

.status-title {
  margin: 0;
  font-size: 1.05rem;
}

@media (max-width: 420px) {
  .practice-shell {
    padding: 0.75rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
