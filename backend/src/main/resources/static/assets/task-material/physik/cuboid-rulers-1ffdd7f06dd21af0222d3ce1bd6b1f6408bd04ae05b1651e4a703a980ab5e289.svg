<text x="50" y="56" font-size="29" font-weight="bold">Derselbe starre Quader / The same rigid cuboid</text>
<text x="50" y="94" font-size="20">Lies die Skalen. Welche unabhängigen Abmessungen brauchst du?</text>
<text x="50" y="122" font-size="20">Read the scales. Which independent dimensions do you need?</text>
<text x="50" y="164" font-size="17">Alle Lineale: cm, kleine Teilstriche: mm / All rulers: cm, small ticks: mm</text>
<text x="50" y="190" font-size="17">Nicht am Bildschirm abmessen / Do not measure the screen</text>
