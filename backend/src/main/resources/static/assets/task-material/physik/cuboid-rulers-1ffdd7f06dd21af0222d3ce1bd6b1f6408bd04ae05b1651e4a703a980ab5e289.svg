<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Quader an Linealen – Messaufgabe / Cuboid with rulers – measurement task</title>
<desc id="desc">Zwei orthografische Ansichten desselben starren Quaders. Die Lineale zeigen Zentimeter mit Millimeterteilungen. Kantenlängen aus den Skalen ermitteln; nicht am Bildschirm abmessen. Two orthographic views of the same rigid cuboid. Read the centimeter rulers with millimeter subdivisions; do not measure the screen.</desc>
