name: Gemini integration local checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ai/gemini/gateway/**'
      - 'ai/gemini/coach/**'
      - 'backend/**'
      - 'app/**'
      - 'LICENSE'
      - 'docs/deploy/gemini-integration.md'
      - '.github/workflows/gemini-integration.yml'
      - '.github/actions/ubuntu-apt/**'
      - '.java-version'
      - '.corretto-version'
  push:
    branches: [main]
    paths:
      - 'ai/gemini/gateway/**'
      - 'ai/gemini/coach/**'
      - 'backend/**'
      - 'app/**'
      - 'LICENSE'
      - 'docs/deploy/gemini-integration.md'
      - '.github/workflows/gemini-integration.yml'
      - '.github/actions/ubuntu-apt/**'
      - '.java-version'
      - '.corretto-version'

permissions:
  contents: read

concurrency:
  group: gemini-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway OAuth and signed bridge — local only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai/gemini/gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: ai/gemini/gateway/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Check every gateway module parses
        run: |
          for module in server/*.mjs; do node --check "$module"; done
      - run: npm test

  backend:
    name: Gemini canonical learning and provider isolation — local only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version-file: .java-version
      - name: Use the repository's exact Corretto build
        run: |
          set -euo pipefail
          corretto_version="$(tr -d '[:space:]' < .corretto-version)"
          install_dir="${RUNNER_TEMP}/amazon-corretto-${corretto_version}"
          archive="${RUNNER_TEMP}/amazon-corretto-${corretto_version}-linux-x64.tar.gz"
          curl -fsSL "https://corretto.aws/downloads/resources/${corretto_version}/amazon-corretto-${corretto_version}-linux-x64.tar.gz" -o "${archive}"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_dir}"
          echo "JAVA_HOME=${install_dir}" >> "${GITHUB_ENV}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/java" -version
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the entire Gemini backend test namespace
        working-directory: backend
        run: ./gradlew test --console=plain --tests 'com.skillpilot.backend.connectors.gemini.v1.*Test'
      - name: Require every Gemini test class to execute without skips
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          source_root = Path('backend/src/test/java/com/skillpilot/backend/connectors/gemini/v1')
          expected = set()
          for source in source_root.rglob('*Test.java'):
              package = re.search(r'^package\s+([\w.]+);', source.read_text(), re.MULTILINE)
              if not package:
                  raise SystemExit(f'Missing package: {source}')
              expected.add(f'{package.group(1)}.{source.stem}')
          if not expected:
              raise SystemExit('No Gemini backend test classes found')
          reports = Path('backend/build/test-results/test')
          for name in sorted(expected):
              report = reports / f'TEST-{name}.xml'
              if not report.is_file():
                  raise SystemExit(f'Missing Gemini test report: {name}')
              suite = ET.parse(report).getroot()
              if int(suite.get('tests', 0)) == 0 or any(int(suite.get(key, 0)) for key in ['failures', 'errors', 'skipped']):
                  raise SystemExit(f'Gemini test did not pass completely: {name}')
          print(f'{len(expected)} Gemini backend test classes executed without skips')
          PY
      - name: Preserve historical provider artifacts
        run: node scripts/check_openai_plugin_review_freeze.mjs

  frontend-and-skill:
    name: Ordinary Gemini start and reproducible import package — local only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: app
      - uses: ./.github/actions/ubuntu-apt
      - name: Install pinned Chromium for the ordinary learning entry
        timeout-minutes: 15
        working-directory: app
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify import archive source, license, reproducibility and frontend copy
        run: python3 ai/gemini/coach/scripts/test_package.py
      - name: Test Gemini session validation and the real browser handoff
        working-directory: app
        run: npm run test:gemini-v1-start
      - name: Preserve the existing Claude handoff
        working-directory: app
        run: npm run test:claude-v1-start
      - name: Compile and build the frontend with the Gemini download
        working-directory: app
        run: |
          npx --no-install tsc -b
          npx --no-install vite build
      - name: Require the built download to match the import archive exactly
        run: cmp ai/gemini/coach/dist/skillpilot-coach-v1-0.1.0.zip backend/src/main/resources/static/plugins/gemini/skillpilot-coach-v1-0.1.0.zip
