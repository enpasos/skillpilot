name: Isolated Typst PDF quality trial
on:
  push:
    branches: [test/typst-pdf-quality-20260919]
    paths: [.github/workflows/typst-pdf-quality-preview.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch and verify official Pandoc release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 \
            https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz \
            --output pandoc.tar.gz
          echo '37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  pandoc.tar.gz' | sha256sum --check
          mkdir toolchain
          tar -xzf pandoc.tar.gz --strip-components=2 -C toolchain pandoc-3.11/bin/pandoc
          toolchain/pandoc --version
      - name: Make converter available to the isolated review environment
        uses: actions/upload-artifact@v4
        with:
          name: pandoc-3.11-quality-trial-toolchain
          path: toolchain/pandoc
          retention-days: 1
          if-no-files-found: error
