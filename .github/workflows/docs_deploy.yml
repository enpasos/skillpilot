name: Deploy Docs
on:
  push:
    branches:
      - main
permissions:
  contents: write
concurrency:
  group: docs-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements-docs.txt
      - name: Deploy MkDocs site
        run: |
          for attempt in 1 2 3; do
            if mkdocs gh-deploy --force --no-history; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done

          exit 1
