name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!README.md'
      - '!AGENTS.md'
      - '!docs/**'
      - 'docs/qa-ci/status/**'
      - '!sandbox/**'
      - '!tmp/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!README.md'
      - '!AGENTS.md'
      - '!docs/**'
      - 'docs/qa-ci/status/**'
      - '!sandbox/**'
      - '!tmp/**'
     
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-regression-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 'ai/openai custom gpt/action-regression/package-lock.json'
      - name: Install dependencies
        run: npm --prefix "ai/openai custom gpt/action-regression" ci
      - name: Test Spring-hosted Custom GPT Action control client
        run: npm --prefix "ai/openai custom gpt/action-regression" test

  frontend-ci:
    name: Application frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test deterministic ZIP32 writer
        run: npm run test:deterministic-zip32
      - name: Test package landscape model parity
        run: npm run test:package-landscape-model
      - name: Test runtime curriculum catalog consumer
        run: npm run test:runtime-curriculum-catalog
      - name: Test root route policy
        run: npm run test:root-route-policy
      - name: Test curriculum offering sources
        run: npm run test:curriculum-offering-source
      - name: Test package goal source evidence consumer
        run: npm run test:package-goal-source-evidence
      - name: Test learner goal selection
        run: npm run validate:learner-goal-selection
      - name: Check GPT system instruction lengths
        run: npm run check:gpt-system-instruction-lengths
      - name: Lint
        run: npm run lint
      - name: Build application without regenerating curriculum assets
        run: npm run build:application

  graph-validation:
    name: Curriculum CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Graph
        run: npm run validate:graph
      - name: Validate View Filters
        run: npm run validate:view-filters
      - name: Check Source Landscape Registry
        run: npm run check:source-landscape-registry
      - name: Check Hessen Math G8/G9 Projection
        run: npm run check:he-math-duration-projection
      - name: Check generated Math G8/G9 Composition Views
        run: npm run check:math-duration-composition-views
      - name: Check generated German Sek-I Composition Views
        run: npm run check:german-seki-composition-views
      - name: Check generated History Sek-I Composition Views
        run: npm run check:history-seki-composition-views
      - name: Check Canonical Math Scope Coverage
        run: npm run check:canonical-math-scope-coverage
      - name: Check Gymnasium G8/G9 Duration Readiness Report
        run: npm run check:gymnasium-duration-readiness
      - name: Check Mathematics G8/G9 Duration Policy Readiness
        run: npm run check:math-duration-policy-readiness
      - name: Check M6 G8/G9 Duration Policy Readiness
        run: npm run check:m6-duration-policy-readiness
      - name: Check Gymnasium Duration Offerings
        run: npm run check:gymnasium-duration-offerings
      - name: Check Curriculum Source Coverage
        run: npm run quality:source-coverage-audit:check
      - name: Check Goal Source Rationale Runtime Index
        run: npm run check:goal-source-rationales:math-public
      - name: Check Goal Source Rationale All-Relevant Report
        run: npm run check:goal-source-rationales:math-all-relevant
      - name: Check Goal Source Rationale Coverage Report
        run: npm run check:goal-source-rationale-coverage
      - name: Check Goal Source Rationale Gap Issues
        run: npm run check:goal-source-rationale-gap-issues
      - name: Check Goal Source Rationale Mapping Batch 01
        run: npm run check:goal-source-rationale-mapping-batch-01
      - name: Check Generated Documentation Notices
        run: npm run check:generated-doc-notices
      - name: Check Generated Status Registry
        run: npm run check:generated-status-registry
      - name: Check Documentation Links
        run: npm run check:docs-links
      - name: Check Documentation Index Coverage
        run: npm run check:docs-indexes
      - name: Validate Composition Views
        run: npm run validate:composition-views
      - name: Check Memory-Card Reviews
        run: npm run quality:memory-card-review:check:all
      - name: Prepare generated curriculum runtime assets
        run: npm run prepare:runtime-assets
      - name: Check goal visualization runtime assets
        run: npm run check:goal-visualization-assets
      - name: Test full standalone curriculum package builder
        run: npm run test:full-standalone-package-builder
      - name: Build integrated application artifact
        run: npm run build:application
      - name: Build package-only consumer frontend
        run: npm run build:package-consumer -- --out-dir ../tmp/package-consumer-ci/frontend
      - name: Check Goal Source Rationale Build Artifact
        run: npm run check:goal-source-rationales:build-artifact
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Set up Java for package-consumer smoke
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version-file: .java-version
          cache: gradle
      - name: Use exact production Corretto build
        run: |
          set -euo pipefail
          corretto_version="$(tr -d '[:space:]' < ../.corretto-version)"
          install_dir="${RUNNER_TEMP}/amazon-corretto-${corretto_version}"
          archive="${RUNNER_TEMP}/amazon-corretto-${corretto_version}-linux-x64.tar.gz"
          curl -fsSL "https://corretto.aws/downloads/resources/${corretto_version}/amazon-corretto-${corretto_version}-linux-x64.tar.gz" -o "${archive}"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_dir}"
          echo "JAVA_HOME=${install_dir}" >> "${GITHUB_ENV}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/java" -version
      - name: Install package-consumer isolation tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap strace
      - name: Enable and verify bubblewrap isolation
        run: bash ../scripts/configure_github_bubblewrap.sh
      - name: Install Python dependencies
        run: python -m pip install -r ../scripts/curriculum_package_validation_requirements.txt
      - name: Verify curriculum JSON conformance scripts
        run: |
          cd ..
          bash -n \
            scripts/provision_pinned_fwu_ontology.sh \
            scripts/run_curriculum_release_model_conformance.sh
      - name: Validate Curriculum Package Contracts
        env:
          SKILLPILOT_SOURCE_PDF_MODE: committed-bindings
        run: |
          cd ..
          python -B scripts/validate_curriculum_package_contracts.py
          python -B scripts/validate_curriculum_runtime_catalog_contract.py
          python -B scripts/validate_curriculum_schema_catalog_contract.py
          python -B scripts/evaluate_curriculum_package_readiness.py --self-test
          python -B scripts/validate_full_standalone_curriculum_package.py --self-test
          python -B scripts/provision_curriculum_package.py self-test
          python -B scripts/run_package_consumer_smoke.py --self-test
          SKILLPILOT_FULL_PACKAGE_CONFORMANCE=false \
            bash scripts/run_curriculum_release_model_conformance.sh
      - name: Validate Schemas
        run: cd .. && python scripts/validate_schemas.py
      - name: Validate Curriculum Goal IDs (UUIDs)
        run: cd .. && python scripts/validate_goal_ids_uuid.py
      - name: Validate Hessen Upper-Secondary Archive Paths
        run: cd .. && python scripts/validate_hessen_upper_secondary_archive_paths.py
      - name: Validate Hessen Upper-Secondary Legacy References
        run: cd .. && python scripts/validate_hessen_upper_secondary_legacy_refs.py
      - name: Validate Hessen Chemistry Exam Pipeline
        run: cd .. && python scripts/validate_chemistry_exam_pipeline.py
      - name: Validate Hessen Lower-Secondary Archive Paths
        run: cd .. && python scripts/validate_hessen_lower_secondary_archive_paths.py
      - name: Validate Hessen Lower-Secondary Legacy References
        run: cd .. && python scripts/validate_hessen_lower_secondary_legacy_refs.py
      - name: Validate Bavaria Gymnasium Archive Paths
        run: cd .. && python scripts/validate_bavaria_gymnasium_archive_paths.py
      - name: Validate Bavaria Gymnasium Legacy References
        run: cd .. && python scripts/validate_bavaria_gymnasium_legacy_refs.py

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version-file: .java-version
          cache: gradle
      - name: Use production Corretto build
        run: |
          set -euo pipefail
          corretto_version="$(tr -d '[:space:]' < ../.corretto-version)"
          install_dir="${RUNNER_TEMP}/amazon-corretto-${corretto_version}"
          archive="${RUNNER_TEMP}/amazon-corretto-${corretto_version}-linux-x64.tar.gz"
          curl -fsSL "https://corretto.aws/downloads/resources/${corretto_version}/amazon-corretto-${corretto_version}-linux-x64.tar.gz" -o "${archive}"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_dir}"
          echo "JAVA_HOME=${install_dir}" >> "${GITHUB_ENV}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/java" -version
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Run backend tests
        run: ./gradlew check
