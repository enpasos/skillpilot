name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md' 
      - 'AGENTS.md' 
      - 'docs/**' 
      - 'sandbox/**' 
      - 'tmp/**'  
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md' 
      - 'docs/**' 
      - 'sandbox/**' 
      - 'tmp/**'   
     
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  graph-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Graph
        run: npm run validate:graph
      - name: Validate View Filters
        run: npm run validate:view-filters
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: pip install jsonschema
      - name: Validate Schemas
        run: cd .. && python scripts/validate_schemas.py
      - name: Validate Curriculum Goal IDs (UUIDs)
        run: cd .. && python scripts/validate_goal_ids_uuid.py

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Run backend tests
        run: ./gradlew check
