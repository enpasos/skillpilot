      - 'scripts/validate_curriculum_fwu_owl_package_contracts.py'
      - 'scripts/validate_fwu_owl_curriculum_package.py'
      - 'scripts/validate_curriculum_fwu_owl_reverse_compilation_contract.py'
      - 'scripts/reconstruct_json_curriculum_package_from_fwu_owl.py'
      - 'scripts/fwu_owl_reverse_compiler_sandbox_entry.py'
      - 'scripts/run_fwu_owl_reverse_compiler_hermetic.py'
      - 'scripts/check_curriculum_fwu_owl_validation_tools.py'
      - 'scripts/curriculum_fwu_owl_validation_requirements.txt'
      - 'scripts/provision_pinned_robot.sh'
      - 'scripts/validate_curriculum_runtime_catalog_contract.py'
      - 'scripts/validate_curriculum_schema_catalog_contract.py'
      - 'scripts/evaluate_curriculum_package_readiness.py'
      - 'scripts/validate_full_standalone_curriculum_package.py'
      - 'scripts/provision_curriculum_package.py'
      - 'scripts/test_curriculum_package_provisioner.py'
      - 'scripts/run_package_consumer_smoke.py'
      - 'scripts/generate_curriculum_package_redistribution_review.py'
      - 'scripts/generate_curriculum_source_verification_review.py'
      - 'scripts/validate_curriculum_dual_release_contracts.py'
      - 'scripts/compile_curriculum_release_model.py'
      - 'scripts/validate_curriculum_release_model.py'
      - 'scripts/validate_curriculum_release_model_fixtures.py'
      - 'scripts/run_curriculum_release_model_conformance.sh'
      - 'scripts/run_curriculum_fwu_owl_package_conformance.sh'
      - 'scripts/run_curriculum_fwu_owl_reverse_conformance.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  subject-export-release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install package-consumer isolation tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap strace

      - name: Install pinned package-consumer browser
        run: npx playwright install --with-deps chromium

      - name: Test deterministic ZIP32 writer
        run: npm run test:deterministic-zip32

      - name: Test full standalone curriculum package builder
        run: npm run test:full-standalone-package-builder

      - name: Typecheck Core-first FWU-OWL package builder
        run: npm run typecheck:fwu-owl-package-builder

      - name: Test Core-first FWU-OWL package builder
        run: npm run test:fwu-owl-package-builder

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Use Java for FWU-OWL validation
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version-file: .java-version

      - name: Install Python dependencies
        run: python -m pip install -r ../scripts/curriculum_fwu_owl_validation_requirements.txt

      - name: Verify pinned FWU-OWL validation tools
        run: |
          cd ..
          bash -n \
            scripts/provision_pinned_robot.sh \
            scripts/run_curriculum_release_model_conformance.sh \
            scripts/run_curriculum_fwu_owl_package_conformance.sh \
            scripts/run_curriculum_fwu_owl_reverse_conformance.sh
          bash scripts/provision_pinned_robot.sh
          python -B scripts/check_curriculum_fwu_owl_validation_tools.py \
            --report tmp/curriculum-release-model/fwu-owl-validation/tools-report.json

      - name: Validate curriculum package contracts
        run: |
          cd ..
          python -B scripts/validate_curriculum_package_contracts.py
          python -B scripts/validate_curriculum_fwu_owl_package_contracts.py
          python -B scripts/validate_fwu_owl_curriculum_package.py --self-test
          python -B scripts/validate_curriculum_fwu_owl_reverse_compilation_contract.py --self-test
          python -B scripts/reconstruct_json_curriculum_package_from_fwu_owl.py --self-test
          python -B scripts/run_fwu_owl_reverse_compiler_hermetic.py --self-test
          python -B scripts/validate_curriculum_runtime_catalog_contract.py
          python -B scripts/validate_curriculum_schema_catalog_contract.py
          python -B scripts/evaluate_curriculum_package_readiness.py --self-test
          python -B scripts/validate_full_standalone_curriculum_package.py --self-test
          python -B scripts/provision_curriculum_package.py self-test
          python -B scripts/validate_curriculum_dual_release_contracts.py
          bash scripts/run_curriculum_release_model_conformance.sh

      - name: Run subject export release gate
        env:
          AUDIT_SOURCE_LINKS: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_source_links == true && 'true' || 'false' }}
          STRICT_SOURCE_LINKS: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_source_links == true && 'true' || 'false' }}
        run: |
          args=()
          if [ "$AUDIT_SOURCE_LINKS" = "true" ]; then
            args+=(--audit-source-links)
          fi
          if [ "$STRICT_SOURCE_LINKS" = "true" ]; then
            args+=(--strict-source-links)
          fi
          npm run export:subject-release-gate:ci -- "${args[@]}"

      - name: Upload release-gate reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: subject-export-release-gate-reports
          path: |
            tmp/exports/*-release-report.md
            tmp/exports/m5-subject-export-summary.json
            tmp/exports/m5-subject-export-summary.md
            tmp/exports/validation/subject-export-package-validation-report.json
            tmp/exports/validation/subject-export-package-validation-report.md
            tmp/exports/readiness/*-readiness-report.json
            tmp/exports/link-audit/subject-export-source-link-audit.json
            tmp/exports/link-audit/subject-export-source-link-audit.md
            tmp/exports/reproducibility/m5-export-reproducibility-report.json
            tmp/exports/reproducibility/m5-export-reproducibility-report.md
            tmp/exports/publication/subject-export-publication-index.json
            tmp/exports/publication/subject-export-publication-index.md
            tmp/exports/release-gate/subject-export-release-gate-report.json
            tmp/exports/release-gate/subject-export-release-gate-report.md
            tmp/curriculum-release-model/full-standalone-package-build-summary.json
            tmp/curriculum-release-model/fwu-owl-validation/tools-report.json
            tmp/curriculum-release-model/fwu-owl-reverse/reverse-compilation-report.json
            tmp/curriculum-release-model/fwu-owl-reverse/evidence/
