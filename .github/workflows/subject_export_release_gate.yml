name: Subject Export Release Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  subject-export-release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install package validation dependencies
        run: python -m pip install -r ../scripts/curriculum_package_validation_requirements.txt
      - name: Check memory-card reviews
        run: npm run quality:memory-card-review:check:all
      - name: Exercise bounded subject export and reproducibility
        env:
          SOURCE_DATE_EPOCH: '315532800'
        run: |
          npm run test:deterministic-zip32
          npm run export:subject-package -- \
            --subject Latein \
            --version 0.0.0-ci \
            --output-dir tmp/subject-export-bounded-a
          npm run export:subject-package -- \
            --subject Latein \
            --version 0.0.0-ci \
            --output-dir tmp/subject-export-bounded-b
          cmp \
            ../tmp/subject-export-bounded-a/skillpilot-de-gymnasium-latein-v0.0.0-ci.zip \
            ../tmp/subject-export-bounded-b/skillpilot-de-gymnasium-latein-v0.0.0-ci.zip
          npm run export:subject-packages:validate -- \
            --zip ../tmp/subject-export-bounded-a/skillpilot-de-gymnasium-latein-v0.0.0-ci.zip \
            --report-dir ../tmp/subject-export-bounded-a/validation
      - name: Verify committed quality status
        run: |
          npm run quality:memory-card-review:report:all
          npm run quality:curriculum-status
          git diff --exit-code -- ../docs/qa-ci/status
          test -z "$(git ls-files --others --exclude-standard -- ../docs/qa-ci/status)"
