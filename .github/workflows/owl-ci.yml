name: Optional Package CI

on:
  workflow_dispatch:
    inputs:
      audit_source_links:
        description: 'Run live official-source URL reachability checks.'
        required: false
        default: false
        type: boolean
      strict_source_links:
        description: 'Fail if live official-source URL checks find broken links.'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-ci:
    name: Full standalone JSON package CI
    runs-on: ubuntu-24.04
    env:
      SKILLPILOT_SOURCE_PDF_MODE: committed-bindings
      SKILLPILOT_PACKAGE_RUN: tmp/curriculum-release-model/conformance-runs/current-v3-full-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Retain the complete Mathematics producer/consumer input closure,
          # including its 1.638 GB of images and bound prompt/import provenance.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /ai/
            /app/
            !/app/public/assets/goal-visualizations/
            /app/public/assets/goal-visualizations/mathematik/
            /backend/
            /content/
            /contracts/
            /curricula/
            !/curricula/DE/Gymnasium/quality/
            !/curricula/DE/Gymnasium/visualizations/
            /curricula/DE/Gymnasium/visualizations/mathematik/*/prompt.*.md
            /curricula/DE/Gymnasium/quality/goal-visualization-review/m7-astra-user-prompts-20260924-v1/prompts.md
            /curricula/DE/Gymnasium/quality/goal-visualization-review/m7-astra-user-prompts-20260924-v1/user-image-sight-and-prompt21-receipt-20260924-v2.json
            /curricula/DE/Gymnasium/quality/goal-visualization-review/m7-astra-user-prompts-20260924-v1/incoming/prompt_[1369].png
            /curricula/DE/Gymnasium/quality/goal-visualization-review/m7-astra-user-prompts-20260924-v1/incoming/prompt_1[1-9].png
            /curricula/DE/Gymnasium/quality/goal-visualization-review/m7-astra-user-prompts-20260924-v1/incoming/prompt_2[12].png
            /curricula/DE/Gymnasium/quality/goal-visualization-review/m7-ln-existing-keep-20260927-v1/README.md
            /curricula/DE/Gymnasium/quality/goal-visualization-review/m7-ln-existing-keep-20260927-v1/user-image-reactivation-receipt.json
            /curricula/DE/Gymnasium/quality/goal-visualization-review/math-m7-ln-hyperbola-mobile-png-20260923-v1.md
            /curricula/DE/Gymnasium/quality/assessment-completion/
            /curricula/DE/Gymnasium/quality/learning-units/
            /curricula/DE/Gymnasium/quality/release-model/
            /curricula/DE/Gymnasium/quality/package-redistribution/
            /curricula/DE/Gymnasium/quality/source-verification/
            /curricula/DE/Gymnasium/quality/goal-visualization-qa/mathematik.qa.json
            /curricula/DE/Gymnasium/quality/semantic-atomicity/canonical-math-full.config.json
            /curricula/DE/Gymnasium/quality/semantic-atomicity/canonical-math-full.review.jsonl
            /curricula/DE/Gymnasium/quality/memory-card-review/canonical-math-full.config.json
            /curricula/DE/Gymnasium/quality/memory-card-review/canonical-math-full.review.jsonl
            /curricula/DE/Gymnasium/quality/memory-card-review/canonical-math-full.cards.review.jsonl
            /deploy/
            /docs/
            /LICENSES/
            /scripts/
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Node dependencies
        run: npm --prefix app ci
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Set up pinned Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version-file: .java-version
      - name: Use exact production Corretto build
        run: |
          set -euo pipefail
          corretto_version="$(tr -d '[:space:]' < .corretto-version)"
          install_dir="${RUNNER_TEMP}/amazon-corretto-${corretto_version}"
          archive="${RUNNER_TEMP}/amazon-corretto-${corretto_version}-linux-x64.tar.gz"
          curl -fsSL "https://corretto.aws/downloads/resources/${corretto_version}/amazon-corretto-${corretto_version}-linux-x64.tar.gz" -o "${archive}"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_dir}"
          echo "JAVA_HOME=${install_dir}" >> "${GITHUB_ENV}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/java" -version
      - name: Use Ubuntu package sources
        uses: ./.github/actions/ubuntu-apt
      - name: Install isolation and archive tools
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y bubblewrap strace zip unzip
      - name: Enable and verify bubblewrap isolation
        run: bash scripts/configure_github_bubblewrap.sh
      - name: Install pinned package-consumer browser
        working-directory: app
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Install package validation dependencies
        run: python -m pip install -r scripts/curriculum_package_validation_requirements.txt
      - name: Validate current full standalone Mathematics package
        env:
          SKILLPILOT_FULL_PACKAGE_CONFORMANCE: 'true'
        run: |
          bash -n scripts/run_learning_units_package_conformance.sh
          bash scripts/run_learning_units_package_conformance.sh \
            --producer-profile contracts/curriculum-package/v1.2/profiles/de-gymnasium-mathematik-learning-unit-offers-release-model-v2.profile.json \
            --work-dir "${SKILLPILOT_PACKAGE_RUN}"
      - name: Load the actual current package through the backend
        working-directory: backend
        env:
          SKILLPILOT_CONFORMANCE_PACKAGE_STORE: ${{ github.workspace }}/${{ env.SKILLPILOT_PACKAGE_RUN }}/provisioned-store
        run: |
          test -f "${SKILLPILOT_CONFORMANCE_PACKAGE_STORE}/locks/active.json"
          ./gradlew test --console=plain --rerun-tasks \
            --tests 'com.skillpilot.backend.curriculumpackage.ProvisionedCurriculumPackageConformanceTest'
      - name: Require one real package test without skips
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          name = 'com.skillpilot.backend.curriculumpackage.ProvisionedCurriculumPackageConformanceTest'
          path = Path('backend/build/test-results/test') / f'TEST-{name}.xml'
          if not path.is_file():
              raise SystemExit('Missing actual current-package test report')
          suite = ET.parse(path).getroot()
          cases = suite.findall('testcase')
          if suite.get('name') != name or suite.get('tests') != '1' or len(cases) != 1:
              raise SystemExit('Expected exactly one actual current-package test')
          if any(int(suite.get(field, '0')) for field in ('skipped', 'failures', 'errors')):
              raise SystemExit('Current-package test failed or skipped')
          if any(suite.findall('.//' + tag) for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('Current-package testcase failed or skipped')
          print('Actual current-package integration: 1 executed test, 0 skips/failures/errors')
          PY
      - name: Upload current package evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: optional-full-package-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.SKILLPILOT_PACKAGE_RUN }}/*.json
            ${{ env.SKILLPILOT_PACKAGE_RUN }}/package-consumer-smoke/assembly-manifest.json
            ${{ env.SKILLPILOT_PACKAGE_RUN }}/package-consumer-smoke/evidence-bundle-manifest.json
            ${{ env.SKILLPILOT_PACKAGE_RUN }}/package-consumer-smoke/evidence-bundle/
            backend/build/test-results/test/TEST-com.skillpilot.backend.curriculumpackage.ProvisionedCurriculumPackageConformanceTest.xml

  fwu-owl-ci:
    name: FWU-OWL and roundtrip CI
    runs-on: ubuntu-latest
    env:
      SKILLPILOT_SOURCE_PDF_MODE: committed-bindings
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Node dependencies
        run: npm --prefix app ci
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Set up pinned Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version-file: .java-version
      - name: Use exact production Corretto build
        run: |
          set -euo pipefail
          corretto_version="$(tr -d '[:space:]' < .corretto-version)"
          install_dir="${RUNNER_TEMP}/amazon-corretto-${corretto_version}"
          archive="${RUNNER_TEMP}/amazon-corretto-${corretto_version}-linux-x64.tar.gz"
          curl -fsSL "https://corretto.aws/downloads/resources/${corretto_version}/amazon-corretto-${corretto_version}-linux-x64.tar.gz" -o "${archive}"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_dir}"
          echo "JAVA_HOME=${install_dir}" >> "${GITHUB_ENV}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/java" -version
      - name: Use Ubuntu package sources
        uses: ./.github/actions/ubuntu-apt
      - name: Install isolation and archive tools
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y bubblewrap strace zip unzip
      - name: Enable and verify bubblewrap isolation
        run: bash scripts/configure_github_bubblewrap.sh
      - name: Install FWU-OWL validation dependencies
        run: python -m pip install -r scripts/curriculum_fwu_owl_validation_requirements.txt
      - name: Provision pinned FWU ontology and ROBOT
        run: |
          bash -n \
            scripts/provision_pinned_fwu_ontology.sh \
            scripts/provision_pinned_robot.sh \
            scripts/run_curriculum_fwu_owl_package_conformance.sh \
            scripts/run_curriculum_fwu_owl_reverse_conformance.sh
          bash scripts/provision_pinned_fwu_ontology.sh
          bash scripts/provision_pinned_robot.sh
          python -B scripts/check_curriculum_fwu_owl_validation_tools.py \
            --report tmp/curriculum-release-model/fwu-owl-validation/tools-report.json
      - name: Test Core-first FWU-OWL package builder
        run: |
          npm --prefix app run typecheck:fwu-owl-package-builder
          npm --prefix app run test:fwu-owl-package-builder
      - name: Prepare current curriculum runtime assets
        run: npm --prefix app run prepare:runtime-assets
      - name: Build and validate Mathematics subject package
        run: |
          npm --prefix app run export:subject-package -- --subject Mathematik --version 0.1.0
          npm --prefix app run export:subject-packages:validate -- \
            --zip ../tmp/exports/skillpilot-de-gymnasium-mathematik-v0.1.0.zip
      - name: Run semantic MEM/FWU roundtrip
        run: npm --prefix app run roundtrip:mem-fwu:semantic
      - name: Run OWL 2 DL and HermiT roundtrip validation
        env:
          ROBOT_JAR: ${{ github.workspace }}/tmp/tools/robot.jar
        run: npm --prefix app run roundtrip:mem-fwu:owl:reason
      - name: Run bounded FWU-OWL and reverse-compiler contracts
        run: |
          python -B scripts/validate_curriculum_fwu_owl_package_contracts.py
          python -B scripts/validate_fwu_owl_curriculum_package.py --self-test
          python -B scripts/validate_curriculum_fwu_owl_reverse_compilation_contract.py --self-test
          python -B scripts/reconstruct_json_curriculum_package_from_fwu_owl.py --self-test
          python -B scripts/run_fwu_owl_reverse_compiler_hermetic.py --self-test
          python -B scripts/validate_curriculum_dual_release_contracts.py
      - name: Upload FWU-OWL evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: optional-fwu-owl-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            tmp/curriculum-release-model/fwu-owl-validation/tools-report.json
            tmp/roundtrip/mem-fwu/skillpilot-de-gymnasium-mathematik-v0.1.0/slim/owl-validation-report.json
            tmp/roundtrip/mem-fwu/skillpilot-de-gymnasium-mathematik-v0.1.0/slim/owl-validation-report.md
            tmp/roundtrip/mem-fwu/skillpilot-de-gymnasium-mathematik-v0.1.0/slim/semantic-reconstructed/semantic-reconstruction-report.json
            tmp/roundtrip/mem-fwu/skillpilot-de-gymnasium-mathematik-v0.1.0/slim/semantic-reconstructed/semantic-reconstruction-report.md

  subject-export-release-gate:
    name: Full subject export release gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install package validation dependencies
        run: python -m pip install -r ../scripts/curriculum_package_validation_requirements.txt
      - name: Run full subject export release gate
        env:
          AUDIT_SOURCE_LINKS: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_source_links == true && 'true' || 'false' }}
          STRICT_SOURCE_LINKS: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_source_links == true && 'true' || 'false' }}
        run: |
          args=()
          if [ "$AUDIT_SOURCE_LINKS" = "true" ]; then
            args+=(--audit-source-links)
          fi
          if [ "$STRICT_SOURCE_LINKS" = "true" ]; then
            args+=(--strict-source-links)
          fi
          npm run export:subject-release-gate:ci -- "${args[@]}"
      - name: Upload subject export evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: optional-subject-export-release-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            tmp/exports/*-release-report.md
            tmp/exports/m5-subject-export-summary.json
            tmp/exports/m5-subject-export-summary.md
            tmp/exports/validation/subject-export-package-validation-report.json
            tmp/exports/validation/subject-export-package-validation-report.md
            tmp/exports/readiness/*-readiness-report.json
            tmp/exports/link-audit/subject-export-source-link-audit.json
            tmp/exports/link-audit/subject-export-source-link-audit.md
            tmp/exports/reproducibility/m5-export-reproducibility-report.json
            tmp/exports/reproducibility/m5-export-reproducibility-report.md
            tmp/exports/publication/subject-export-publication-index.json
            tmp/exports/publication/subject-export-publication-index.md
            tmp/exports/release-gate/subject-export-release-gate-report.json
            tmp/exports/release-gate/subject-export-release-gate-report.md
