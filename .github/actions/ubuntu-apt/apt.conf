// CI runner policy, also used by Playwright's nested apt-get invocations.
// skillpilot-ubuntu.sources is rendered from the image's ubuntu.sources: every Ubuntu
// stanza reads a mirror list in /etc/apt/skillpilot-ubuntu-mirrors with the direct
// Ubuntu endpoint first and the image's Azure mirror second. Suites (including
// security), components and Signed-By are kept, so every mirror is verified alike.
Dir::Etc::sourcelist "skillpilot-ubuntu.sources";
Dir::Etc::sourceparts "-";
// A source that does not connect or send data for 30 s counts as failed for that file,
// and the mirror transport moves the file to the next mirror.
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
// The next mirror is the retry. Same-source retries would come first and multiply the
// wait for a stalled source, and APT 2.8 (Ubuntu 24.04) can leave a delayed retry
// unscheduled once the mirror transport sends new files to that host: update hangs.
Acquire::Retries "0";
// Before each update, give priority 1 to a source that answers (order-ubuntu-mirrors.sh):
// a source that accepts connections and then stalls would cost the timeout per file.
// The hook only reorders; if it cannot run, the lists keep their order and failover.
APT::Update::Pre-Invoke { "/usr/local/sbin/skillpilot-order-ubuntu-mirrors /etc/apt/skillpilot-ubuntu-mirrors || true"; };
