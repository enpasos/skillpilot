// CI runner policy, also used by Playwright's nested apt-get invocations.
// skillpilot-ubuntu.sources is rendered from the image's ubuntu.sources with
// direct Ubuntu endpoints; suites (including security) and Signed-By are kept.
Dir::Etc::sourcelist "skillpilot-ubuntu.sources";
Dir::Etc::sourceparts "-";
// Bound stalled connections instead of waiting on an unreachable mirror.
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
Acquire::Retries "2";
