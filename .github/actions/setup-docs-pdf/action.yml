name: Set up documentation PDF tools
description: Install the offline Pandoc/XeLaTeX renderer and its packaged fonts.
runs:
  using: composite
  steps:
    - name: Use Ubuntu package sources
      uses: ./.github/actions/ubuntu-apt
    - name: Install PDF typesetting tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended \
          fonts-linuxlibertine fonts-dejavu-core
        kpsewhich pzdr.tfm
