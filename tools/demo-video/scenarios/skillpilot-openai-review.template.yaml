# Review blueprint, not submission evidence as committed.
#
# `review-build` prepares four fresh disposable learners and passes their
# SkillPilot IDs only through an in-memory environment map. Every 24-hour
# learning session is created later by the recorded first-party WebGUI click;
# no session ID or protected ChatGPT URL is a fixture input. Never put the IDs
# in this file. The verified operator Chromium
# profile path is likewise supplied only through the private review file; each
# command works on a disposable private snapshot and never modifies the source
# profile. Calibrate the external ChatGPT selectors and validate the result.
schemaVersion: 1
id: skillpilot-openai-review-v1
title: SkillPilot Coach v1 review demonstration
description: Demonstrate the supported SkillPilot browser launch and its main learning workflows with fresh disposable learners.
# `review-build --source-revision` replaces this public placeholder in memory.
sourceRevision: SET_TO_DEPLOYED_GIT_SHA
platform: web
outputDir: ../output
cacheDir: ../.cache

variables:
  skillpilotUrl: https://skillpilot.com/
  chatgptUrl: https://chatgpt.com/
  chatgptComposerSelector: "[contenteditable='true']"
  chatgptAssistantSelector: "[data-message-author-role='assistant']"
  memoryWidgetFrameSelector: "iframe[title*='SkillPilot']"

browser:
  headless: false
  viewport: { width: 1440, height: 900 }
  video: { width: 1440, height: 900 }
  locale: en-US
  timezoneId: Europe/Berlin
  colorScheme: light
  reducedMotion: reduce
  persistentProfilePathFromEnv: SKILLPILOT_REVIEW_CHATGPT_PROFILE
  persistentProfileRequiresSnapshot: true
  defaultTimeoutMs: 60000
  postActionDelayMs: 1000
  dialogPolicy: accept

privacy:
  maskSelectors:
    - "[data-testid='accounts-profile-button']"
    - "#skillpilotIdInput"
    - "[data-testid*='tool'] pre"
    - "[data-testid*='tool'] code"
  requiredMaskSelectors:
    - "[data-testid='accounts-profile-button']"
  maskTextSelectors:
    - "[data-message-author-role='user']"
  forbiddenPatterns:
    - "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}"
    - "(?:Bearer|bearer)\\s+[A-Za-z0-9._~-]+"
    - "(?:access_token|refresh_token|authorization_code|code_verifier|client_secret)"
    - "(?:batchCapability|gradingCapability|evaluationCapability|reviewCapability)"
  evidenceSelectors:
    - "${chatgptAssistantSelector}"
  failOnForbiddenText: true

narration:
  mode: ai
  model: gpt-5.6
  ttsModel: gpt-4o-mini-tts
  voice: cedar
  instructions: Speak in clear, calm, professional English for an OpenAI plugin review. Explain only visible, evidenced behavior and safety boundaries. Describe SkillPilot Coach v1 only as a ChatGPT browser experience; do not claim operating-system, native-app, mobile, or cross-platform support.
  disclosure: The narration in this video is AI-generated and is not a human voice.
  segmentGapMs: 350
  maxSegments: 28

render:
  width: 1920
  height: 1080
  fps: 30
  crf: 18
  preset: medium
  burnSubtitles: true
  subtitleFontSize: 34
  subtitleBottomMargin: 64
  autoZoom: { enabled: true, factor: 1.12, durationMs: 1600 }

# SkillPilot Coach v1 declares ChatGPT in a browser as its only supported review
# surface. Generic scenarios may still append reviewed native clips, but this
# submission contains none; that boundary remains subject to portal review.
platformClips: []

chapters:
  - id: p2-orientation
    title: Start in SkillPilot and continue with context-bound learning
    narrationHint: "Show the supported first-party launch for a fresh configured learner: the WebGUI verifies the learning context, creates a new 24-hour learning session, opens ChatGPT with the prepared message, and the user sends it unchanged."
    steps:
      - id: p2-open-first-party
        action: goto
        label: Open the SkillPilot first-party start page
        url: "${skillpilotUrl}"
      - id: p2-open-setup
        action: click
        label: Open the learner setup
        target: { role: button, name: "Jetzt starten" }
      - id: p2-terms-heading
        action: waitFor
        label: Show the current SkillPilot Terms before first use
        target: { role: heading, name: "Bitte akzeptiere die Nutzungsbedingungen, um mit SkillPilot zu starten:" }
        timeoutMs: 60000
      - id: p2-terms-check
        action: check
        label: Accept the current Terms for this clean recording context
        target: { role: checkbox, name: "Ich akzeptiere die Nutzungsbedingungen", exact: false }
      - id: p2-terms-accept
        action: click
        label: Confirm the Terms acceptance
        target: { role: button, name: "Akzeptieren & Fortfahren" }
      - id: p2-enter-disposable-id
        action: fill
        label: Enter the freshly public-CREATE disposable SkillPilot ID as an existing ID
        target: { css: "#skillpilotIdInput" }
        valueFromEnv: SKILLPILOT_REVIEW_P2_SKILLPILOT_ID
        secret: true
      - id: p2-existing-id-label
        action: assert
        label: Show that EXISTING is only the visible first-party selection mode
        target: { text: "Vorhandene ID", exact: true }
        capture: true
      - id: p2-continue-to-curriculum
        action: click
        label: Load the freshly configured disposable learner
        target: { role: button, name: "Weiter zu Schritt 2: Curriculum wählen" }
      - id: p2-expand-personal-curriculum
        action: click
        label: Expand the compact summary of the existing learner without changing it
        target: { role: button, name: "Ändern: Persönliches Curriculum festlegen", exact: true }
      - id: p2-level-two-complete
        action: waitFor
        label: Verify that the personal curriculum is fully configured
        target: { role: heading, name: "Dein persönlicher Lehrplan ist eingerichtet." }
        timeoutMs: 60000
      - id: p2-level-two-jurisdiction
        action: assert
        label: Verify the configured jurisdiction
        target: { text: "Hessen", exact: true, match: last }
      - id: p2-level-two-duration
        action: assert
        label: Verify the configured duration model
        target: { text: "G9", exact: true, match: last }
      - id: p2-level-two-stage
        action: assert
        label: Verify the configured upper-secondary scope
        target: { text: "Gymnasiale Oberstufe (Sekundarstufe II)", exact: true, match: last }
      - id: p2-level-two-subject
        action: assert
        label: Verify the configured subject
        target: { text: "Mathematik", exact: true, match: last }
      - id: p2-level-two-course
        action: assert
        label: Verify the configured course profile
        target: { text: "Mathematik – Leistungskurs", exact: true, match: last }
      - id: p2-provider-notice
        action: assert
        label: Verify the first-party AI fallibility notice
        target: { text: "Der Lerncoach ist ein KI-Assistent und kann Fehler machen. Prüfe wichtige Antworten.", exact: true }
      - id: p2-provider-title
        action: assert
        label: Verify the selected ChatGPT provider integration
        target: { text: "SkillPilot-App in ChatGPT", exact: true }
      - id: p2-provider-handoff
        action: assert
        label: Verify the fresh-chat handoff explanation
        target: { text: "SkillPilot öffnet einen neuen ChatGPT-Chat mit einer zum vorbereiteten nächsten Schritt passenden Startnachricht. Aktiviere dort bei Bedarf die App „SkillPilot Coach v1“ und sende die bereits eingetragene Nachricht ab.", exact: true }
        capture: true
      - id: p2-open-chatgpt
        action: click
        label: Start learning through the normal first-party handoff
        target: { role: button, name: "SkillPilot-App öffnen" }
        samePage: true
      - id: p2-wait-chatgpt
        action: waitFor
        label: Wait for the automatically opened fresh ChatGPT conversation
        target: { css: "${chatgptComposerSelector}" }
        timeoutMs: 60000
      - id: p2-prompt-injected
        action: assertPreparedPrompt
        label: Verify the exact message injected by the first-party WebGUI URL before sending
        target: { css: "${chatgptComposerSelector}" }
        timeoutMs: 60000
      - id: p2-account-mask-target
        action: assert
        label: Verify that the visible account control is protected by the required opaque mask
        target: { css: "[data-testid='accounts-profile-button']", match: last }
        timeoutMs: 60000
        capture: true
      - id: p2-send-start
        action: press
        label: Send the visible prefilled 24-hour session message unchanged
        target: { css: "${chatgptComposerSelector}" }
        key: Enter
      - id: p2-wait-context
        action: waitFor
        label: Wait for context-grounded orientation
        target: { css: "${chatgptAssistantSelector}", match: last }
        timeoutMs: 60000
      - id: p2-wait-context-complete
        action: waitFor
        label: Wait until the context-grounded response has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p2-context-ready
        action: assert
        label: Fail closed unless the fresh session actually returns the configured orientation
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "(?:Warum Mathematik|drei mögliche Wege|Veränderung, Wachstum und Modelle)"
        timeoutMs: 60000
      - id: p2-path
        action: fill
        label: Choose the reviewed growth path in the learner's own words
        target: { css: "${chatgptComposerSelector}" }
        value: Wachstum fände ich spannend
      - id: p2-send-path
        action: press
        label: Send the path choice
        key: Enter
      - id: p2-wait-personal-start
        action: waitFor
        label: Wait for ChatGPT to start the personal orientation response
        target: { testId: stop-button }
        state: visible
        timeoutMs: 60000
      - id: p2-wait-personal-complete
        action: waitFor
        label: Wait until the personal orientation response has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p2-personal
        action: fill
        label: Give the concrete personal example requested by the orientation
        target: { css: "${chatgptComposerSelector}" }
        value: Bakterienwachstum
      - id: p2-send-personal
        action: press
        label: Send the personal response
        key: Enter
      - id: p2-wait-transition-start
        action: waitFor
        label: Wait for ChatGPT to start the server-authorized transition
        target: { testId: stop-button }
        state: visible
        timeoutMs: 60000
      - id: p2-wait-transition-complete
        action: waitFor
        label: Wait until the coach has finished responding to the concrete interest
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p2-second-goal
        action: assert
        label: Verify that the coach has moved beyond orientation into a substantive next goal
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "(?:Darstellungsform auswählen und begründen|Graph|Tabelle|Bakterienwachstum)"
        timeoutMs: 60000
        capture: true
      - id: p2-adaptive-learning-answer
        action: fill
        label: Follow the coach flexibly into a concrete comparison of two representations
        target: { css: "${chatgptComposerSelector}" }
        value: Ich möchte jetzt mit Bakterienwachstum konkret weiterlernen. Ich würde einen Graphen wählen, weil man daran die Entwicklung über die Zeit und Veränderungen besonders schnell erkennt. Was kann ich am Graphen erkennen, das eine Tabelle weniger direkt zeigt?
      - id: p2-send-adaptive-learning-answer
        action: press
        label: Continue naturally with the coach
        key: Enter
      - id: p2-wait-learning-feedback-start
        action: waitFor
        label: Wait for the coach to continue the learning dialogue
        target: { testId: stop-button }
        state: visible
        timeoutMs: 60000
      - id: p2-wait-learning-feedback-complete
        action: waitFor
        label: Wait until the coach feedback has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p2-learning-result
        action: assert
        label: Capture the coach's completed response in the second learning exchange
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "\\S"
        timeoutMs: 60000
        capture: true

  - id: p3-memory-and-recall
    title: Complete a second learning goal through Verified Recall
    narrationHint: A fresh learner starts at the required orientation. Follow the coach's questions naturally with a concrete interest, let the coach complete that first goal, then switch explicitly to the newly available memory goal and complete its full eight-card Verified Recall.
    steps:
      - id: p3-open-first-party
        action: goto
        label: Return to the SkillPilot first-party start page
        url: "${skillpilotUrl}"
      - id: p3-open-setup
        action: click
        label: Open the learner setup for the next fresh learner
        target: { role: button, name: "Jetzt starten" }
      - id: p3-enter-disposable-id
        action: fill
        label: Enter the freshly public-CREATE disposable SkillPilot ID
        target: { css: "#skillpilotIdInput" }
        valueFromEnv: SKILLPILOT_REVIEW_P3_SKILLPILOT_ID
        secret: true
        capture: true
      - id: p3-continue-to-curriculum
        action: click
        label: Load the configured learner in the WebGUI
        target: { role: button, name: "Weiter zu Schritt 2: Curriculum wählen" }
      - id: p3-expand-personal-curriculum
        action: click
        label: Expand the configured learner summary without changing it
        target: { role: button, name: "Ändern: Persönliches Curriculum festlegen", exact: true }
      - id: p3-level-two-complete
        action: waitFor
        label: Verify the committed personal curriculum before launching
        target: { role: heading, name: "Dein persönlicher Lehrplan ist eingerichtet." }
        timeoutMs: 60000
      - id: p3-open-chatgpt
        action: click
        label: Create the fresh 24-hour session through the normal WebGUI handoff
        target: { role: button, name: "SkillPilot-App öffnen" }
        samePage: true
      - id: p3-wait-chatgpt
        action: waitFor
        label: Wait for the URL-prefilled ChatGPT composer
        target: { css: "${chatgptComposerSelector}" }
        timeoutMs: 60000
      - id: p3-prompt-injected
        action: assertPreparedPrompt
        label: Verify the exact message injected by the first-party WebGUI URL before sending
        target: { css: "${chatgptComposerSelector}" }
        timeoutMs: 60000
      - id: p3-send-start
        action: press
        label: Send the visible prefilled 24-hour session message
        key: Enter
      - id: p3-wait-orientation
        action: waitFor
        label: Wait for the context-grounded orientation before answering
        target: { css: "${chatgptAssistantSelector}", match: last }
        timeoutMs: 60000
      - id: p3-wait-orientation-complete
        action: waitFor
        label: Wait until the orientation response has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p3-context-ready
        action: assert
        label: Fail closed unless the fresh session actually returns the configured orientation
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "(?:Warum Mathematik|drei mögliche Wege|Veränderung, Wachstum und Modelle)"
        timeoutMs: 60000
      - id: p3-orientation-path
        action: fill
        label: Choose the reviewed growth path in the learner's own words
        target: { css: "${chatgptComposerSelector}" }
        value: Wachstum fände ich spannend
      - id: p3-send-orientation-path
        action: press
        label: Send the orientation path choice
        key: Enter
      - id: p3-wait-personal-start
        action: waitFor
        label: Wait for ChatGPT to start the personal orientation response
        target: { testId: stop-button }
        state: visible
        timeoutMs: 60000
      - id: p3-wait-personal-complete
        action: waitFor
        label: Wait until the personal orientation response has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p3-orientation-personal
        action: fill
        label: Supply the concrete personal example requested by the orientation
        target: { css: "${chatgptComposerSelector}" }
        value: Bakterienwachstum
      - id: p3-send-orientation-personal
        action: press
        label: Send the personal orientation response
        key: Enter
      - id: p3-wait-transition-start
        action: waitFor
        label: Wait for ChatGPT to start the server-authorized transition
        target: { testId: stop-button }
        state: visible
        timeoutMs: 60000
      - id: p3-wait-transition-complete
        action: waitFor
        label: Wait until the coach has finished responding to the concrete interest
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p3-learning-exchange
        action: assert
        label: Verify that the coach has moved beyond orientation before changing to the memory goal
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "(?:Darstellungsform auswählen und begründen|Graph|Tabelle|Bakterienwachstum)"
        timeoutMs: 60000
        capture: true
      - id: p3-practice-prompt
        action: fill
        label: Select the now-frontier-eligible memory goal and request normal practice
        target: { css: "${chatgptComposerSelector}" }
        value: Ich möchte jetzt zum Lernziel „Lernkarten - Funktionen und Gleichungen“ wechseln und dort die fälligen Karteikarten normal üben.
      - id: p3-send-practice
        action: press
        label: Request the explicit goal switch
        key: Enter
      - id: p3-wait-memory-goal-complete
        action: waitFor
        label: Wait until the coach has finished activating the requested memory goal
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 90000
      - id: p3-memory-goal-ready
        action: assert
        label: Follow the coach and verify that the requested memory goal is now active
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "(?:Lernkarten\\s*-\\s*Funktionen und Gleichungen|Karteikarten lernen|Karteikarten)"
        timeoutMs: 90000
        capture: true
      - id: p3-recall-prompt
        action: fill
        label: Request strict Verified Recall
        target: { css: "${chatgptComposerSelector}" }
        value: Jetzt möchte ich die strenge Kartenprüfung ohne Hilfen machen.
      - id: p3-send-recall
        action: press
        label: Start Verified Recall
        key: Enter
      - id: p3-wait-questions
        action: assert
        label: Follow the coach and wait until the complete eight-question batch is visible
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "1\\.[\\s\\S]*8\\."
        timeoutMs: 60000
      - id: p3-answers
        action: fill
        label: Submit all eight reviewed answers in one turn
        target: { css: "${chatgptComposerSelector}" }
        value: "1. m=(y₂-y₁)/(x₂-x₁). 2. f(x)=a(x-d)²+e mit S(d|e). 3. Ein Produkt ist genau dann null, wenn mindestens ein Faktor null ist. 4. x=log_a(b), bei Basis e: x=ln(b). 5. a_(n+1)=a_n+d. 6. a_n=a_1·q^(n-1). 7. x^a·x^b=x^(a+b). 8. x_(1,2)=-p/2 ± sqrt((p/2)²-q)."
      - id: p3-send-answers
        action: press
        label: Submit the complete recall batch
        key: Enter
      - id: p3-result
        action: assert
        label: Verify the complete eight-card result and continuation
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "(?:8\\s*(?:von\\s*8|/\\s*8)|alle\\s+acht)"
        timeoutMs: 60000
        capture: true

  - id: p4-exam-evaluation
    title: Submit and evaluate a complete exam response
    narrationHint: The fresh GK campaign learner starts at B1 Algae Growth with zero mastery; no help is requested before submission.
    steps:
      - id: p4-open-first-party
        action: goto
        label: Return to the SkillPilot first-party start page
        url: "${skillpilotUrl}"
      - id: p4-open-setup
        action: click
        label: Open the learner setup for the fresh exam learner
        target: { role: button, name: "Jetzt starten" }
      - id: p4-enter-disposable-id
        action: fill
        label: Enter the freshly public-CREATE disposable SkillPilot ID
        target: { css: "#skillpilotIdInput" }
        valueFromEnv: SKILLPILOT_REVIEW_P4_SKILLPILOT_ID
        secret: true
        capture: true
      - id: p4-continue-to-curriculum
        action: click
        label: Load the configured exam learner in the WebGUI
        target: { role: button, name: "Weiter zu Schritt 2: Curriculum wählen" }
      - id: p4-expand-personal-curriculum
        action: click
        label: Expand the configured exam learner summary without changing it
        target: { role: button, name: "Ändern: Persönliches Curriculum festlegen", exact: true }
      - id: p4-level-two-complete
        action: waitFor
        label: Verify the committed personal curriculum before launching
        target: { role: heading, name: "Dein persönlicher Lehrplan ist eingerichtet." }
        timeoutMs: 60000
      - id: p4-open-chatgpt
        action: click
        label: Create the fresh exam session through the normal WebGUI handoff
        target: { role: button, name: "SkillPilot-App öffnen" }
        samePage: true
      - id: p4-wait-chatgpt
        action: waitFor
        label: Wait for the URL-prefilled ChatGPT composer
        target: { css: "${chatgptComposerSelector}" }
        timeoutMs: 60000
      - id: p4-prompt-injected
        action: assertPreparedPrompt
        label: Verify the exact message injected by the first-party WebGUI URL before sending
        target: { css: "${chatgptComposerSelector}" }
        timeoutMs: 60000
      - id: p4-send-start
        action: press
        label: Send the visible prefilled 24-hour session message
        key: Enter
      - id: p4-wait-task
        action: assert
        label: Follow the coach until the protected exam task itself is visibly presented
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "Das\\s+Wachstum\\s+eines\\s+Algenteppichs\\s+auf\\s+einem\\s+See\\s+wird\\s+modelliert"
        timeoutMs: 90000
      - id: p4-wait-task-complete
        action: waitFor
        label: Wait until the protected exam task has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p4-answer
        action: fill
        label: Submit the complete reviewed solution
        target: { css: "${chatgptComposerSelector}" }
        value: "Ich reiche jetzt meine vollständige Lösung ein: 1. A(0)=500/(1+49)=10 m². 2. Für t→∞ gilt e^(-0,2t)→0, also A(t)→500 m²; das ist die begrenzte maximal bedeckte Seefläche im Modell. 3. Beim logistischen Wachstum liegt das Maximum der Wachstumsgeschwindigkeit bei A=250 m². Aus 49e^(-0,2t)=1 folgt t=ln(49)/0,2≈19,46 Tage; A'(t)=0,2·A·(1-A/500), daher A'≈25 m²/Tag. 4. A(30)=500/(1+49e^-6)≈445,85 m² und A_neu(t)=445,85·0,95^(t-30) für t≥30. Aus 10=445,85·0,95^(t-30) folgt t≈104,03 Tage. 5. Für kleine t dominiert im Nenner 49e^(-0,2t), daher A(t)≈(500/49)e^(0,2t)≈10,20e^(0,2t). Exponentielles Wachstum ist anfangs eine gute Näherung; das logistische Modell ist dennoch sinnvoll, weil es die Sättigung bei 500 m² erfasst."
      - id: p4-send-answer
        action: press
        label: Submit the complete answer
        key: Enter
      - id: p4-wait-evaluation-start
        action: waitFor
        label: Wait for the coach to begin the criteria-based evaluation
        target: { testId: stop-button }
        state: visible
        timeoutMs: 60000
      - id: p4-wait-evaluation-complete
        action: waitFor
        label: Wait until the criteria-based evaluation has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 120000
      - id: p4-result
        action: assert
        label: Verify the server-confirmed criteria-based full-score evaluation
        target: { css: "${chatgptAssistantSelector}", match: last }
        textPattern: "Bestätigte\\s+Punktzahl:\\s*25\\s+von\\s+25"
        timeoutMs: 120000
        capture: true

  - id: p5-focus-widening
    title: Widen the learning focus only after explicit consent
