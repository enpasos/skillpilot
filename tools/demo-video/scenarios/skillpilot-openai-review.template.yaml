      - id: p5-expand-personal-curriculum
        action: click
        label: Expand the configured narrow-focus learner summary without changing it
        target: { role: button, name: "Ändern: Persönliches Curriculum festlegen", exact: true }
      - id: p5-level-two-complete
        action: waitFor
        label: Verify the committed personal curriculum before launching
        target: { role: heading, name: "Dein persönlicher Lehrplan ist eingerichtet." }
        timeoutMs: 60000
      - id: p5-open-chatgpt
        action: click
        label: Create the fresh focus session through the normal WebGUI handoff
        target: { role: button, name: "SkillPilot-App öffnen" }
        samePage: true
      - id: p5-wait-chatgpt
        action: waitFor
        label: Wait for the URL-prefilled ChatGPT composer
        target: { css: "${chatgptComposerSelector}" }
        timeoutMs: 60000
      - id: p5-prompt-injected
        action: assertPreparedPrompt
        label: Verify the exact message injected by the first-party WebGUI URL before sending
        target: { css: "${chatgptComposerSelector}" }
        timeoutMs: 60000
      - id: p5-send-start
        action: press
        label: Send the visible prefilled 24-hour session message
        key: Enter
      - id: p5-wait-context
        action: waitFor
        label: Wait for the fresh context-grounded coach response before requesting a focus change
        target: { css: "${chatgptAssistantSelector}", match: last }
        timeoutMs: 60000
      - id: p5-wait-context-complete
        action: waitFor
        label: Wait until the context-grounded response has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p5-request
        action: fill
        label: Ask to see the nearest suitable wider option without authorizing a change
        target: { css: "${chatgptComposerSelector}" }
        value: Mein aktueller Fokus ist bewusst zu eng. Zeige mir bitte die aktuell veröffentlichte nächstgrößere passende Fokusoption, aber ändere den Fokus noch nicht.
      - id: p5-send-request
        action: press
        label: Request options without mutation
        key: Enter
      - id: p5-option
        action: assert
        label: Follow the coach until it presents the current server-published option without mutation
        target: { css: "${chatgptAssistantSelector}", match: last }
        text: "E-Phase: Grundlagen der Analysis und mathematische Modelle"
        timeoutMs: 90000
      - id: p5-wait-option-complete
        action: waitFor
        label: Wait until the focus option response has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 60000
      - id: p5-confirm
        action: fill
        label: Explicitly confirm the first option
        target: { css: "${chatgptComposerSelector}" }
        value: Ja. Prüfe die aktuell veröffentlichten Fokusoptionen noch einmal, setze exakt die erste Option und nenne mir danach den bestätigten Fokus mit seinem exakten Titel.
      - id: p5-send-confirm
        action: press
        label: Apply exactly one authorized focus change
        key: Enter
      - id: p5-wait-result-start
        action: waitFor
        label: Wait for the coach to apply the explicitly authorized focus change
        target: { testId: stop-button }
        state: visible
        timeoutMs: 60000
      - id: p5-wait-result-complete
        action: waitFor
        label: Wait until the focus confirmation has finished streaming
        target: { testId: stop-button }
        state: hidden
        timeoutMs: 120000
      - id: p5-result
        action: assert
        label: Verify the confirmed successor focus
        target: { css: "${chatgptAssistantSelector}", match: last }
        text: "E-Phase: Grundlagen der Analysis und mathematische Modelle"
        timeoutMs: 120000
        capture: true
