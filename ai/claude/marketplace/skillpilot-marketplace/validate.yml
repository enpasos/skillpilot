name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace
    steps:
      - uses: actions/checkout@v6
        with:
          path: marketplace
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: enpasos/skillpilot
          ref: 7109b71bfa57804cbd0d83a87b30f010076b2437
          path: canonical
          sparse-checkout: ai/claude/plugin/skillpilot-coach-v1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install the pinned Claude validator
        run: npm install --global @anthropic-ai/claude-code@2.1.241
      - name: Verify pinned source and immutable package parity
        run: |
          canonical="${GITHUB_WORKSPACE}/canonical/ai/claude/plugin/skillpilot-coach-v1"
          artifact="${RUNNER_TEMP}/skillpilot-coach-v1-1.1.10.plugin"
          extracted="${RUNNER_TEMP}/skillpilot-coach-v1-1.1.10"
          # Publication must not depend on a download that is only indexed after publication.
          # Use the reviewed, immutable source dossier and its builder, never PR-supplied code.
          node --input-type=module - "${canonical}" "${artifact}" <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { lstatSync, readFileSync, readdirSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const [canonicalRoot, artifactPath] = process.argv.slice(2);
          const sourceHash = createHash("sha256");
          const sourceFiles = [];
          function hashCanonicalSource(directory = canonicalRoot, prefix = "") {
            for (const name of readdirSync(directory).sort()) {
              const path = prefix ? `${prefix}/${name}` : name;
              const absolute = resolve(directory, name);
              const stat = lstatSync(absolute);
              assert.ok(!stat.isSymbolicLink(), `Canonical source symlink forbidden: ${path}`);
              if (stat.isDirectory()) {
                hashCanonicalSource(absolute, path);
              } else {
                assert.ok(stat.isFile(), `Canonical source non-regular file: ${path}`);
                sourceFiles.push(path);
              }
            }
          }
          hashCanonicalSource();
          for (const path of sourceFiles.sort()) {
            const absolute = resolve(canonicalRoot, path);
            sourceHash.update(path, "utf8");
            sourceHash.update("\0", "utf8");
            sourceHash.update(createHash("sha256").update(readFileSync(absolute)).digest("hex"), "utf8");
            sourceHash.update("\0", "utf8");
          }
          assert.equal(sourceHash.digest("hex"), "fcc935a810aa52cb9ee42c09790491e879cc133961385634f95bd9b2865d6138", "Pinned canonical source tree");
          const { buildClaudePluginPackage } = await import(pathToFileURL(resolve(canonicalRoot, "build-package.mjs")));
          const { publicationFiles } = await import(pathToFileURL(resolve(canonicalRoot, "check-package.mjs")));
          const baseline = JSON.parse(readFileSync(resolve(canonicalRoot, "release/contract-baseline.json"), "utf8"));
          assert.equal(baseline.pluginVersion, "1.1.10", "Pinned dossier version");
          assert.equal(baseline.archive.bytes, 40835, "Pinned dossier archive bytes");
          assert.equal(baseline.archive.sha256, "a54c48a6b0b9345f0b2a70edd06d50995a6e62445ff87e6f8177b93a79331841", "Pinned dossier archive digest");
          assert.deepEqual([...publicationFiles].sort(), baseline.archive.entries.map(({ packagePath }) => packagePath).sort(), "Pinned dossier inventory");

          const expectedFiles = [
            ".claude-plugin/marketplace.json", ".github/workflows/validate.yml",
            "CHANGELOG.md", "LICENSE", "README.md",
            ...publicationFiles.map((path) => `plugins/skillpilot-coach-v1/${path}`),
          ].sort();
          const expectedDirectories = new Set();
          for (const path of expectedFiles) {
            for (let directory = dirname(path); directory !== "."; directory = dirname(directory)) {
              expectedDirectories.add(directory);
            }
          }
          function listFiles(directory = ".") {
            return readdirSync(directory).flatMap((name) => {
              const path = directory === "." ? name : `${directory}/${name}`;
              const stat = lstatSync(path);
              assert.ok(!stat.isSymbolicLink(), `Symlink forbidden: ${path}`);
              if (path === ".git" && stat.isDirectory()) return [];
              if (stat.isDirectory()) {
                assert.ok(expectedDirectories.has(path), `Unexpected directory: ${path}`);
                return listFiles(path);
              }
              assert.ok(stat.isFile(), `Non-regular file forbidden: ${path}`);
              return [path];
            }).sort();
          }
          assert.deepEqual(listFiles(), expectedFiles, "Closed Marketplace inventory");
          for (const path of publicationFiles) {
            assert.ok(readFileSync(resolve(canonicalRoot, path)).equals(readFileSync(resolve("plugins/skillpilot-coach-v1", path))), `Canonical source parity: ${path}`);
          }
          const built = buildClaudePluginPackage({ root: resolve("plugins/skillpilot-coach-v1"), outputPath: artifactPath });
          assert.equal(built.bytes, baseline.archive.bytes, "Rebuilt archive bytes");
          assert.equal(built.sha256, baseline.archive.sha256, "Rebuilt archive digest");
          assert.deepEqual(built.entries, baseline.archive.entries, "Rebuilt archive entries");
          NODE
          printf '%s  %s\n' \
            'a54c48a6b0b9345f0b2a70edd06d50995a6e62445ff87e6f8177b93a79331841' \
            "${artifact}" | sha256sum --check --strict
          mkdir "${extracted}"
          unzip -q "${artifact}" -d "${extracted}"
          diff --recursive --brief --no-dereference \
            "${extracted}" ./plugins/skillpilot-coach-v1
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict ./plugins/skillpilot-coach-v1
