name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install the pinned Claude validator
        run: npm install --global @anthropic-ai/claude-code@2.1.241
      - name: Verify immutable direct-install artifact parity
        run: |
          artifact="${RUNNER_TEMP}/skillpilot-coach-v1-1.1.0.plugin"
          extracted="${RUNNER_TEMP}/skillpilot-coach-v1-1.1.0"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --output "${artifact}" \
            "https://skillpilot.com/api/public/claude/plugins/skillpilot-coach-v1/1.1.0/sha256-ecb6e2d255699162a3221518d32eb4ee9de918cb5fce254f1cd67da0ac59f4ca/skillpilot-coach-v1-1.1.0.plugin"
          printf '%s  %s\n' \
            'ecb6e2d255699162a3221518d32eb4ee9de918cb5fce254f1cd67da0ac59f4ca' \
            "${artifact}" | sha256sum --check --strict
          mkdir "${extracted}"
          unzip -q "${artifact}" -d "${extracted}"
          diff --recursive --brief --no-dereference \
            "${extracted}" ./plugins/skillpilot-coach-v1
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict ./plugins/skillpilot-coach-v1
