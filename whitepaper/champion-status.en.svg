<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Champion status for the current Gymnasium mathematics scope</title>
  <desc id="desc">A schematic view of the current QA scope for Gymnasium mathematics in Germany with Stage 1 status and a champion progress counter.</desc>
  <rect width="1200" height="860" fill="#f5f7fb"/>
  <rect x="28" y="28" width="1144" height="804" rx="32" fill="#ffffff" stroke="#d7dee8" stroke-width="3"/>

  <text x="72" y="105" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">
    Current QA Scope: Gymnasium Mathematics
  </text>
  <text x="72" y="146" fill="#4e657d" font-family="Arial, Helvetica, sans-serif" font-size="18">
    Canonical scope after broadening to all of Germany and the full Gymnasium years.
  </text>

  <rect x="72" y="178" width="250" height="42" rx="21" fill="#fff1c7" stroke="#f2c14e" stroke-width="2"/>
  <text x="98" y="205" fill="#6f4c00" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">
    Stage 1 for current scope
  </text>

  <rect x="72" y="252" width="498" height="160" rx="24" fill="#f7fbff" stroke="#cfe1f2" stroke-width="2"/>
  <text x="104" y="300" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    Scope markers
  </text>
  <text x="104" y="340" fill="#34506c" font-family="Arial, Helvetica, sans-serif" font-size="20">
    Subject: Gymnasium Mathematics
  </text>
  <text x="104" y="372" fill="#34506c" font-family="Arial, Helvetica, sans-serif" font-size="20">
    Geography: DE · all 16 federal states
  </text>
  <text x="104" y="404" fill="#34506c" font-family="Arial, Helvetica, sans-serif" font-size="20">
    School span: Secondary I + II
  </text>

  <rect x="604" y="252" width="496" height="160" rx="24" fill="#eef8ef" stroke="#b9dfbf" stroke-width="2"/>
  <text x="636" y="300" fill="#1d5b2f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    Former narrower scope
  </text>
  <text x="636" y="340" fill="#2a6a3c" font-family="Arial, Helvetica, sans-serif" font-size="20">
    Hesse · upper secondary only · Secondary II
  </text>
  <text x="636" y="372" fill="#2a6a3c" font-family="Arial, Helvetica, sans-serif" font-size="20">
    This smaller scope had already reached Stage 2.
  </text>
  <text x="636" y="404" fill="#2a6a3c" font-family="Arial, Helvetica, sans-serif" font-size="20">
    Broadening resets QA for the new scope.
  </text>

  <line x1="72" y1="456" x2="1100" y2="456" stroke="#d7dee8" stroke-width="2"/>

  <text x="72" y="516" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
    Champion progress inside the current scope
  </text>

  <rect x="72" y="548" width="1028" height="204" rx="28" fill="#ffffff" stroke="#d7dee8" stroke-width="2.5"/>
  <text x="104" y="611" fill="#0668b3" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
    @enpasos
  </text>
  <rect x="430" y="578" width="214" height="52" rx="18" fill="#eef6ff" stroke="#b7d8f6" stroke-width="2"/>
  <text x="455" y="611" fill="#1f5d93" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
    Mathematics
  </text>
  <text x="828" y="611" fill="#5b6f86" font-family="Arial, Helvetica, sans-serif" font-size="22">
    SkillPilot-ID: 1c90a...
  </text>

  <text x="104" y="680" fill="#5b6f86" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    ACHIEVEMENTS
  </text>
  <text x="104" y="716" fill="#172f49" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">
    375 / 543
  </text>

  <text x="338" y="680" fill="#5b6f86" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    ISSUES
  </text>
  <text x="338" y="716" fill="#172f49" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">
    8
  </text>

  <text x="482" y="680" fill="#5b6f86" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    PRS
  </text>
  <text x="482" y="716" fill="#172f49" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">
    0
  </text>

  <rect x="650" y="654" width="380" height="58" rx="18" fill="#fff4ea" stroke="#f0c19a" stroke-width="2"/>
  <text x="676" y="690" fill="#8c4d1f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">
    Progress shown, but not yet full-scope certified
  </text>

  <text x="72" y="798" fill="#6a7d92" font-family="Arial, Helvetica, sans-serif" font-size="18">
    This graphic intentionally separates the current broad scope from the former narrower Stage-2 scope.
  </text>
</svg>
