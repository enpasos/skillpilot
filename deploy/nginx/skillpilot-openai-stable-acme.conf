# Include this exact file once from nginx http {}. Do not enable a directory
# wildcard just for this vhost; unrelated conf.d files may be intentionally idle.
# Keep this HTTP-01 vhost after TLS cutover so renewal never depends on the
# backend, OAuth, or a redirect. All other HTTP requests fail closed.
server {
    listen 80;
    server_name mcp-openai.skillpilot.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/skillpilot-openai-acme;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
