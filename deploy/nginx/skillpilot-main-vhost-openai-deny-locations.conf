# Include this file only inside the existing HTTPS `server {}` block whose
# server_name contains skillpilot.com. Place it before the general
# `location /` proxy. Do not include it at nginx main or `http {}` scope.
#
# These exact/prefix denials prevent the dedicated MCP contract and its
# loopback-only targets from becoming aliases on the main website origin.

location = /api/openai/de/v1/mcp {
    return 404;
}

location ^~ /api/openai/de/v1/mcp/ {
    return 404;
}

location = /api/openai/de/mcp {
    return 404;
}

location ^~ /api/openai/de/mcp/ {
    return 404;
}

location = /internal/openai/de/v1/mcp {
    return 404;
}

location ^~ /internal/openai/de/v1/mcp/ {
    return 404;
}

location = /.well-known/oauth-protected-resource {
    return 404;
}
