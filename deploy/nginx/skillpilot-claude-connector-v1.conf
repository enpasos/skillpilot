# SkillPilot Claude Connector v1 Nginx vhost template
# Dedicated origin: mcp-claude-v1.skillpilot.com

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp-claude-v1.skillpilot.com;

    # SSL certificates (dedicated lineage)
    ssl_certificate /etc/letsencrypt/live/mcp-claude-v1.skillpilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-claude-v1.skillpilot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 64k;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    # MCP endpoint
    location = /mcp {
        proxy_pass http://127.0.0.1:8787/internal/connectors/claude/v1/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_buffering off;
        proxy_read_timeout 35s;
    }

    # Protected resource metadata
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:8787/internal/connectors/claude/v1/oauth/protected-resource;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # Authorization server metadata
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:8787/internal/connectors/claude/v1/oauth/authorization-server;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # OAuth Authorize endpoint
    location = /oauth2/authorize {
        # The query contains OAuth state and the PKCE challenge. Keep it out of the default
        # access-log format, which normally records the complete request target.
        access_log off;
        proxy_pass http://127.0.0.1:8787/internal/connectors/claude/v1/oauth2/authorize;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # OAuth Token endpoint
    location = /oauth2/token {
        # Credentials belong in the form body, but suppress the request target as well so a
        # malformed client cannot put a token into a query string that reaches the access log.
        access_log off;
        proxy_pass http://127.0.0.1:8787/internal/connectors/claude/v1/oauth2/token;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # OAuth Revoke endpoint
    location = /oauth2/revoke {
        # See /oauth2/token: rejected query parameters must not become credential log entries.
        access_log off;
        proxy_pass http://127.0.0.1:8787/internal/connectors/claude/v1/oauth2/revoke;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # Consent and binding pages
    location = /connect {
        proxy_pass http://127.0.0.1:8787/internal/connectors/claude/v1/connect;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    location ^~ /connect/ {
        proxy_pass http://127.0.0.1:8787/internal/connectors/claude/v1/connect/;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # Privacy notice
    location = /privacy {
        proxy_pass http://127.0.0.1:8787/internal/connectors/claude/v1/privacy;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-claude-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # Deny all other routes
    location / {
        return 404;
    }
}
