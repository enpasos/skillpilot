# SkillPilot Claude Connector v1 incident-containment vhost
# This is a deny-only replacement for the active connector vhost. Keep the
# dedicated certificate available so a fresh TLS request can prove that Nginx
# loaded this exact containment generation before credentials are revoked.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp-claude-v1.skillpilot.com;

    ssl_certificate /etc/letsencrypt/live/mcp-claude-v1.skillpilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-claude-v1.skillpilot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # OAuth state, PKCE challenges or malformed credentials may still arrive
    # while containment is active. Never write request targets to an access log.
    access_log off;

    add_header X-SkillPilot-Claude-V1-Containment "SP-CLAUDE-V1-CONTAINED-1" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        return 404;
    }
}
