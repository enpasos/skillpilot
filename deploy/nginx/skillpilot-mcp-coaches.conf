# SkillPilot MCP plugin origins.
#
# Include this file from inside the existing nginx `http {}` block. It is an
# additive vhost definition, not a replacement for the established
# skillpilot.com server blocks. A separate narrowly scoped location snippet
# prevents main-origin aliases. The certificate lineage is created separately
# with Certbot and covers exactly the nine major-version server names below.

server {
    listen 80;
    server_name
        mcp-coach-v1.skillpilot.com
        mcp-coach-v2.skillpilot.com
        mcp-coach-v3.skillpilot.com
        mcp-coach-v4.skillpilot.com
        mcp-coach-v5.skillpilot.com
        mcp-coach-v6.skillpilot.com
        mcp-coach-v7.skillpilot.com
        mcp-coach-v8.skillpilot.com
        mcp-coach-v9.skillpilot.com;

    location / {
        return 308 https://$host$request_uri;
    }
}

# The only currently active public plugin contract.
server {
    listen 443 ssl;
    http2 on;
    server_name mcp-coach-v1.skillpilot.com;

    ssl_certificate /etc/letsencrypt/live/skillpilot-mcp-coaches/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillpilot-mcp-coaches/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Ask for the OpenAI-managed connector certificate without making absence
    # a TLS-handshake failure. The loopback verifier applies the root-owned
    # observe/enforce policy below and still rejects every invalid certificate.
    ssl_client_certificate /etc/skillpilot/openai-mtls/openai-client-ca-bundle.pem;
    ssl_trusted_certificate /etc/skillpilot/openai-mtls/openai-client-ca-bundle.pem;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    # This root-owned file contains exactly one fixed literal assignment:
    #   set $skillpilot_openai_mtls_mode observe;
    # or
    #   set $skillpilot_openai_mtls_mode enforce;
    # It must never be generated from a request header, query parameter or URL.
    include /etc/skillpilot/openai-mtls/mode.conf;

    # nginx reports an invalid presented certificate using its internal 495
    # status. Normalize certificate failures to the public fail-closed status.
    # 496 is included defensively if the TLS policy is tightened in the future.
    error_page 495 496 =403 @skillpilot_openai_mtls_rejected;

    location @skillpilot_openai_mtls_rejected {
        add_header Cache-Control "no-store" always;
        return 403;
    }

    location = /_skillpilot_openai_mtls_verify {
        internal;
        proxy_pass http://127.0.0.1:8792/verify;
        proxy_http_version 1.1;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 15s;

        proxy_set_header Host 127.0.0.1;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Cookie "";

        # These four values are derived exclusively from root-owned nginx
        # configuration and the current TLS connection. The verifier uses the
        # original socket peer address for the narrow loopback operator lane.
        # $realip_remote_addr remains the socket peer even if a parent Nginx
        # configuration enables ngx_http_realip_module for other vHosts.
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Mode $skillpilot_openai_mtls_mode;
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Remote-Addr $realip_remote_addr;
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Client-Verify $ssl_client_verify;
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Client-Cert $ssl_client_escaped_cert;

        # Do not forward Internet-provided identity or forwarding aliases to
        # the verifier. The four authoritative inputs above are the only ones.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Scheme "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Envoy-External-Address "";
        proxy_set_header Front-End-Https "";
        proxy_set_header X-Url-Scheme "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Classification "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Status "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "";
        proxy_set_header X-OpenAI-Client-Verify "";
        proxy_set_header X-OpenAI-Client-Cert "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-Cert "";
        proxy_set_header X-SSL-Cert "";
        proxy_set_header SSL-Client-Verify "";
        proxy_set_header SSL-Client-Cert "";
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-Client-Certificate "";
        proxy_set_header X-TLS-Client-Cert "";
        proxy_set_header X-Verified-Client-Cert "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Forwarded-TLS-Client-Cert "";
    }

    location = /mcp {
        # Always classify this connection through the loopback verifier. In
        # observe mode it admits an absent certificate as OBSERVE_NO_CERT. In
        # enforce mode only VERIFIED or the socket-loopback LOCAL_OPERATOR
        # lane can receive a 204 response. A presented invalid certificate is
        # rejected in both modes.
        auth_request /_skillpilot_openai_mtls_verify;
        auth_request_set $skillpilot_openai_mtls_classification
            $upstream_http_x_skillpilot_openai_mtls_classification;
        auth_request_set $skillpilot_openai_mtls_san
            $upstream_http_x_skillpilot_openai_mtls_san;

        proxy_pass http://127.0.0.1:8787/internal/openai/v1/mcp;
        proxy_http_version 1.1;

        proxy_set_header Host mcp-coach-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-coach-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Scheme "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Client-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Envoy-External-Address "";
        proxy_set_header Front-End-Https "";
        proxy_set_header X-Url-Scheme "";
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        # Only nginx may create the backend's mTLS classification. All older
        # or common proxy certificate aliases are removed explicitly.
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Mode $skillpilot_openai_mtls_mode;
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Classification
            $skillpilot_openai_mtls_classification;
        proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN $skillpilot_openai_mtls_san;
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Status "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Remote-Addr "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Client-Verify "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Client-Cert "";
        proxy_set_header X-OpenAI-Client-Verify "";
        proxy_set_header X-OpenAI-Client-Cert "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-Cert "";
        proxy_set_header X-SSL-Cert "";
        proxy_set_header SSL-Client-Verify "";
        proxy_set_header SSL-Client-Cert "";
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-Client-Certificate "";
        proxy_set_header X-TLS-Client-Cert "";
        proxy_set_header X-Verified-Client-Cert "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Forwarded-TLS-Client-Cert "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:8787/internal/openai/v1/protected-resource-metadata;
        proxy_http_version 1.1;

        proxy_set_header Host mcp-coach-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-coach-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Scheme "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Client-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Envoy-External-Address "";
        proxy_set_header Front-End-Https "";
        proxy_set_header X-Url-Scheme "";
        proxy_set_header Connection "";

        # Discovery is public and never carries an mTLS identity downstream.
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Mode "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Classification "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Status "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Remote-Addr "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Client-Verify "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Client-Cert "";
        proxy_set_header X-OpenAI-Client-Verify "";
        proxy_set_header X-OpenAI-Client-Cert "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-Cert "";
        proxy_set_header X-SSL-Cert "";
        proxy_set_header SSL-Client-Verify "";
        proxy_set_header SSL-Client-Cert "";
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-Client-Certificate "";
        proxy_set_header X-TLS-Client-Cert "";
        proxy_set_header X-Verified-Client-Cert "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Forwarded-TLS-Client-Cert "";
        proxy_intercept_errors off;
    }

    location = /.well-known/openai-apps-challenge {
        proxy_pass http://127.0.0.1:8787/internal/openai/v1/openai-apps-challenge;
        proxy_http_version 1.1;

        proxy_set_header Host mcp-coach-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Host mcp-coach-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Scheme "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Client-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Envoy-External-Address "";
        proxy_set_header Front-End-Https "";
        proxy_set_header X-Url-Scheme "";
        proxy_set_header Connection "";

        # Domain verification is public and never carries an mTLS identity.
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Mode "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Classification "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Status "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Remote-Addr "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Client-Verify "";
        proxy_set_header X-SkillPilot-OpenAI-mTLS-Client-Cert "";
        proxy_set_header X-OpenAI-Client-Verify "";
        proxy_set_header X-OpenAI-Client-Cert "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-Cert "";
        proxy_set_header X-SSL-Cert "";
        proxy_set_header SSL-Client-Verify "";
        proxy_set_header SSL-Client-Cert "";
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-Client-Certificate "";
        proxy_set_header X-TLS-Client-Cert "";
        proxy_set_header X-Verified-Client-Cert "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Forwarded-TLS-Client-Cert "";
        proxy_intercept_errors off;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}

# Reserved future major versions. Never proxy these to the V1 contract.
server {
    listen 443 ssl;
    http2 on;
    server_name
        mcp-coach-v2.skillpilot.com
        mcp-coach-v3.skillpilot.com
        mcp-coach-v4.skillpilot.com
        mcp-coach-v5.skillpilot.com
        mcp-coach-v6.skillpilot.com
        mcp-coach-v7.skillpilot.com
        mcp-coach-v8.skillpilot.com
        mcp-coach-v9.skillpilot.com;

    ssl_certificate /etc/letsencrypt/live/skillpilot-mcp-coaches/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillpilot-mcp-coaches/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
