# Dedicated HTTP-01 bootstrap for mcp-claude-v1.skillpilot.com.
#
# Include this file once from the nginx `http` context. The server never proxies
# application traffic. Certbot's nginx authenticator may install a temporary,
# exact ACME challenge location while issuing or renewing the dedicated
# certificate; every other request remains fail-closed.
server {
    listen 80;
    listen [::]:80;
    server_name mcp-claude-v1.skillpilot.com;

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
