# Bootstrap only. Include once from nginx's http context, then issue the
# dedicated certificate using the dedicated webroot. No app traffic.
server {
    listen 80;
    listen [::]:80;
    server_name mcp-gemini-v1.skillpilot.com;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/skillpilot-gemini-acme;
        default_type text/plain;
        autoindex off;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}
