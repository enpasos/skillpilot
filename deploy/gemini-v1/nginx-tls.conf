# Dedicated Gemini origin. Replace its own ACME bootstrap include with this
# file after certificate issuance; leave all other provider vhosts intact.
server {
    listen 80;
    listen [::]:80;
    server_name mcp-gemini-v1.skillpilot.com;
    access_log off;
    error_log /dev/null crit;
    # Retain this exact dedicated webroot after bootstrap, including renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/skillpilot-gemini-acme;
        default_type text/plain;
        autoindex off;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp-gemini-v1.skillpilot.com;
    ssl_certificate /etc/letsencrypt/live/mcp-gemini-v1.skillpilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-gemini-v1.skillpilot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Nginx error records can contain full authorization request targets too.
    # Safe route/status audit is kept by the gateway, without query or bodies.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ ^/(mcp|authorize|consent|token|revoke|health|privacy|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource(/mcp)?)$ {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
        proxy_set_header Host mcp-gemini-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host mcp-gemini-v1.skillpilot.com;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Authorization $http_authorization;
    }

    location / { return 404; }
}
