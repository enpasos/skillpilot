# Primary public edge for SkillPilot Coach DE v1.
#
# Include this file only inside the TLS `server` block whose server_name is
# `mcp-v1.skillpilot.com`. The public `/mcp` path is proxied directly to the
# stable internal Spring endpoint. There is deliberately no redirect: MCP
# clients must not have to discover a second origin or path.
#
# Browser-readable discovery and domain verification stay reachable without a
# client certificate. The MCP resource itself remains fail-closed when the
# optional OpenAI connector mTLS hardening is enabled.

ssl_client_certificate /etc/skillpilot/openai-mtls/openai-client-ca-bundle.pem;
ssl_trusted_certificate /etc/skillpilot/openai-mtls/openai-client-ca-bundle.pem;
ssl_verify_client optional;
ssl_verify_depth 2;

location = /_skillpilot/openai-mtls/verify-v1 {
    internal;
    proxy_pass http://127.0.0.1:8792/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # Always overwrite any same-named Internet header with TLS variables.
    proxy_set_header X-OpenAI-Client-Verify $ssl_client_verify;
    proxy_set_header X-OpenAI-Client-Cert $ssl_client_escaped_cert;
}

location = /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:8787/.well-known/oauth-protected-resource;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Provider certificate headers never cross an unprotected location.
    proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "";
    proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN "";
    proxy_set_header X-OpenAI-Client-Verify "";
    proxy_set_header X-OpenAI-Client-Cert "";
    proxy_set_header X-SSL-Client-Cert "";
    proxy_set_header X-SSL-Client-Verify "";
}

location = /.well-known/openai-apps-challenge {
    proxy_pass http://127.0.0.1:8787/.well-known/openai-apps-challenge;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "";
    proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN "";
    proxy_set_header X-OpenAI-Client-Verify "";
    proxy_set_header X-OpenAI-Client-Cert "";
    proxy_set_header X-SSL-Client-Cert "";
    proxy_set_header X-SSL-Client-Verify "";
}

location = /mcp {
    if ($ssl_client_verify != SUCCESS) {
        return 403;
    }
    auth_request /_skillpilot/openai-mtls/verify-v1;

    proxy_pass http://127.0.0.1:8787/internal/openai/de/v1/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # nginx creates these values; externally supplied values are overwritten.
    proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "SUCCESS";
    proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN "mtls.prod.connectors.openai.com";
    proxy_set_header X-OpenAI-Client-Verify "";
    proxy_set_header X-OpenAI-Client-Cert "";
    proxy_set_header X-SSL-Client-Cert "";
    proxy_set_header X-SSL-Client-Verify "";
}

location ^~ /mcp/ {
    if ($ssl_client_verify != SUCCESS) {
        return 403;
    }
    auth_request /_skillpilot/openai-mtls/verify-v1;

    proxy_pass http://127.0.0.1:8787/internal/openai/de/v1/mcp/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "SUCCESS";
    proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN "mtls.prod.connectors.openai.com";
    proxy_set_header X-OpenAI-Client-Verify "";
    proxy_set_header X-OpenAI-Client-Cert "";
    proxy_set_header X-SSL-Client-Cert "";
    proxy_set_header X-SSL-Client-Verify "";
}
