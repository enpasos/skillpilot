# Include this file inside the existing skillpilot.com TLS `server` block.
#
# nginx performs chain validation at TLS time. `optional` is required at
# server scope so browser-based OAuth and well-known discovery remain
# accessible without a client certificate. The two MCP locations below are
# fail-closed.

ssl_client_certificate /etc/skillpilot/openai-mtls/openai-client-ca-bundle.pem;
ssl_trusted_certificate /etc/skillpilot/openai-mtls/openai-client-ca-bundle.pem;
ssl_verify_client optional;
ssl_verify_depth 2;

location = /_skillpilot/openai-mtls/verify {
    internal;
    proxy_pass http://127.0.0.1:8792/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # Always overwrite any same-named Internet header with TLS variables.
    proxy_set_header X-OpenAI-Client-Verify $ssl_client_verify;
    proxy_set_header X-OpenAI-Client-Cert $ssl_client_escaped_cert;
}

location = /api/openai/de/mcp {
    if ($ssl_client_verify != SUCCESS) {
        return 403;
    }
    auth_request /_skillpilot/openai-mtls/verify;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # nginx creates these values; externally supplied values are overwritten.
    proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "SUCCESS";
    proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN "mtls.prod.connectors.openai.com";
    proxy_set_header X-OpenAI-Client-Verify "";
    proxy_set_header X-OpenAI-Client-Cert "";
    proxy_set_header X-SSL-Client-Cert "";
    proxy_set_header X-SSL-Client-Verify "";
}

location ^~ /api/openai/de/mcp/ {
    if ($ssl_client_verify != SUCCESS) {
        return 403;
    }
    auth_request /_skillpilot/openai-mtls/verify;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header X-SkillPilot-OpenAI-mTLS-Verified "SUCCESS";
    proxy_set_header X-SkillPilot-OpenAI-mTLS-SAN "mtls.prod.connectors.openai.com";
    proxy_set_header X-OpenAI-Client-Verify "";
    proxy_set_header X-OpenAI-Client-Cert "";
    proxy_set_header X-SSL-Client-Cert "";
    proxy_set_header X-SSL-Client-Verify "";
}
